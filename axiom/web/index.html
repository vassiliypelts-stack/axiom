      <div class="hint" style="margin-top:4px">«Найти бесплатный» проверит публичные SOCKS5 на доступ к Telegram и подставит живой (для теста; для боя — платный мобильный).</div>
      <pre id="ag-proxy-log" style="display:none;white-space:pre-wrap;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:8px;max-height:200px;overflow:auto;font-size:12px"></pre></div>
    <div class="field"><label>Прогрев</label>
      ${warmReport}
      <div class="hint" style="margin-bottom:6px">Нужно: статус «прогрев» + TG✓ (подключён) + рабочий прокси. Один заход = одна стадия (всего ~14).</div>
      <button id="ag-warm-now">Прогреть сейчас (с логом)</button>
      <pre id="ag-warm-log" style="display:none;white-space:pre-wrap;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:8px;max-height:240px;overflow:auto;font-size:12px"></pre></div>
    <div class="field"><label>🖥 Зайти в аккаунт (Telegram Desktop)</label>
      <div class="hint" style="margin-bottom:6px">Соберёт портативный Telegram с этим аккаунтом — запустишь Telegram.exe и окажешься внутри (полистать/пописать руками). Нужна подключённая живая сессия (TG✓).</div>
      <button id="ag-tdesk">🖥 Войти в Telegram Desktop</button>
      <pre id="ag-tdesk-log" style="display:none;white-space:pre-wrap;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:8px;max-height:160px;overflow:auto;font-size:12px"></pre></div>
    <div class="field"><label>Заглянуть внутрь (профиль + переписки)</label>
      <div class="hint" style="margin-bottom:6px">Покажет прямо здесь, как оформлен аккаунт (аватар / имя / bio / спрятан ли номер) и его последние диалоги — не заходя в Telegram. Только чтение. Нужна подключённая сессия (TG✓).</div>
      <button id="ag-inspect">Показать профиль и переписки</button>
      <div id="ag-inspect-box" style="display:none;margin-top:8px"></div></div>
    <div class="field"><label>📲 Подключить WhatsApp (код привязки)</label>
      <div class="hint" style="margin-bottom:6px">Запросит 8-значный код. Вводишь на телефоне с этим номером: WhatsApp → Связанные устройства → Привязать устройство → «Привязать по номеру телефона». Нужен запущенный WhatsApp-модуль (Node).</div>
      <button id="ag-wa">📲 Получить код WhatsApp</button>
      <div id="ag-wa-code" style="display:none;margin-top:8px;text-align:center;font-size:28px;font-weight:800;letter-spacing:3px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:14px"></div>
      <pre id="ag-wa-log" style="display:none;white-space:pre-wrap;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:8px;max-height:160px;overflow:auto;font-size:12px"></pre></div>
    <div class="field"><label>Чаты аккаунта</label>
      <div class="hint" style="margin-bottom:6px">Соберёт все группы/каналы, где аккаунт уже состоит, в каталог «Чаты». Сейчас за аккаунтом: <b id="ag-chats-cnt">${a.chats_count||0}</b>. Нужна подключённая сессия (TG✓).</div>
      <button id="ag-invent-now">Инвентаризовать чаты сейчас</button>
      <pre id="ag-invent-log" style="display:none;white-space:pre-wrap;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:8px;max-height:200px;overflow:auto;font-size:12px"></pre></div>
    <div class="field"><label>🗂 Резерв чатов (на случай бана)</label>
      <div class="hint" style="margin-bottom:6px">Списки чатов и ссылки, где аккаунт постит/держит контакт. Если забанят — зайдёшь в эти же чаты с другого номера и продолжишь. По строке на чат: название — ссылка — заметка.</div>
      <textarea data-k="chats_backup" rows="5" placeholder="Пикник+Баня Сочи — https://t.me/... — постил, дал результат&#10;Анонс Марафона — https://t.me/...">${esc(a.chats_backup||"")}</textarea>
      <button id="ag-backup-fill" type="button" style="margin-top:6px">⤵ Заполнить из каталога (что за этим аккаунтом)</button></div>
    <div class="field"><label>👥 Аккаунт состоит в чатах</label>
      <button id="ag-show-chats" style="margin-bottom:6px">Показать чаты аккаунта</button>
      <div id="ag-chats-list" style="display:none;max-height:240px;overflow:auto;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px"></div></div>
    <div class="ttoolbar" style="margin:6px 0"><button class="primary" id="ag-save">Сохранить</button></div>`;
  const insp=$("#ag-inspect");if(insp)insp.onclick=async()=>{
    const box=$("#ag-inspect-box");box.style.display="block";
    box.innerHTML='<div class="hint">читаю аккаунт из Telegram… (5–15 сек)</div>';
    const r=await api(`/api/account/${id}/inspect`);
    if(r.error){box.innerHTML='<div style="color:#c0392b">⚠ '+esc(r.error)+'</div>';return;}
    const p=r.profile||{};
    const yn=v=>v===true?'<span style="color:var(--green)">да ✓</span>':v===false?'<span style="color:#c0392b">нет ✕</span>':'—';
    const prof=`<div style="background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px">
      <div style="font-weight:700;font-size:15px">${esc(p.name||'—')} ${p.premium?'⭐':''}</div>
      <div class="hint">${p.username?('@'+esc(p.username)):'без ника'}${p.phone?(' · '+esc(p.phone)):''}</div>
      <div style="margin-top:6px;font-size:13px">📝 bio: ${p.bio?esc(p.bio):'<span class="no">пусто</span>'}</div>
      <div style="margin-top:4px;font-size:13px">🖼 аватар: ${yn(p.has_photo)} &nbsp;·&nbsp; 🔒 номер спрятан: ${yn(p.phone_hidden)}</div></div>`;
    const dlgs=(r.dialogs||[]);
    const list=dlgs.length?dlgs.map(d=>{
      const ico=d.kind==='user'?'👤':d.kind==='channel'?'📢':'👥';
      const un=d.unread?` <span class="badge b-stop">${d.unread}</span>`:'';
      const pre=d.last_out?'→ ':'';
      return `<div class="insp-dlg" data-peer="${d.peer_id}" style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer">
        <div style="font-weight:600;font-size:13px">${ico} ${esc(d.title)}${un}</div>
        <div class="hint" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(pre+(d.last_text||''))||'—'}</div>
        <div class="insp-msgs" style="display:none;margin-top:8px"></div></div>`;
    }).join(''):'<div class="hint">диалогов нет</div>';
    box.innerHTML=prof+'<div style="font-weight:600;margin-bottom:6px">💬 Диалоги (кликни — покажу переписку)</div>'+list;
    box.querySelectorAll('.insp-dlg').forEach(el=>el.addEventListener('click',async(e)=>{
      e.stopPropagation();
      const mbox=el.querySelector('.insp-msgs');
      if(mbox.style.display==='block'){mbox.style.display='none';return;}
      mbox.style.display='block';mbox.innerHTML='<div class="hint">читаю переписку…</div>';
      const mr=await api(`/api/account/${id}/dialog_messages?peer=${el.dataset.peer}`);
      if(mr.error){mbox.innerHTML='<div style="color:#c0392b">⚠ '+esc(mr.error)+'</div>';return;}
      const ms=(mr.messages||[]);
      mbox.innerHTML=ms.length?ms.map(m=>`<div style="display:flex;justify-content:${m.out?'flex-end':'flex-start'};margin:3px 0">
        <div style="max-width:80%;padding:6px 10px;border-radius:10px;font-size:13px;background:${m.out?'var(--accent-soft)':'var(--panel)'};border:1px solid var(--border)">${esc(m.text)}</div></div>`).join(''):'<div class="hint">пусто</div>';
    }));
  };
  const pa=$("#ag-proxy-auto");if(pa)pa.onclick=async()=>{pa.disabled=true;pa.textContent="…";
    const r=await api(`/api/account/${id}/proxy_auto`,{method:"POST"});
    pa.disabled=false;pa.textContent="📡 Авто MTProto из пула (только TG)";
    if(r.error){alert(r.error);return;}
    const inp=$("#ag-proxy-inp");if(inp)inp.value=r.proxy;};
  const pf=$("#ag-proxy-find");if(pf)pf.onclick=async()=>{pf.disabled=true;pf.textContent="ищу живой… (до 4 мин)";
    const log=$("#ag-proxy-log");log.style.display="block";log.textContent="тяну списки и проверяю SOCKS5 на доступ к Telegram…";
    const r=await api(`/api/account/${id}/proxy_find`,{method:"POST"});
    pf.disabled=false;pf.textContent="🔎 Найти бесплатный SOCKS5";
    log.textContent=(r.output||"(пусто)");
    const inp=$("#ag-proxy-inp");if(inp&&r.proxy)inp.value=r.proxy;};
  const wn=$("#ag-warm-now");if(wn)wn.onclick=async()=>{wn.disabled=true;wn.textContent="прогреваю… (до 5 мин)";
    const log=$("#ag-warm-log");log.style.display="block";log.textContent="запускаю прогрев #"+id+"…";
    const r=await api(`/api/account/${id}/warm_now`,{method:"POST"});
    wn.disabled=false;wn.textContent="Прогреть сейчас (с логом)";
    log.textContent=(r.output||"(пусто)");};
  const td=$("#ag-tdesk");if(td)td.onclick=async()=>{td.disabled=true;td.textContent="готовлю вход… (до 3 мин)";
    const log=$("#ag-tdesk-log");log.style.display="block";log.textContent="создаю desktop-сессию и собираю папку…";
    const r=await api(`/api/account/${id}/tdesktop`,{method:"POST"});
    td.disabled=false;td.textContent="🖥 Войти в Telegram Desktop";
    if(r.ok&&r.exe){log.innerHTML='✅ Готово! Открой эту папку и запусти <b>Telegram.exe</b> — ты внутри аккаунта:\n<b>'+esc(r.folder)+'</b>';}
    else if(r.ok&&r.folder){log.innerHTML='✅ Папка с tdata готова: <b>'+esc(r.folder)+'</b>\n(положи рядом Telegram.exe из «ТГ Аккуанты(portable)» и запусти)';}
    else{log.textContent='⚠ '+(r.error||r.output||'не получилось');}};
  const wa=$("#ag-wa");if(wa)wa.onclick=async()=>{wa.disabled=true;wa.textContent="запрашиваю код… (до 45 сек)";
    const cb=$("#ag-wa-code"),log=$("#ag-wa-log");cb.style.display="none";log.style.display="block";log.textContent="запускаю WhatsApp-логин…";
    const r=await api(`/api/account/${id}/wa_login`,{method:"POST"});
    wa.disabled=false;wa.textContent="📲 Получить код WhatsApp";
    if(r.ok&&r.code){cb.style.display="block";cb.textContent=r.code;log.textContent=r.hint||"введи код на телефоне";}
    else{cb.style.display="none";log.textContent='⚠ '+(r.error||'не получилось')+(r.output?'\n'+r.output:'');}};
  const inv=$("#ag-invent-now");if(inv)inv.onclick=async()=>{inv.disabled=true;inv.textContent="собираю чаты… (до 4 мин)";
    const log=$("#ag-invent-log");log.style.display="block";log.textContent="прохожу диалоги аккаунта #"+id+"…";
    const r=await api(`/api/account/${id}/inventory`,{method:"POST"});
    inv.disabled=false;inv.textContent="Инвентаризовать чаты сейчас";
    log.textContent=(r.output||"(пусто)");
    try{const o=JSON.parse((r.output||"").trim().split("\n").pop());if(o&&o.account_id!=null){const c=$("#ag-chats-cnt");if(c)c.textContent=(o.found??"")+"";}}catch(e){}};
  const bf=$("#ag-backup-fill");if(bf)bf.onclick=async()=>{
    const ch=await api(`/api/account/${id}/chats`);
    if(!ch||!ch.length){alert("за этим аккаунтом в каталоге чатов нет — сначала «Инвентаризовать чаты сейчас»");return;}
    const ta=$('[data-k="chats_backup"]');
    ta.value=ch.map(c=>[c.title||"—",c.link||(c.username?("https://t.me/"+c.username):"")].filter(Boolean).join(" — ")).join("\n");};
  const sc=$("#ag-show-chats");if(sc)sc.onclick=async()=>{
    const box=$("#ag-chats-list");box.style.display=box.style.display==="none"?"block":"none";
    if(box.innerHTML)return;box.innerHTML='<div class="hint">загружаю…</div>';
    const ch=await api(`/api/account/${id}/chats`);
    if(!ch||!ch.length){box.innerHTML='<div class="hint">аккаунт пока не состоит в чатах — нажми «Инвентаризовать чаты сейчас»</div>';return;}
    box.innerHTML=ch.map(c=>`<div style="padding:5px 6px;border-bottom:1px solid var(--border);font-size:12px">

// ─── Отчёт по каналу: о чём пишут, как часто, что заходит ────────────────────
// Диаграммы рисуем сами (inline SVG + CSS-бары): пульт обязан работать в закрытом
// контуре, а внешний Chart.js тянул бы CDN. Данные считает channels/channel_report.
let CR_DAYS=30;
function crBars(items,valKey,labKey,color){
  const max=Math.max(1,...items.map(i=>+i[valKey]||0));
  return items.map(i=>{
    const v=+i[valKey]||0,h=Math.round(100*v/max);
    return `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;min-width:0">
      <div title="${esc(String(i[labKey]))}: ${v}" style="width:100%;background:${color};border-radius:3px 3px 0 0;height:${Math.max(h,v?3:0)}%"></div>
      <div style="font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden">${esc(String(i[labKey]))}</div>
    </div>`;}).join("");
}
function crSpark(byDay){
  if(!byDay.length)return "";
  const max=Math.max(1,...byDay.map(d=>d.posts));
  const w=Math.max(320,byDay.length*14),h=70;
  const pts=byDay.map((d,i)=>{
    const x=byDay.length>1?(i*(w-12)/(byDay.length-1))+6:w/2;
    return `${x.toFixed(1)},${(h-8-(h-20)*d.posts/max).toFixed(1)}`;}).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:70px">
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
  </svg>`;
}

          <div class="hint">${t.engagement}% отклика · 👁 ${Number(t.views||0).toLocaleString("ru-RU")} · ❤ ${t.reactions||0} · 💬 ${t.replies||0} · ${fmt(t.ts)}${t.link?' · <a class="ext" href="'+esc(t.link)+'" target="_blank">открыть ↗</a>':""}</div>
          <div style="font-size:13px;margin-top:3px">${esc(t.text||"")}</div></div>`).join("")}
        <div style="margin-top:14px"><button class="modal-close">закрыть</button></div>`;
    }
    inner.querySelector(".modal-close").onclick=close;
    inner.querySelectorAll(".cr-d").forEach(b=>b.onclick=()=>{CR_DAYS=+b.dataset.d;draw();});
    const cb=inner.querySelector("#cr-collect");
    if(cb)cb.onclick=async()=>{
      const m=inner.querySelector("#cr-msg");cb.disabled=true;cb.textContent="собираю…";
      // Сбор идёт до нескольких минут и всё это время наружу нет ни звука — без
      // счётчика кнопка выглядит мёртвой, и её жмут повторно.
      let sec=0;const tick=setInterval(()=>{sec++;m.textContent=`иду в Telegram за постами… ${sec} с (обычно 30-120 с)`;},1000);
      m.textContent="иду в Telegram за постами…";
      let res;
      try{res=await api(`/api/chatcat/${cid}/report/collect`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({days:CR_DAYS})});}
      catch(e){res={error:"запрос оборвался: "+e.message};}
      clearInterval(tick);
      cb.disabled=false;cb.textContent="⟳ Обновить из Telegram";
      if(!res||res.ok===false||res.error){
        m.innerHTML='<span style="color:#c0392b">'+esc((res&&res.error)||"не удалось собрать")+"</span>";return;}
      m.textContent=`собрано: новых ${res.new||0}, обновлено ${res.refreshed||0}`;
      draw();
    };
  };
  await draw();
}

// Тихо обновить данные чатов и перерисовать ТОЛЬКО таблицу — без route(), чтобы страница
// не прыгала под пользователем (частая жалоба: скан заканчивался и сбрасывал прокрутку/фильтр).
async function ccRefreshInPlace(){
  let fresh;try{fresh=await api("/api/chatcat");}catch(e){return;}
  CHATCAT.length=0;CHATCAT.push(...fresh);   // мутируем НА МЕСТЕ — smartTable держит ссылку на этот массив
  if(CC_TABLE)CC_TABLE.redraw();
  ccRenderVerdictSummary();
}

// Быстрые чипы-фильтры над таблицей чатов: избранные / годные / могу писать / без мусора.
function ccFilterWire(){
  const paint=()=>document.querySelectorAll(".ccf").forEach(b=>{
    const on=CC_FILTER[b.dataset.f];
    b.style.background=on?"var(--accent)":"";b.style.color=on?"#fff":"";b.style.fontWeight=on?"600":"";});
  const apply=()=>{if(CC_TABLE)CC_TABLE.redraw();paint();
    const h=$("#ccf-hint");if(h){const on=Object.keys(CC_FILTER).filter(k=>CC_FILTER[k]);
      h.textContent=on.length?`показаны только: ${on.map(k=>({fav:"⭐избранные",good:"✅годные",canwrite:"✍️могу писать",notrash:"без мусора"}[k])).join(" + ")}`
        :"кликай — фильтры складываются. Звёздочку ставь в таблице, первый столбец.";}};
  document.querySelectorAll(".ccf").forEach(b=>b.onclick=()=>{CC_FILTER[b.dataset.f]=!CC_FILTER[b.dataset.f];apply();});
  const clr=$("#ccf-clear");if(clr)clr.onclick=()=>{Object.keys(CC_FILTER).forEach(k=>CC_FILTER[k]=false);apply();};
  paint();
}

// Сводка «сколько чего» над таблицей — видно на глаз, что каталог ещё не разобран.
function ccRenderVerdictSummary(){
  // NB: CHATCAT объявлена через `let` — свойства window она НЕ создаёт, поэтому
  // обращаемся к ней напрямую (проверка window.CHATCAT молча ломала бы отрисовку).
  const box=$("#cc-verdict-sum"); if(!box||!CHATCAT||!CHATCAT.length)return;
  const rows=CHATCAT, n=rows.length;
  const scanned=rows.filter(r=>r.last_scanned_at).length;
  const cnt={};rows.forEach(r=>{if(r.verdict)cnt[r.verdict]=(cnt[r.verdict]||0)+1;});
  const undecided=rows.filter(r=>!r.verdict).length;
  const parts=Object.keys(CHAT_VERDICT).filter(k=>cnt[k]).map(k=>
    `<span class="badge b-${CHAT_VERDICT_CLS[k]}">${CHAT_VERDICT[k]}: ${cnt[k]}</span>`);
  if(undecided)parts.push(`<span class="badge b-nurture">без вердикта: ${undecided}</span>`);
  box.innerHTML=`<span style="display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px">
    <b>Всего ${n}</b> · проверено сканом <b>${scanned}</b> (${n?Math.round(scanned/n*100):0}%) — ${parts.join(" ")}</span>`;
}

function ccScanPoll(){
  clearInterval(CC_SCAN_TIMER);
  const el=()=>$("#cc-scan-prog");
  CC_SCAN_TIMER=setInterval(async()=>{
    if(!el()){clearInterval(CC_SCAN_TIMER);return;}
    let p;try{p=await api("/api/chatcat/scan_progress");}catch(e){return;}
    if(!p||!p.total){el().textContent="";return;}
    const pct=Math.round((p.done||0)/p.total*100);
    const tail=`✅ ${p.ok||0} · 💀 мёртвых ${p.dead||0} · ⚠ сбоев ${p.err||0}`;
    // Пока идёт — трогаем ТОЛЬКО строку прогресса (мелкий текст), таблицу не дёргаем,
    // чтобы можно было спокойно читать. Обновим её один раз, когда скан закончится.
    if(p.running){el().innerHTML=`<b>${p.done||0}/${p.total}</b> (${pct}%) — ${tail} · идёт… `
        +`<button id="cc-scan-peek" style="font-size:11px;padding:1px 6px">подтянуть сейчас</button>`;
      const pk=$("#cc-scan-peek");if(pk)pk.onclick=ccRefreshInPlace;}
    else{el().innerHTML=`<span style="color:var(--green)">✅ готово: ${p.done||0}/${p.total} — ${tail}</span>`;
      clearInterval(CC_SCAN_TIMER);ccRefreshInPlace();}
  },3000);
}

function ccScanWire(){
  const msg=t=>{const e=$("#cc-scan-prog");if(e)e.innerHTML=t;};
  const start=async(body,btn)=>{
    const b=$(btn);b.disabled=true;
    const r=await api("/api/chatcat/scan_all",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    b.disabled=false;
    if(r.error){msg('<span style="color:#c0392b">'+esc(r.error)+'</span>');return;}
    if(!r.workers){msg('<span style="color:#c0392b">нет живых рабочих аккаунтов — иду главным. Проверь живость в «Аккаунтах»</span>');}
    msg(`запустил: ${r.queued} чатов силами ${r.workers||1} аккаунт(ов)…`);
    ccScanPoll();
  };
  $("#cc-scanall").onclick=()=>{
    const n=(CHATCAT||[]).filter(r=>!r.last_scanned_at).length;
    if(!confirm(`Проверить ${n} непроверенных чатов рабочими аккаунтами?\n\nТолько чтение, без вступления. Идёт в фоне с паузами — можно закрыть страницу.`))return;
    start({},"#cc-scanall");
  };
  $("#cc-scanfav").onclick=()=>start({favorites:true},"#cc-scanfav");
  $("#cc-scanstop").onclick=async()=>{await api("/api/chatcat/scan_stop",{method:"POST"});msg("⏹ останавливаю — воркеры дочитывают текущий чат…");};
  ccScanPoll();
}

  $("#cc-backfill").onclick=async()=>{

    try{const r=await api("/api/maintenance/backfill",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chats:true,photos:true,limit:300})});
      if(!r.ok){m.innerHTML='<span style="color:#c0392b">ошибка — '+esc((r.output||"").slice(-300))+'</span>';}

        m.innerHTML=`✅ чаты: дозаполнено <b>${c.filled||0}</b> из ${c.candidates||0}${c.left?", осталось "+c.left+" (жми ещё раз)":""}; фото: скачано <b>${p.downloaded||0}</b>${p.no_photo?", без аватара "+p.no_photo:""}. Обновляю…`;

    }catch(e){m.innerHTML='<span style="color:#c0392b">ошибка запуска</span>';}
    b.disabled=false;b.textContent="🧩 Дозаполнить";
  };
  $("#cc-add").onclick=async()=>{const t=$("#cc-target").value.trim();if(!t)return;
    const r=await api("/api/chatcat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({target:t})});
    if(r.error){alert(r.error);return;}route();setTimeout(()=>openChat(r.id),200);};
  const tsGo=$("#cc-ts-go");
  if(tsGo)tsGo.onclick=async()=>{
    const q=$("#cc-ts-q").value.trim(),m=$("#cc-ts-msg");
    if(!q){m.textContent="введи запрос";return;}
    const kind=$("#cc-ts-kind").value;
    tsGo.disabled=true;tsGo.textContent="ищу…";m.textContent="запрашиваю каталог TGStat…";
    const r=await api("/api/chatcat/tgstat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({q,min_members:+$("#cc-ts-min").value||0,
        groups_only:kind==="groups",channels_only:kind==="channels"})});
    tsGo.disabled=false;tsGo.textContent="Найти в TGStat";
    // Модуль печатает JSON последней строкой — вытаскиваем его из вывода процесса.
    let res=null;try{res=JSON.parse((r.output||"").trim().split("\n").pop());}catch(e){}
    if(res&&res.ok===false){m.innerHTML='<span style="color:#c0392b">'+esc(res.error)+'</span>';return;}
    if(!res){m.innerHTML='<span style="color:#c0392b">не разобрал ответ — лог: '+esc((r.output||"").slice(-200))+'</span>';return;}
    m.textContent=`найдено ${res.found}, добавлено ${res.added||0}, обновлено ${res.updated||0}`;
    route();};
  const impBtn=$("#cc-import");
  if(impBtn){impBtn.onclick=function(){showImportChatsDialog("");};};
  $("#cc-inv").onclick=async()=>{const b=$("#cc-inv"),m=$("#cc-inv-msg");b.disabled=true;b.textContent="сканирую…";m.textContent="аккаунт читает свои чаты и заносит в каталог (до ~1-2 мин)…";
    const r=await api("/api/chatcat/inventory",{method:"POST"});
    b.disabled=false;b.textContent="🔄 Инвентаризация";
    if(!r.ok){m.innerHTML='<span style="color:#c0392b">ошибка — лог: '+esc((r.output||"").slice(-300))+'</span>';return;}
    route();};
  const selChat=new Set();
  let ccFiltered=CHATCAT.slice();
  const updCvCnt=()=>{const c=$("#cv-cnt");if(c)c.textContent=selChat.size;};
  CC_TABLE=smartTable($("#cc-body"),{
    tableKey:"chatcat",
    rows:CHATCAT,searchKeys:["title","username","topic","city","kind","can_write"],
    prefilter:r=>{
      if(CC_FILTER.fav && !r.favorite)return false;
      if(CC_FILTER.good && r.verdict!=='годен')return false;
      if(CC_FILTER.canwrite && r.can_write!=='да')return false;
      if(CC_FILTER.notrash && (r.verdict==='мёртвый'||r.verdict==='не годен'))return false;
      return true;},
    onDraw:rows=>{ccFiltered=rows;},
    groupOptions:[{key:"verdict",label:"вердикт"},{key:"topic",label:"тема"},{key:"city",label:"город"},{key:"can_write",label:"могу писать"},{key:"status",label:"статус"},{key:"kind",label:"тип"},{key:"source",label:"откуда"},{key:"parent_title",label:"похож на"}],
    groupFmt:(k,val)=>k==="status"?(CHAT_ST[val]||val):k==="verdict"?(CHAT_VERDICT[val]||"без вердикта")
      :k==="source"?(CHAT_SRC[val]||val||"источник не указан"):k==="parent_title"?(val||"не из похожих"):val,
    onRowClick:openChat,
    columns:[
      {key:"sel",label:"",render:r=>`<input type="checkbox" class="cc-sel" data-id="${r.id}" onclick="event.stopPropagation()" ${selChat.has(r.id)?"checked":""}>`},
      {key:"favorite",label:"⭐",render:r=>`<button class="cc-fav" data-id="${r.id}" onclick="event.stopPropagation()" title="избранный чат — слушать в первую очередь (только ⭐)" style="border:none;background:none;cursor:pointer;font-size:16px;padding:0;line-height:1">${r.favorite?"⭐":"☆"}</button>`},
      {key:"verdict",label:"Вердикт",render:r=>{
        if(!r.verdict)return '<span class="no" title="решение ещё не принято — проверь сканом и одобри">—</span>';
        const src=r.verdict_src==='ai'?' 🤖':r.verdict_src==='скан'?' 🔎':'';
        const tip=r.verdict==='мёртвый'?('чат не существует: '+(r.scan_error||''))
          :r.verdict_src==='ai'?'предварительно от ИИ — подтверди своим решением'
          :r.verdict_src==='человек'?('твоё решение от '+(r.verdict_at||'')):'';
        return `<span class="badge b-${CHAT_VERDICT_CLS[r.verdict]||'nurture'}" title="${esc(tip)}">${CHAT_VERDICT[r.verdict]||esc(r.verdict)}${src}</span>`;}},
      {key:"title",label:"Чат",cls:"name",render:r=>`${r.in_account==='yes'?'👤 ':''}${esc(r.title||r.username||"—")}`},
      {key:"username",label:"Ссылка",render:r=>r.username?`<a class="ext" href="https://t.me/${esc(r.username)}" target="_blank" onclick="event.stopPropagation()">@${esc(r.username)} ↗</a>`:(r.link?`<a class="ext" href="${esc(r.link)}" target="_blank" onclick="event.stopPropagation()">ссылка ↗</a>`:"—")},
      {key:"kind",label:"Тип",cls:"sub",render:r=>esc(r.kind)||"—"},
      {key:"source",label:"Откуда",cls:"sub",render:r=>{
        if(!r.source)return "—";
        const lbl=CHAT_SRC[r.source]||esc(r.source);
        return r.parent_title?`<span title="приехал из похожих на «${esc(r.parent_title)}»">${lbl}</span>`:lbl;}},
      {key:"report",label:"Отчёт",render:r=>`<button class="cc-rep" data-id="${r.id}" onclick="event.stopPropagation()" title="о чём пишут, как часто, что заходит">📊${r.posts_count?" "+r.posts_count:""}</button>`},
      {key:"city",label:"Город",cls:"sub",render:r=>esc(r.city)||"—"},
      {key:"topic",label:"Тема",cls:"sub",render:r=>esc(r.topic)||"—"},
      {key:"members_count",label:"Участники",cls:"mono",render:r=>r.members_count!=null?Number(r.members_count).toLocaleString("ru-RU"):"—"},
      {key:"can_write",label:"Могу писать",render:r=>{
        if(!r.can_write)return '<span class="no" title="чат ещё не проанализирован — жми «📊 Проверить чаты»">— не проверен</span>';
        const stop=["заблокирован","только админы","ограничено"].includes(r.can_write);
        const tip=r.can_write==='заблокирован'?'админы закрыли рот ЛИЧНО тебе — рассылка отсюда не пойдёт'
          :r.can_write==='только админы'?'писать разрешено только админам'
          :r.can_write==='нужно одобрение'?'вступление только по заявке с одобрением админа'
          :r.can_write==='не вступил'?'ты не в чате — сначала вступи':'';
        return `<span class="badge b-${r.can_write==='да'?'active':stop?'stop':'nurture'}" title="${esc(tip)}">${esc(r.can_write)}</span>`;}},
      {key:"members_visible",label:"Участники видны",cls:"sub",render:r=>esc(r.members_visible)||"—"},
      {key:"activity",label:"Активность",cls:"sub",render:r=>esc(r.activity)||"—"},
      {key:"admins_count",label:"Админы",cls:"mono",render:r=>r.admins_count||0},
      {key:"status",label:"Статус робота",render:r=>{
        const b=`<span class="badge b-${r.status==='analyzed'?'active':r.status==='joined'?'won':'nurture'}" title="стадия конвейера — НЕ значит «одобрен». Одобрение — в колонке «Вердикт»">${esc(CHAT_ST[r.status]||r.status)}</span>`;
        const s=r.last_scanned_at?`<br><span class="mono" style="font-size:10px;opacity:.7" title="когда последний раз сканировали">🔎 ${fmt(r.last_scanned_at)}</span>`
          :'<br><span class="no" style="font-size:10px">не сканирован</span>';
        return b+s;}},
    ],
    emptyText:"Чатов нет. «Инвентаризация» подтянет твои чаты, или добавь @username вручную → «Анализ».",
  });
  $("#cc-body").addEventListener("click",async(e)=>{
    const rep=e.target.closest(".cc-rep");
    if(rep){e.stopPropagation();openChatReport(+rep.dataset.id);return;}
    const b=e.target.closest(".cc-fav");if(!b)return;e.stopPropagation();
    const id=+b.dataset.id,row=CHATCAT.find(c=>c.id===id);const nv=row&&row.favorite?0:1;
    b.textContent=nv?"⭐":"☆";if(row)row.favorite=nv;
    await api(`/api/chatcat/${id}/update`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({favorite:nv})});
  });
  // ── аппрув: выбор строк + массовый вердикт ──
  $("#cc-body").addEventListener("change",(e)=>{
    const cb=e.target.closest(".cc-sel");
    if(cb){const id=+cb.dataset.id;if(cb.checked)selChat.add(id);else selChat.delete(id);updCvCnt();}
  });
  const syncCvDom=()=>{$("#cc-body").querySelectorAll(".cc-sel").forEach(cb=>cb.checked=selChat.has(+cb.dataset.id));updCvCnt();};
  $("#cv-selall").onclick=()=>{ccFiltered.forEach(r=>selChat.add(r.id));syncCvDom();$("#cv-msg").textContent=`выделено ${ccFiltered.length} (видимых после фильтра)`;};
  $("#cv-selnone").onclick=()=>{selChat.clear();syncCvDom();$("#cv-msg").textContent="выделение снято";};
  const setVerdict=async(verdict,label)=>{
    if(!selChat.size){$("#cv-msg").textContent="ничего не выбрано";return;}
    const r=await api("/api/chatcat/verdict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ids:[...selChat],verdict})});
    if(r.error){$("#cv-msg").innerHTML='<span style="color:#c0392b">'+esc(r.error)+'</span>';return;}
    $("#cv-msg").innerHTML=`<span style="color:var(--green)">${label}: ${r.updated} чат(ов)</span>`;
    setTimeout(route,900);
  };
  $("#cv-good").onclick=()=>setVerdict("годен","✅ одобрено");
  $("#cv-bad").onclick=()=>setVerdict("не годен","🚫 отклонено");
  $("#cv-maybe").onclick=()=>setVerdict("на проверку","🤔 отложено");
  $("#cv-clear").onclick=()=>setVerdict("","вердикт снят");
}
function renderChatAgents(agents){
  if(!agents||!agents.length)return '<div class="no">пока нет — «🔄 Инвентаризация» или «🚀 Разослать армию по чатам»</div>';
  return `<table style="margin:0"><thead><tr><th>Агент</th><th>TG</th><th>Статус</th></tr></thead><tbody>`+
    agents.map(a=>`<tr><td><span class="lnk" data-agid="${a.id}" style="cursor:pointer;color:var(--accent)">${esc(a.label||("#"+a.id))} ↗</span></td>`+
      `<td>${a.username?`<a class="ext" href="https://t.me/${esc(a.username)}" target="_blank">@${esc(a.username)} ↗</a>`:'<span class="no">—</span>'}</td>`+
      `<td>${esc(ACC_ST[a.status]||a.status||"—")}</td></tr>`).join("")+
    `</tbody></table>`;
}
function renderChatAdmins(admins){
  if(!admins||!admins.length)return '<div class="no">пока нет — нажми «📊 Анализ»</div>';
  return `<table style="margin:0"><thead><tr><th>Имя</th><th>Аккаунт</th></tr></thead><tbody>`+
    admins.map(a=>`<tr><td>${esc(a.name||"—")}</td><td>${a.username?`<a class="ext" href="https://t.me/${esc(a.username)}" target="_blank">@${esc(a.username)} ↗</a>`:'<span class="no">скрыт</span>'}</td></tr>`).join("")+
    `</tbody></table>`;
}
async function openChat(id){
  const c=await api(`/api/chatcat/${id}`);
  $("#dr-title").textContent=c.title||c.username||("Чат #"+id);
  // 'queued' убран: его никто не писал и не читал — мёртвое значение, только путало.
  const STO=[["new","новый"],["analyzed","проанализирован"],["joined","вступил"],["skip","пропуск"]];
  const VDO=[["","— не решено —"],["годен","✅ годен"],["не годен","🚫 не годен"],["на проверку","🤔 на проверку"],["мёртвый","💀 мёртвый"]];
  $("#dr-body").innerHTML=`
    <div class="ttoolbar" style="margin:0 0 10px"><button class="primary" id="cc-scan">📊 Анализ (чтение)</button>
      ${c.username?`<a class="ext" href="https://t.me/${esc(c.username)}" target="_blank">открыть в TG ↗</a>`:""}</div>
    <div id="cc-scan-msg" class="hint"></div>
    <div class="row2"><div class="field"><label>Участники</label><div class="v mono">${c.members_count!=null?Number(c.members_count).toLocaleString("ru-RU"):"—"}</div></div>
      <div class="field"><label>Активность</label><div class="v">${esc(c.activity)||"—"}</div></div></div>
    <div class="row2"><div class="field"><label>Могу писать</label><div class="v">${c.can_write?`<span class="badge b-${c.can_write==='да'?'active':(c.can_write==='заблокирован'||c.can_write==='только админы'||c.can_write==='ограничено')?'stop':'nurture'}">${esc(c.can_write)}</span>`:"—"}</div></div>
      <div class="field"><label>Список участников</label><div class="v">${c.members_access?`<span class="badge b-${c.members_access==='открыт'?'active':c.members_access==='закрыт'?'stop':'nurture'}">${esc(c.members_access)}</span>`:(esc(c.members_visible)||"—")}</div></div></div>
    <div class="row2"><div class="field"><label>Можно выгрузить целиком</label><div class="v">${c.can_export_all?esc(c.can_export_all):"—"}${c.can_export_all==='частично'?' <span class="sub">(>10k — остальных добираем комментаторами)</span>':""}</div></div>
      <div class="field"></div></div>
    <div class="row2"><div class="field"><label>Тип</label><div class="v">${esc(c.kind)||"—"}${c.in_account==='yes'?' · <span class="badge b-active">в моём аккаунте</span>':""}</div></div>
      <div class="field"><label>Статус робота <span class="sub">(стадия, не одобрение)</span></label><select data-k="status">${STO.map(([k,l])=>`<option value="${k}" ${k===c.status?"selected":""}>${l}</option>`).join("")}</select></div></div>
    <div class="row2"><div class="field"><label>✔ Вердикт <span class="sub">(твоё решение — рассылка берёт только «годен»)</span></label>
        <select data-k="verdict">${VDO.map(([k,l])=>`<option value="${k}" ${k===(c.verdict||"")?"selected":""}>${l}</option>`).join("")}</select>
        ${c.verdict_src?`<div class="sub" style="margin-top:4px">поставил: ${c.verdict_src==='ai'?'🤖 ИИ (предварительно — подтверди своим)':c.verdict_src==='скан'?'🔎 скан':'👤 ты'} ${c.verdict_at?'· '+fmt(c.verdict_at):''}</div>`:""}</div>
      <div class="field">${c.scan_error?`<label>⚠ Ошибка скана</label><div class="v sub" style="color:#c0392b">${esc(c.scan_error)}</div>`:""}</div></div>
    ${c.summary?`<div class="field"><label>🧠 AI-описание чата</label><div class="v" style="white-space:pre-wrap;background:var(--panel2);padding:8px;border-radius:6px">${esc(c.summary)}</div></div>`:""}
    <div class="row2"><div class="field"><label>Тема/ниша</label><input data-k="topic" value="${esc(c.topic||"")}"></div>
      <div class="field"><label>Город</label><input data-k="city" value="${esc(c.city||"")}"></div></div>
    <div class="field"><label>Заметки</label><textarea data-k="notes" rows="2">${esc(c.notes||"")}</textarea></div>
    <div class="ttoolbar" style="margin:4px 0"><button class="primary" id="cc-save">Сохранить</button><button id="cc-del">Удалить</button></div>
    <hr><label style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px">Мои агенты в этом чате (${(c.agents||[]).length})</label>
    <div id="cc-agents" style="margin-top:6px">${renderChatAgents(c.agents)}</div>
    <hr><label style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px">Админы (${(c.admins||[]).length}) — часто это ЛПР</label>
    <div id="cc-admins" style="margin-top:6px">${renderChatAdmins(c.admins)}</div>
    ${c.last_scanned_at?`<div class="sub" style="margin-top:8px">проанализирован ${fmt(c.last_scanned_at)}</div>`:""}`;
  $("#dr-body").querySelectorAll(".lnk[data-agid]").forEach(el=>el.onclick=()=>openAgent(+el.dataset.agid));
  $("#cc-scan").onclick=async()=>{const b=$("#cc-scan"),m=$("#cc-scan-msg");b.disabled=true;b.textContent="анализирую… (до ~1 мин)";m.textContent="аккаунт читает чат: участники, активность, админы, AI-тема…";
    const r=await api(`/api/chatcat/${id}/scan`,{method:"POST"});
    if(!r.ok){m.innerHTML='<span style="color:#c0392b">ошибка анализа — проверь @username и что аккаунт авторизован. Лог: '+esc((r.output||"").slice(-300))+'</span>';b.disabled=false;b.textContent="📊 Анализ (чтение)";return;}
    openChat(id);};
  $("#cc-save").onclick=async()=>{const body={};$("#dr-body").querySelectorAll("[data-k]").forEach(el=>body[el.dataset.k]=el.type==="checkbox"?el.checked:el.value);
    await api(`/api/chatcat/${id}/update`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    $("#cc-save").textContent="✓ сохранено";setTimeout(route,500);};
  $("#cc-del").onclick=async()=>{if(!confirm("Удалить чат из каталога?"))return;
    await api(`/api/chatcat/${id}/delete`,{method:"POST"});$("#drawer").classList.remove("open");route();};
  $("#drawer").classList.add("open");
}

function showImportChatsDialog(initialText){
  const html=`<div style="padding:20px;max-width:600px">
    <h3 style="margin:0 0 12px">📤 Импортировать чаты</h3>
    <div class="sub" style="margin-bottom:12px">Укажи ссылки или username'ы (по одной в строке). Или загрузи CSV/TXT файл.</div>
    <div style="margin-bottom:12px">
      <label style="display:block;margin-bottom:6px;font-weight:500">Вариант 1: Загрузи файл (CSV/TXT)</label>
      <input type="file" id="imp-file" accept=".csv,.txt" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px">
    </div>
    <div style="text-align:center;color:var(--muted);margin:12px 0">или</div>
    <div style="margin-bottom:12px">
      <label style="display:block;margin-bottom:6px;font-weight:500">📝 Вариант 2: Вставь текст вручную</label>
      <textarea id="imp-text" rows="8" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-family:monospace;font-size:12px;resize:vertical" placeholder="@username&#10;https://t.me/username&#10;t.me/groupname"></textarea>
    </div>
    <div style="display:flex;gap:12px;margin-bottom:12px">
      <div style="flex:1">
        <label style="display:block;margin-bottom:6px;font-weight:500">Город (опционально)</label>
        <input id="imp-city" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px" placeholder="Сочи">
      </div>
      <div style="flex:1">
        <label style="display:block;margin-bottom:6px;font-weight:500">Тема/ниша (опционально)</label>
        <input id="imp-topic" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px" placeholder="Недвижимость">
      </div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="cancel-btn" style="padding:8px 16px;border:none;background:var(--panel2);border-radius:6px;cursor:pointer">Отмена</button>
      <button id="imp-submit" class="primary" style="padding:8px 16px;border:none;border-radius:6px;cursor:pointer">✓ Импортировать</button>
    </div>
    <div id="imp-result" style="margin-top:12px;padding:12px;background:var(--panel2);border-radius:6px;display:none">
      <div id="imp-result-text"></div>
    </div>
  </div>`;
  const modal=document.createElement("div");
  modal.className="modal";modal.style.cssText="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999";
  modal.innerHTML=`<div style="background:var(--bg);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.3);max-width:700px;width:90%;max-height:80vh;overflow-y:auto">${html}</div>`;
  document.body.appendChild(modal);
  const fileInput=modal.querySelector("#imp-file");
  const textArea=modal.querySelector("#imp-text");
  const submit=modal.querySelector("#imp-submit");
  const cancelBtn=modal.querySelector(".cancel-btn");
  cancelBtn.onclick=()=>modal.style.display="none";

  fileInput.onchange=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    const text=await file.text();
    textArea.value=(textArea.value.trim()?textArea.value+"\n":"")+text.trim();
    fileInput.value="";
  };

  submit.onclick=async()=>{
    let text=(textArea.value||"").trim();
    if(!text){alert("укажи хотя бы одну ссылку (загрузи файл или вставь текст)");return;}
    const city=(modal.querySelector("#imp-city").value||"").trim();
    const topic=(modal.querySelector("#imp-topic").value||"").trim();
    submit.disabled=true;submit.textContent="⏳ обработаю…";
    const r=await api("/api/chatcat/import",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,city,topic})});
    const res=modal.querySelector("#imp-result");res.style.display="block";
    if(r.ok){
      res.innerHTML=`<b style="color:var(--green)">✓ Импорт завершён</b><br>добавлено: ${r.added} · пропущено (дубликаты): ${r.skipped}${r.errors.length?'<br><span style="color:var(--red)">ошибки: '+esc(r.errors.slice(0,5).join("; "))+'</span>':""}`;
      setTimeout(()=>{modal.style.display="none";route();},2000);
    }else{
      res.innerHTML=`<b style="color:var(--red)">✗ Ошибка: ${esc(r.error)}</b>`;
      submit.disabled=false;submit.textContent="✓ Импортировать";
    }
  };
}

// ===== ЗАПРОСЫ (ниши + прослушка чатов по ключам) =====
// Заготовки ниш под ИЖС: «горячие» ловят клиента, который ищет прямо сейчас, две
// другие — исполнителей рынка (их же и продаём как аудиторию). Ключи в нижнем регистре
// и по возможности обрезаны до корня («подрядчик ИЖС» → «подрядчик»), потому что
// _match_niche ищет подстрокой и так ловит все склонения.
const NICHE_PRESETS=[
  {name:"ИЖС — горячие запросы", keywords:"ищу подрядчика, ищу бригаду, посоветуйте строителей, кто строит дома, хочу построить дом, планирую строить дом, построить дом под ключ, ищу проект дома, ищу прораба, нужен подрядчик, нужна бригада, сколько стоит построить"},
  {name:"ИЖС — застройщики и подряд", keywords:"строительство домов, каркасный дом, газобетон, фундамент под ключ, дом под ключ, свайный фундамент, кровля под ключ, домокомплект, сип-панел, брусовой дом, строим дома, наша бригада"},
  {name:"Загородная недвижимость", keywords:"риелтор загород, загородная недвижимость, продажа участков, земля ижс, участок ижс, куплю участок, ищу участок, коттеджный посёлок, коттеджный поселок, продам дом, куплю дом, снт участок"},
  // Ключи-ОБРАЩЕНИЯ, а не названия услуг. «Нужен сайт» пишет и заказчик, и студия
  // в рекламе, поэтому такая ниша приносит 99% конкурентов (проверено на живой базе:
  // 275 конкурентов против 3 клиентов). А «посоветуйте, кто делал» — почти всегда
  // живой человек с задачей: рекламу так не пишут.
  {name:"Спрос на услуги — универсально", keywords:"посоветуйте подрядчика, посоветуйте специалиста, посоветуйте кто делает, порекомендуйте подрядчика, кто может сделать, кто делал, кто возьмётся, ищу подрядчика, ищу исполнителя, ищу кто сделает, ищу человека который, к кому обратиться, подскажите кто делает, помогите найти, нужен человек который, сколько будет стоить, во сколько обойдётся, есть ли кто"},
  {name:"ИИ, сайты, автоматизация — спрос", keywords:"посоветуйте разработчика, посоветуйте студию, кто может сделать сайт, кто может сделать бота, кто делал сайт, кто делал лендинг, ищу разработчика, ищу веб-студию, подскажите разработчика, кто занимается автоматизацией, хотим автоматизировать, хотим внедрить ии, планируем внедрять, нужна автоматизация процессов, сколько стоит разработка сайта, сколько стоит бот"},
  {name:"Инвестиции — спрос", keywords:"ищу инвестора, ищу соинвестора, нужен инвестор, привлекаю инвестиции, привлекаем инвестиции, ищу финансирование, нужно финансирование, ищу партнёра в проект, ищу партнера в проект, куда вложить, посоветуйте куда инвестировать, во что вложить"},
];
let HIT_TAB="new";
let HIT_FLASH="";   // что показать после переноса находки (куда именно она уехала)
async function viewLeadHits(v){
  const niches=await api("/api/niches");
  v.innerHTML=`
  <div class="card" style="margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <b style="font-size:14px">🎯 Ниши (наборы ключевых слов)</b>
      <div style="display:flex;align-items:center;gap:10px">
        <label class="hint" style="display:inline-flex;align-items:center;gap:5px;cursor:pointer" title="слушать только чаты, отмеченные ⭐ в каталоге «Чаты»"><input type="checkbox" id="ni-fav"> только ⭐ избранные</label>
        <button class="primary" id="ni-run">🔄 Прослушать чаты сейчас</button></div></div>
    <div class="sub" style="margin-bottom:10px">Слушатель проходит по чатам из каталога «📡 Чаты» и ищет ключи активных ниш. Находки — в очередь ниже на твой обзор (в лиды заносишь сам). <span id="ni-msg"></span></div>
    <div id="ni-status" class="card" style="background:var(--panel2);padding:8px 10px;margin-bottom:10px;font-size:12px">загружаю кто/где слушает…</div>
    <div id="ni-list"></div>
    <div class="ttoolbar" style="margin:10px 0 0"><input id="ni-name" placeholder="Название ниши (напр. Загородная)" style="max-width:240px">
      <input id="ni-kw" class="grow" placeholder="ключи через запятую: куплю дом, ищу участок, ...">
      <button id="ni-add">Ниша</button></div>
    <div class="ttoolbar" style="margin:8px 0 0"><span class="hint">Готовые наборы по ИЖС:</span>
      ${NICHE_PRESETS.map((p,i)=>`<button type="button" class="ni-preset" data-i="${i}" title="${esc(p.keywords)}">${esc(p.name)}</button>`).join("")}
      <span class="hint">— подставит название и ключи в поля выше, дальше правь и жми «Ниша»</span></div>
    <div class="ttoolbar" style="margin:8px 0 0;border-top:1px solid var(--border);padding-top:8px">
      <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="kw-auto"> 🕒 обходить чаты автоматически</label>
      <label class="hint" style="display:inline-flex;align-items:center;gap:4px">каждые <input id="kw-int" type="number" min="15" max="1440" value="60" style="width:64px"> мин</label>
      <button type="button" id="kw-auto-save">Сохранить расписание</button>
      <span class="hint" id="kw-auto-msg"></span></div>
  </div>
  <div class="ttoolbar"><b>Очередь находок:</b>
    <button id="ht-new" class="primary">Новые</button><button id="ht-lead">В лидах</button><button id="ht-ign">Игнор</button>
    <span class="grow"></span><span class="hint" id="ht-cnt"></span></div>
  <div class="ttoolbar" id="ht-intent-bar" style="margin:6px 0 10px">
    <span class="hint">Показать:</span>
    <button class="hi-f primary" data-i="">все</button>
    <button class="hi-f" data-i="client">🎯 клиенты</button>
    <button class="hi-f" data-i="vendor">🏷 конкуренты</button>
    <button class="hi-f" data-i="unknown">❔ не разобрано</button>
    <span class="hint" id="ht-intent-cnt"></span></div>
  <div id="ht-body"></div>`;
  api("/api/keywords/status").then(s=>{const el=$("#ni-status");if(!el||s.error)return;
    const chats=(s.sample||[]).map(c=>c.username?("@"+esc(c.username)):esc(c.title||"чат")).slice(0,10).join(", ");
    el.innerHTML=`👂 <b>Слушает:</b> ${esc(s.account)} · <b>чатов доступно:</b> ${s.chats} (⭐ ${s.favorite}) · <b>активных ниш:</b> ${s.niches}`
      +(chats?`<div class="hint" style="margin-top:4px">по чатам: ${chats}${s.chats>10?" …":""}</div>`:'<div class="hint" style="margin-top:4px;color:#c0392b">нет доступных чатов — добавь в «📡 Чаты» (с @username) и отметь ⭐</div>');
  }).catch(()=>{});
  const nl=$("#ni-list");
  nl.innerHTML=niches.map(n=>`<div class="card" style="padding:10px;margin-bottom:8px;background:var(--panel2)">
    <div class="ttoolbar" style="margin:0"><input data-k="name" data-id="${n.id}" value="${esc(n.name||"")}" style="max-width:180px">
      <label style="display:inline-flex;align-items:center;gap:6px"><input type="checkbox" class="ni-act" data-id="${n.id}" ${n.active?"checked":""}> активна</label>
      <label style="display:inline-flex;align-items:center;gap:5px" title="Одно и то же слово пишут и заказчик, и исполнитель. Здесь выбираешь, кого складывать в находки">кого ловим:
        <select class="ni-hunt" data-id="${n.id}" style="max-width:170px">
          <option value="clients"${(n.hunt_mode||"clients")==="clients"?" selected":""}>только клиентов</option>
          <option value="vendors"${n.hunt_mode==="vendors"?" selected":""}>только конкурентов</option>
          <option value="all"${n.hunt_mode==="all"?" selected":""}>всех подряд</option>
        </select></label>
      <button class="ni-save" data-id="${n.id}">💾</button><button class="ni-enrich" data-id="${n.id}" title="Генерировать новые ключевые слова через Claude">🧠</button><button class="ni-del" data-id="${n.id}">🗑</button></div>
    <textarea data-kw="${n.id}" rows="2" style="width:100%;margin-top:6px" placeholder="ключи через запятую">${esc(n.keywords||"")}</textarea>
    ${(n.hits&&n.hits.total)?`<div class="hint" style="margin-top:5px">улов: ${n.hits.total} находок · <b style="color:${n.hits.client_share>=15?"var(--green)":n.hits.client_share>=5?"inherit":"#c0392b"}">клиентов ${n.hits.client} (${n.hits.client_share}%)</b> · конкурентов ${n.hits.vendor}</div>`:""}
    ${n.advice?`<div style="margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--panel);border-left:3px solid #c0392b;font-size:12.5px">⚠️ ${esc(n.advice)}
      <div style="margin-top:5px"><button type="button" class="ni-fix" data-id="${n.id}">Подставить ключи спроса →</button></div></div>`:""}
    </div>`).join("")||'<div class="no">ниш нет</div>';
  $("#ni-add").onclick=async()=>{const name=$("#ni-name").value.trim();if(!name){alert("название ниши");return;}
    await api("/api/niches",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,keywords:$("#ni-kw").value})});route();};
  v.querySelectorAll(".ni-preset").forEach(b=>b.onclick=()=>{const p=NICHE_PRESETS[+b.dataset.i];
    $("#ni-name").value=p.name;$("#ni-kw").value=p.keywords;$("#ni-kw").focus();});

    b.textContent="✓ подставлено — проверь и жми 💾";b.disabled=true;
    if(old)b.title="прежние ключи: "+old;});
  // расписание авто-обхода. Настройка kw_auto жила только в БД: включить её из пульта

    try{const a=await api("/api/keywords/auto");

    b.textContent="✓";setTimeout(()=>b.textContent="💾",1200);});
  nl.querySelectorAll(".ni-enrich").forEach(b=>b.onclick=async()=>{const id=b.dataset.id;

    b.disabled=false;b.textContent="🔄 Прослушать чаты сейчас";

    else{m.textContent="готово: "+esc((r.output||"").slice(-200));renderHits();}};
  $("#ht-new").onclick=()=>{HIT_TAB="new";setHitTab();renderHits();};
  $("#ht-lead").onclick=()=>{HIT_TAB="lead";setHitTab();renderHits();};
  $("#ht-ign").onclick=()=>{HIT_TAB="ignored";setHitTab();renderHits();};
  setHitTab();renderHits();
}
function setHitTab(){["new","lead","ignored"].forEach(t=>{const b=$("#ht-"+(t==="ignored"?"ign":t));if(b)b.classList.toggle("primary",HIT_TAB===t);});}
let HIT_INTENT="";   // "" | client | vendor | unknown — фильтр «кого показывать»
async function renderHits(){
  const body=$("#ht-body");if(!body)return;
  if(HIT_TAB==="lead"){await renderTargetLeads(body);return;}
  const d=await api(`/api/hits?status=${HIT_TAB}&intent=${HIT_INTENT}`);
  const cnt=$("#ht-cnt");if(cnt)cnt.textContent=`новых: ${d.counts.new||0} · в лидах: ${d.counts.lead||0} · игнор: ${d.counts.ignored||0}`;
  const bi=d.by_intent||{},ic=$("#ht-intent-cnt");
  if(ic)ic.textContent=`клиентов: ${bi.client||0} · конкурентов: ${bi.vendor||0} · не разобрано: ${bi.unknown||0}`;
  document.querySelectorAll(".hi-f").forEach(b=>{
    b.classList.toggle("primary",(b.dataset.i||"")===HIT_INTENT);
    b.onclick=()=>{HIT_INTENT=b.dataset.i||"";renderHits();};});
  // Куда уехала находка после переноса. Раздел меню «Лиды» — это лиды на КВАЛИФИКАЦИЮ
  // (status messaged/in_dialog), а перенесённая находка заводится со статусом «новый»
  // и живёт во вкладке «Целевые лиды» рядом. Без этой подсказки оператор жмёт «в лиды»,
  // идёт в «Лиды» и видит пустоту.
  const flash=HIT_FLASH?`<div class="card" style="margin-bottom:10px;padding:10px 12px;background:var(--green-soft)">
    ✅ ${esc(HIT_FLASH)} <button id="ht-go-lead" style="margin-left:8px">смотреть в «Целевые лиды» →</button>
    <div class="hint" style="margin-top:5px">В разделе меню «Лиды» его не будет: там лежат те, кому уже написали и кто в диалоге.</div></div>`:"";
  HIT_FLASH="";
  if(!d.items.length){body.innerHTML=flash+'<div class="empty">Пусто. Добавь чаты в «📡 Чаты», задай ниши и нажми «Прослушать чаты сейчас».</div>';
    const g=$("#ht-go-lead");if(g)g.onclick=()=>{HIT_TAB="lead";setHitTab();renderHits();};return;}
  body.innerHTML=flash+d.items.map(h=>`<div class="card" style="margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div style="flex:1;min-width:240px">
        <b>${esc(h.name||"—")}</b> ${h.username?`<a class="ext" href="https://t.me/${esc(h.username)}" target="_blank">@${esc(h.username)} ↗</a>`:""}
        <span class="badge b-active" style="margin-left:6px">${esc(h.niche_name||"")}</span>
        ${h.intent==="client"?`<span class="badge b-won" title="${esc(h.intent_why||"")}">🎯 клиент</span>`

async function renderTargetLeads(body){

  body.innerHTML=`<div class="ttoolbar" style="margin:0 0 10px"><select id="tl-seg">${segOpts}</select>

      <div class="ttoolbar" style="margin:8px 0 0" onclick="event.stopPropagation()">

        <button class="primary tl-write" data-id="${c.id}">✍️ Написать</button>

}

    <div id="c-list"></div>`;
  const form=$("#c-form");
  const teamSet=new Set();
  const teamLimits={};   // {account_id: лимит/день ИМЕННО в этой кампании; пусто = общий лимит аккаунта}
  let mainAcc="";
  const renderMain=()=>{
    const box=$("#c-main-acc");if(!box)return;
    const a=accounts.find(x=>String(x.id)===String(mainAcc));
    box.innerHTML=a?`⭐ <b>${esc(a.label||a.username||("#"+a.id))}</b>${a.phone?(' <span class="hint">'+esc(a.phone)+'</span>'):""} <span class="hint">· каналы: ${accChan(a)} · ${accStatusTxt(a)}</span>`
      :'<span class="hint">не выбран — отметь ⭐ в справочнике ниже</span>';
  };
  const renderTeam=()=>{
    const box=$("#c-team-box");if(!box)return;
    const q=(($("#c-acc-q")||{}).value||"").toLowerCase().trim();
    const fchan=(($("#c-acc-fchan")||{}).value)||"";
    const fst=(($("#c-acc-fst")||{}).value)||"";
    const list=accounts.filter(a=>{
      if(fchan==="tg"&&!a.tg_connected)return false;
      if(fchan==="wa"&&!a.wa_authed)return false;
      if(fst&&a.status!==fst)return false;
      if(q){const hay=((a.label||"")+" "+(a.phone||"")+" "+(a.username||"")).toLowerCase();if(!hay.includes(q))return false;}
      return true;
    }).sort((a,b)=>(isAccReady(b)-isAccReady(a)));   // живые — всегда сверху, без прокрутки
    const tm=$("#c-team-msg");
    if(tm){
      const cap=[...teamSet].reduce((sum,id)=>{
        const a=accounts.find(x=>x.id===id);
        return sum+(teamLimits[id]!=null?teamLimits[id]:(a?(a.daily_limit||15):15));
      },0);
      tm.innerHTML=`выбрано: ${teamSet.size} · суммарно до <b>${cap}</b>/день на всю команду`;
    }
    box.innerHTML=list.length?list.map(a=>{
      const ch=accChan(a);const spam=a.spam_status&&a.spam_status!=="ok"?` · ⚠️${esc(a.spam_status)}`:"";
      const isMain=String(a.id)===String(mainAcc);
      const ready=isAccReady(a);
      const dot=`<span class="sdot ${ready?'g':(a.status==='banned'?'r':'gy')}" title="${ready?'реально жив':(a.status==='banned'?'бан':'не готов — проверь сессию/прокси')}"></span>`;
      const lim=teamLimits[a.id];
      return `<div style="display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid var(--border);${ready?'':'opacity:.6'}">
        <input type="checkbox" class="c-acc-chk" value="${a.id}" ${teamSet.has(a.id)?"checked":""}>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:13px">${dot}${esc(a.label||a.username||("#"+a.id))} ${a.phone?('<span class="hint" style="font-weight:400">'+esc(a.phone)+'</span>'):""}</div>
          <div class="hint" style="font-size:11px">${a.username?("@"+esc(a.username)+" · "):""}каналы: ${ch} · ${accStatusTxt(a)}${spam}</div>
        </div>
        <input type="number" min="0" class="c-acc-lim mono" data-id="${a.id}" value="${lim!=null?lim:''}"
          placeholder="${a.daily_limit||15}" title="лимит/день ИМЕННО в этой кампании — пусто = общий лимит аккаунта (${a.daily_limit||15}/день)"
          style="width:64px;text-align:center">
        <button type="button" class="c-acc-star" data-id="${a.id}" title="сделать основным отправителем" style="border:none;background:none;cursor:pointer;font-size:18px;line-height:1">${isMain?"⭐":"☆"}</button></div>`;
    }).join(""):'<div class="no" style="padding:10px">нет аккаунтов по фильтру — заведи в «Мои агенты»</div>';
    box.querySelectorAll(".c-acc-chk").forEach(cb=>cb.onchange=()=>{
      const id=+cb.value;if(cb.checked)teamSet.add(id);else teamSet.delete(id);
      if(!cb.checked&&String(id)===String(mainAcc)){mainAcc="";renderMain();}
      const t=$("#c-team-msg");if(t)t.textContent="выбрано: "+teamSet.size;});
    box.querySelectorAll(".c-acc-lim").forEach(inp=>inp.onchange=()=>{
      const id=+inp.dataset.id,v=inp.value.trim();
      if(v==="")delete teamLimits[id];else teamLimits[id]=Math.max(0,parseInt(v,10)||0);
      renderTeam();});
    box.querySelectorAll(".c-acc-star").forEach(b=>b.onclick=()=>{
      mainAcc=b.dataset.id;teamSet.add(+mainAcc);renderMain();renderTeam();});
  };
  ["#c-acc-q","#c-acc-fchan","#c-acc-fst"].forEach(s=>{const el=$(s);if(el){el.oninput=renderTeam;el.onchange=renderTeam;}});
  const c_selready=$("#c-acc-selready");if(c_selready)c_selready.onclick=()=>{
    const q=(($("#c-acc-q")||{}).value||"").toLowerCase().trim();
    const fchan=(($("#c-acc-fchan")||{}).value)||"";
    const fst=(($("#c-acc-fst")||{}).value)||"";
    const list=accounts.filter(a=>{
      if(fchan==="tg"&&!a.tg_connected)return false;
      if(fchan==="wa"&&!a.wa_authed)return false;
      if(fst&&a.status!==fst)return false;
      if(q){const hay=((a.label||"")+" "+(a.phone||"")+" "+(a.username||"")).toLowerCase();if(!hay.includes(q))return false;}
      return true;
    });
    teamSet.clear();
    list.filter(isAccReady).forEach(a=>teamSet.add(a.id));
    renderTeam();
  };
  const c_selnone=$("#c-acc-selnone");if(c_selnone)c_selnone.onclick=()=>{teamSet.clear();mainAcc="";renderMain();renderTeam();};
  const fill=(c)=>{
    $("#c-name").value=c.name||"";$("#c-product").value=c.product||"";
    $("#c-tag").value=c.audience_tag!=null?c.audience_tag:"Агентства недвижимости";
    // Защита от бана: у новой кампании включена, у существующей — как сохранено
    $("#c-verified").checked=c.id?c.tg_verified_only!==0:true;
    const vst=$("#c-verified-stat");
    if(vst)vst.innerHTML=c.id&&c.audience_pending_check
      ? `Сейчас в очереди <b>${c.audience}</b> достижимых, ещё <b>${c.audience_pending_check}</b> ждут пробива.`
      : "";
    const chans=new Set((c.channel||"telegram").split(",").map(x=>x.trim()).filter(Boolean));
    document.querySelectorAll(".c-chan-chk").forEach(ch=>{ch.checked=chans.has(ch.value);});
    mainAcc=c.account_id?String(c.account_id):"";
    $("#c-project").value=c.project_id||(PROJECT_SEL?PROJECT_SEL.id:"");
    $("#c-limit").value=c.daily_limit||15;$("#c-msg").value=c.message_template||"";
    $("#c-prompt").value=c.agent_prompt||"";$("#c-kp").value=c.kp_text||"";
    // модель диалогов этой кампании (пусто = общая из «Аккаунтов»)
    api("/api/settings/agent_model").then(s=>{
      const sel=$("#c-agent-model");if(!sel)return;
      sel.innerHTML=`<option value="">— общая из «Аккаунтов» (${esc(s.current)}) —</option>`
        +s.choices.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}${x.has_key?"":" — НЕТ КЛЮЧА"}</option>`).join("");
      sel.value=c.agent_model||"";
    });
    // чем заканчивается диалог: своя переговорка и свой ответственный у кампании
    $("#c-meeting-url").value=c.meeting_url||"";
    $("#c-notify-target").value=c.notify_target||"";
    $("#c-notify-acc").innerHTML='<option value="">— как в общих настройках —</option>'
      +accounts.map(a=>`<option value="${a.id}">${esc(a.label||a.phone||a.username||("#"+a.id))}</option>`).join("");
    $("#c-notify-acc").value=c.notify_account_id?String(c.notify_account_id):"";
    teamSet.clear();(c.accounts||[]).forEach(id=>teamSet.add(+id));
    // Новая кампания (нет ни сохранённой команды, ни id) — по умолчанию берём
    // реально живых, а не всех подряд: раньше форма открывалась пустой и оператор
    // либо вручную ставил все галки, либо забывал — и в команду попадали банченые.
    if(!c.id&&!(c.accounts||[]).length)accounts.filter(isAccReady).forEach(a=>teamSet.add(a.id));
    if(mainAcc)teamSet.add(+mainAcc);
    Object.keys(teamLimits).forEach(k=>delete teamLimits[k]);
    Object.entries(c.account_limits||{}).forEach(([id,v])=>teamLimits[+id]=+v);
    // Свои номера для теста — подставляем сохранённые (localStorage), чтобы не

  };
  const renderKpsBox=(c)=>{
    const box=$("#c-kps-box");if(!box)return;

      const m=box.querySelector(`.kp-msg[data-id="${id}"]`);if(m)m.textContent=r.ok?"✅ сохранено":(r.error||"ошибка");});
    box.querySelectorAll(".kp-del").forEach(b=>b.onclick=async()=>{if(!confirm("Удалить это КП?"))return;await api(`/api/campaign/${eid}/kps/${b.dataset.id}/delete`,{method:"POST"});reload();});
    box.querySelectorAll(".kp-file-up").forEach(b=>b.onclick=async()=>{const id=b.dataset.id;const inp=box.querySelector(`.kp-file[data-id="${id}"]`);if(!inp||!inp.files.length){alert("выбери файл");return;}

  const openNew=()=>{form.dataset.edit="";$("#c-form-title").textContent="Новая кампания";

  $("#c-new-btn").onclick=()=>{ if(form.style.display==="block"&&!form.dataset.edit){form.style.display="none";} else {openNew();} };

  const ctSave=$("#c-test-save");if(ctSave)ctSave.onclick=()=>{

    ctAdd.disabled=false;ctAdd.textContent="Добавить в начало очереди";
    if(r.error){msg.innerHTML='<span style="color:#c0392b">'+esc(r.error)+'</span>';return;}

  };
  const cPrev=$("#c-preview");if(cPrev)cPrev.onclick=async()=>{
    const eid=form.dataset.edit;const out=$("#c-preview-out");

      <div style="white-space:pre-wrap;font-size:13px;margin-top:6px">${esc(r.warnings)}</div>

      ${it.parts.map(p=>`<div style="background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:5px;max-width:520px">${esc(p)}</div>`).join("")}
    </div>`).join("");
  };
  const allproj=$("#c-allproj");if(allproj)allproj.onclick=()=>{PROJECT_SEL=null;route();};
  $("#c-save").onclick=async()=>{

    const body={name:$("#c-name").value,product:$("#c-product").value,audience_tag:$("#c-tag").value,
      channel:chans.join(","),account_id:mainAcc||"",project_id:$("#c-project").value||null,

      message_template:$("#c-msg").value,agent_prompt:$("#c-prompt").value,kp_text:$("#c-kp").value};

  };
  const applyCampFilters=()=>{
    const sort=$("#c-sort").value;
    const from=$("#c-date-from").value,to=$("#c-date-to").value;
    const showArch=$("#c-show-arch").checked;
    const archCount=camps.filter(c=>c.archived).length;
    let list=camps.filter(c=>{
      if(!showArch&&c.archived)return false;
      const d=(c.created_at||"").slice(0,10);
      if(from&&d<from)return false;
      if(to&&d>to)return false;
      return true;
    });
    if(sort==="date_asc")list.sort((a,b)=>(a.created_at||"")<(b.created_at||"")?-1:1);
    else if(sort==="name")list.sort((a,b)=>(a.name||"").localeCompare(b.name||"","ru"));
    else list.sort((a,b)=>(a.created_at||"")>(b.created_at||"")?-1:1);   // date_desc — по умолчанию
    const parts=[];
    if(from||to)parts.push(`показано ${list.length} из ${camps.length}`);

  applyCampFilters();
}
function renderCampList(mount,camps){
  // если шторка настроек сейчас перенесена внутрь списка (открыта под своей карточкой),
  // перерисовка mount.innerHTML её физически удалит из DOM — сначала вернуть к якорю наверху,
  // чтобы форма не пропала молча вместе со старыми карточками.
  const openForm=document.getElementById("c-form");
  if(openForm&&mount.contains(openForm)){
    const anchor=document.getElementById("c-form-anchor");
    if(anchor)anchor.insertAdjacentElement("afterend",openForm);
  }
  if(!camps.length){mount.innerHTML='<div class="empty">Кампаний нет — создай первую кнопкой выше</div>';return;}
  mount.innerHTML=camps.map(c=>{
    const left=c.audience, done=c.sent;
    const pct=(done+left)?Math.round(done/(done+left)*100):0;
    // «Идёт» пульсирует, только если реально ЕСТЬ что слать прямо сейчас (left>0) —
    // иначе кампания может неделями висеть в status='running' с пустой очередью
    // (всё уже отправлено, новых контактов нет), и мигание врало бы, что работа кипит.
    const isRunning=c.status==='running';
    const isActive=isRunning&&left>0;
    const stCls=(isRunning?('b-active'+(isActive?' b-live':'')):c.status==='done'?'b-won':'b-nurture');
    const hasPrompt=c.agent_prompt?'<span class="badge b-active">🤖 промпт задан</span>':'<span class="badge b-nurture">промпт не задан</span>';
    const hasKp=c.kp_file?'<span class="badge b-active">📎 КП-файл</span>':'';
    return `<div class="card" id="camp-card-${c.id}" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap">
        <div style="flex:1;min-width:240px">
          <b>${esc(c.name)}</b> <span class="badge ${stCls}">${CST[c.status]||c.status}</span> ${hasPrompt} ${hasKp}
          <div class="sub" style="margin:4px 0 8px">${esc(c.product||"")} · ${(c.channel||"").split(",").map(x=>CH_RU[x.trim()]||x.trim()).filter(Boolean).join(" + ")||"—"} · создана ${c.created_at?fmt(c.created_at):"—"}</div>
          <div class="sub mono">отправлено ${done} · в очереди ${left}${c.paused?` · <span style="color:#c0392b" title="кнопка «снять все» в окне «Кто в рассылке» отключила эти контакты именно у этой кампании — вернуть галочкой там">снято вручную: ${c.paused}</span>`:""}</div>
          <div style="background:var(--bg);border:1px solid var(--border);border-radius:20px;height:8px;margin-top:6px;overflow:hidden;max-width:340px">
            <div style="height:100%;width:${pct}%;background:var(--green)"></div></div>
        </div>
        <div class="ttoolbar" style="margin:0">
          <button class="cl-edit" data-id="${c.id}">⚙ Настроить</button>
          <button class="cl-wiz" data-id="${c.id}" title="пройти по шагам визарда, проверить и поправить">🔁 В визард</button>
          <button class="cl-pre" data-id="${c.id}" title="что готово/мешает запуску">🚦 Готовность</button>
          <button class="cl-prog" data-id="${c.id}">Прогресс</button>
          <button class="cl-segadd" data-id="${c.id}" title="Добавить ещё контактов из CRM в аудиторию этой кампании">➕ Сегмент из CRM</button>
          <button class="cl-aud" data-id="${c.id}" title="Поимённо: кто пойдёт в рассылку, кто выпал и почему. Там же снимаются галочки с ненужных">👥 Кто в рассылке</button>
          <button class="cl-econ" data-id="${c.id}">📊 Экономика</button>
          <button class="cl-warm" data-id="${c.id}">Прогрев</button>
          <button class="cl-test" data-id="${c.id}" title="проверить скрипт живьём: шлёт ТОЛЬКО на свои тест-номера, боевую базу не трогает">🧪 Тест</button>
          <button class="cl-test-reset" data-id="${c.id}" title="удалить переписку, встречи и очередь у СВОИХ тестовых номеров этой кампании — начать тест с нуля, не путая со вчерашним диалогом. Живых лидов не трогает">🔄 Обнулить тест</button>
          <input type="number" value="3" id="cl-${c.id}" style="max-width:72px" title="сколько отправить в этот заход">
          <button class="primary cl-go${isActive?' running':''}" data-id="${c.id}" ${isRunning?"disabled":""} title="${isRunning?'Кампания уже работает — жми «Стоп», чтобы снова разрешить запуск':'Запустить рассылку'}">▶ Запустить</button>
          ${isRunning?`<button class="cl-stop" data-id="${c.id}" title="Остановить кампанию — новые заходы запускаться не будут, текущий отправляющийся процесс доработает до конца. После стопа «Запустить» снова станет активной">⏸ Стоп</button>`:""}
          <button class="cl-arch" data-id="${c.id}" data-archived="${c.archived?1:0}" title="${c.archived?'Вернуть кампанию из архива в основной список':'Убрать в архив — не мешает в списке, данные и статистика сохранятся, достать можно в любой момент'}">${c.archived?"↩ Из архива":"📦 В архив"}</button>
          <button class="cl-del" data-id="${c.id}">✕</button>
        </div></div>
        <div class="cprog" id="pre-${c.id}" style="margin-top:12px"></div>
        <div class="cprog" id="prog-${c.id}" style="margin-top:12px"></div>
        <div class="cprog" id="econ-${c.id}" style="margin-top:12px"></div>
        <div class="cprog" id="warm-${c.id}" style="margin-top:12px"></div></div>`;
  }).join("");
  mount.querySelectorAll(".cl-edit").forEach(b=>b.onclick=()=>window.__campEdit(+b.dataset.id));
  mount.querySelectorAll(".cl-wiz").forEach(b=>b.onclick=()=>startWizardEdit(+b.dataset.id));
  mount.querySelectorAll(".cl-segadd").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.id;
    const c=await api(`/api/campaign/${id}`);
    showAudiencePicker({audience_tag:c.audience_tag||""},(updated,tag)=>{
      alert(`Добавлено в сегмент «${tag}»: ${updated}. Обновляю очередь…`);
      route();
    });
  });
  mount.querySelectorAll(".cl-pre").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.id,box=document.getElementById("pre-"+id);
    if(box.dataset.open==="1"){box.innerHTML="";box.dataset.open="";return;}
    box.dataset.open="1";box.innerHTML='<div class="sub">проверяю…</div>';
    const r=await api(`/api/campaign/${id}/preflight`);
    if(r.error){box.innerHTML='<div class="sub" style="color:#c0392b">'+esc(r.error)+'</div>';return;}
    const ic={ok:"✅",warn:"⚠️",info:"ℹ️",fail:"❌"};
    const rows=r.checks.map(c=>`<div style="display:flex;gap:8px;align-items:flex-start;padding:3px 0">
      <span>${c.ok?"✅":ic[c.level]}</span><span style="${c.level==='fail'&&!c.ok?'color:#c0392b':(c.level==='warn'&&!c.ok?'color:#b8860b':'')}">${esc(c.text)}</span></div>`).join("");
    const head=r.ready?'<b style="color:var(--green)">🚦 Готова к запуску</b>':'<b style="color:#c0392b">🚦 Ещё не готова — закрой ❌ ниже</b>';
    box.innerHTML=`<div class="card" style="background:var(--panel2);padding:12px">${head}<div style="margin-top:8px">${rows}</div></div>`;
  });
  mount.querySelectorAll(".cl-prog").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.id,box=document.getElementById("prog-"+id);
    if(box.dataset.open==="1"){box.innerHTML="";box.dataset.open="";return;}
    box.dataset.open="1";box.innerHTML='<div class="sub">загружаю…</div>';
    // Пауза/убор из очереди сохраняет флеш-сообщение здесь (на box, не на innerHTML —
    // innerHTML тут же перезаписывается, а атрибуты box переживают перерисовку) —
    // раньше после «Убрать из рассылки» список просто молча перерисовывался тем же
    // составом строк (с пометкой ⏸, но без единого слова «готово»), и оператор решал,
    // что кнопка не сработала.
    const flash=box.dataset.flashMsg;delete box.dataset.flashMsg;
    const p=await api(`/api/campaign/${id}/progress`);
    if(p.error){box.innerHTML=`<div class="empty">${esc(p.error)}</div>`;return;}
    if(!p.rows.length){box.innerHTML='<div class="sub">Аудитория пуста — некому слать (проверь тег/канал/статусы).</div>';return;}
    const rowsHtml=p.rows.map(r=>{
      const bg=r.is_paused?'background:color-mix(in srgb,var(--red) 10%,transparent)':(r.is_test?'background:var(--accent-soft)':'');
      const cb=r.sent?'':`<input type="checkbox" class="pg-cb" data-id="${r.id}" data-src="${esc(r.source||"")}" data-paused="${r.is_paused?1:0}">`;
      const testBadge=r.is_test?' <span class="badge b-active" title="Тестовый номер — уходит первым, до боевой аудитории">🧪 тест</span>':'';
      const pauseBadge=r.is_paused?' <span class="badge b-stop" title="На паузе в этой кампании — рассылка её пропускает">⏸ пауза</span>':'';
      const eye=`<a href="/#contacts/${r.id}" target="_blank" rel="noopener" title="Открыть карточку контакта в новой вкладке" style="margin-left:6px;text-decoration:none">👁</a>`;
      return `<tr${bg?` style="${bg}"`:''}>
      <td style="text-align:center">${cb}</td>
      <td style="text-align:center">${r.sent?'<span style="color:var(--green);font-weight:700">✓</span>':'<span class="no">○</span>'}</td>
      <td>${esc(r.name)||("#"+r.id)}${testBadge}${pauseBadge}${eye}</td>
      <td class="mono">${esc(r.handle)}</td>
      <td class="sub">${esc(r.source)||"—"}</td>
      <td>${esc(r.account)}</td>
      <td class="sub">${r.sent?fmt(r.sent_at):"в очереди"}</td></tr>`;}).join("");

    // нельзя: когда убрали источник целиком, он исчезал из выпадайки вместе с
    // возможностью вернуть его обратно (поймано вживую: все 2gis на паузе → выбрать
    // нечего). Вместо этого пишем прямо в пункте, сколько в очереди и сколько снято.
    const srcStat={};
    p.rows.filter(r=>!r.sent&&r.source).forEach(r=>{
      const s=srcStat[r.source]||(srcStat[r.source]={live:0,paused:0});

          ${rowsHtml}</table></div>`;
    const selIds=()=>[...box.querySelectorAll(".pg-cb:checked")].map(cb=>+cb.dataset.id);
    const msgEl=document.getElementById(`pg-msg-${id}`);
    // Счётчик выделенных: без него галочка «выбрать все» выглядела как ничего не
    // делающая — строк много, экран прокручен, результат клика просто не видно.
    const selCount=()=>{const n=box.querySelectorAll(".pg-cb:checked").length;

    if(flash){msgEl.innerHTML='<span style="color:var(--green)">'+esc(flash)+'</span>';}

    const doPause=async(ids)=>{

  const camps=[...new Map(CHATS_ALL.filter(c=>c.campaign_id).map(c=>[c.campaign_id,c.campaign_name||("#"+c.campaign_id)])).entries()];
  v.innerHTML=`<div class="chat-toolbar" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center">
      <input id="ch-q" placeholder="🔍 поиск: имя / @ник / текст" style="flex:1;min-width:180px">
      <select id="ch-status">
        <option value="">все статусы</option>
        <option value="replied">💬 ответившие</option>
        <option value="in_dialog">в диалоге</option>
        <option value="messaged">написано, ждём</option>
        <option value="meeting_set">встреча</option>
        <option value="won">сделка</option>
        <option value="nurture">прогрев</option>
        <option value="lost">потеряны</option>
      </select>
      <select id="ch-acc"><option value="">любой аккаунт</option>${accs.map(([id,lbl])=>`<option value="${id}">${esc(lbl)}</option>`).join("")}</select>
      <select id="ch-camp" title="фильтр по кампании, откуда пришёл диалог"><option value="">любая кампания</option>${camps.map(([id,lbl])=>`<option value="${id}">${esc(lbl)}</option>`).join("")}</select>
      <select id="ch-sort"><option value="recent">свежие сверху</option><option value="unread">сначала ответившие</option><option value="msgs">больше сообщений</option></select>
      <span class="hint" id="ch-cnt"></span>
    </div>
    <div class="chat-wrap">
      <div class="chat-list" id="clist"></div>
      <div class="thread" id="thread"><div class="empty" style="margin:auto">Выбери диалог слева</div></div>
    </div>`;
  const drawList=()=>{
    const q=($("#ch-q").value||"").toLowerCase().trim();
    const st=$("#ch-status").value, acc=$("#ch-acc").value, camp=$("#ch-camp").value, sort=$("#ch-sort").value;
    let rows=CHATS_ALL.slice();
    if(st==="replied")rows=rows.filter(c=>(c.in_cnt||0)>0);
    else if(st)rows=rows.filter(c=>c.status===st);
    if(acc)rows=rows.filter(c=>String(c.account_id)===acc);
    if(camp)rows=rows.filter(c=>String(c.campaign_id)===camp);
    if(q)rows=rows.filter(c=>((c.name||"")+" "+(c.username||"")+" "+(c.last_text||"")).toLowerCase().includes(q));
    if(sort==="unread")rows.sort((a,b)=>(b.in_cnt||0)-(a.in_cnt||0)||(b.last_ts>a.last_ts?1:-1));
    else if(sort==="msgs")rows.sort((a,b)=>(b.msg_count||0)-(a.msg_count||0));
    // recent — уже по last_ts с бэка
    $("#ch-cnt").textContent=`${rows.length} из ${CHATS_ALL.length}`;
    $("#clist").innerHTML=rows.length?rows.map(c=>{
      const replied=(c.in_cnt||0)>0;
      const waiting=c.last_dir==="in";   // последнее слово за клиентом — ждёт нашего ответа
      return `<div class="chat-item${c.id===CHAT_SEL?" sel":""}" data-id="${c.id}">
        <div class="nm">${esc(c.name)||(c.username?"@"+esc(c.username):"#"+c.id)}
          ${waiting?'<span class="badge b-active" style="font-size:10px">ждёт ответа</span>':(replied?'<span class="badge b-nurture" style="font-size:10px">ответил</span>':"")}</div>
        <div class="pv">${c.last_dir==="out"?"→ ":""}${esc(c.last_text)||""}</div>
        <div class="pv" style="opacity:.6;font-size:11px">${c.account_label?("📱 "+esc(c.account_label)+" · "):""}${c.campaign_name?("🎯 "+esc(c.campaign_name)+" · "):""}${statusBadge(c.status)}</div></div>`;
    }).join(""):'<div class="empty">Ничего не найдено</div>';
    $("#clist").querySelectorAll(".chat-item").forEach(it=>it.onclick=()=>{CHAT_SEL=+it.dataset.id;
      $("#clist").querySelectorAll(".chat-item").forEach(x=>x.classList.remove("sel"));it.classList.add("sel");openThread(CHAT_SEL);});
  };
  ["ch-q","ch-status","ch-acc","ch-camp","ch-sort"].forEach(id=>{const el=$("#"+id);el.oninput=drawList;el.onchange=drawList;});
  drawList();
}

      const r=await api(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});

  };
