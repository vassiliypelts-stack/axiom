    target:$("#p-target").value.trim(),mode:$("#p-mode").value,save:$("#p-save").checked,
    scan:+$("#p-scan").value||2000,top:+$("#p-top").value||50,limit:+$("#p-top").value||30});
  $("#i-run").onclick=()=>run($("#i-run"),"#i-out","/api/parse/invites",{
    target:$("#i-target").value.trim(),dialogs:$("#i-dialogs").checked,limit:3000,per:800});
}

// ----------------------------------------------------------------- projects
// Списки для выбора клиента (компания ИЛИ человек) — грузятся один раз, лениво,
// только когда форму проекта реально открыли, чтобы не тянуть 951 компанию и
// 1494 контакта каждый заход в «Проекты».
let PROJ_COMPANIES=null,PROJ_CONTACTS=null;
async function _ensureClientLists(){
  if(!PROJ_COMPANIES)PROJ_COMPANIES=await api("/api/companies").catch(()=>[]);
  if(!PROJ_CONTACTS)PROJ_CONTACTS=await api("/api/contacts").catch(()=>[]);
}
const PROJ_STATUS_LBL={active:"активен",paused:"пауза",done:"завершён",archived:"в архиве"};
async function viewProjects(v){
  let filter="active";   // active(≠archived) | archived — переключается чипами без перезапроса архива лишний раз
  const load=async()=>api(`/api/projects?archived=${filter==="archived"?1:0}`);
  let projects=await load();
  v.innerHTML=`
    <div class="ttoolbar"><button class="primary" id="p-new-btn">Новый проект</button>
      <span id="p-filter"></span>
      <span class="hint">Проект = направление бизнеса. Внутри проекта — несколько маркетинговых кампаний.</span></div>
    <div id="p-form" class="card" style="display:none;margin-bottom:16px" data-edit="">
      <div style="font-weight:700;font-size:15px;margin-bottom:14px" id="p-form-title">Новый проект</div>
      <div class="row2"><div class="field"><label>Название</label><input id="p-name" placeholder="напр. Фонд доступного жилья"></div>
        <div class="field"><label>Сущность / бренд</label><input id="p-entity" placeholder="юр. лицо или бренд"></div></div>
      <div class="field"><label>Описание</label><textarea id="p-desc" rows="2" placeholder="что за проект"></textarea></div>
      <div class="field"><label>Клиент — с кем идёт работа</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <select id="p-client-type" style="max-width:160px">
            <option value="">— не указан —</option>
            <option value="company">Компания</option>
            <option value="contact">Человек</option>
          </select>
          <input id="p-client-q" list="p-client-dl" placeholder="начни вводить название/имя" style="flex:1;min-width:200px;display:none">
          <datalist id="p-client-dl"></datalist>
        </div>
      </div>
      <div class="row2">
        <div class="field"><label>Цель проекта</label><input id="p-goal" placeholder="что нужно получить"></div>
        <div class="field"><label>Срок</label><input id="p-deadline" type="date"></div>
      </div>
      <div class="field"><label>Идеальный результат <span class="hint">(проект заводят, чтобы он стал кейсом)</span></label>
        <textarea id="p-ideal" rows="2" placeholder="как будет выглядеть успех — что покажем в кейсе"></textarea></div>
      <div class="ttoolbar" style="margin:0"><button class="primary" id="p-save">Создать</button><button id="p-cancel">Отмена</button></div>
    </div>
    <div id="p-list"></div>`;
  // чипы-фильтры по образцу ACC_PRESETS (кнопка «primary» = активный фильтр) —
  // по умолчанию архив скрыт, список не копится на глазах
  const chips=[["active","Активные"],["archived","🗄 Архив"]];
  const drawChips=()=>{$("#p-filter").innerHTML=chips.map(([k,l])=>
    `<button class="p-preset${filter===k?" primary":""}" data-k="${k}">${l}</button>`).join("");
    $("#p-filter").querySelectorAll(".p-preset").forEach(b=>b.onclick=async()=>{
      filter=b.dataset.k;projects=await load();drawChips();drawList();});};
  drawChips();
  const form=$("#p-form");
  const clientTypeEl=$("#p-client-type"),clientQEl=$("#p-client-q"),clientDl=$("#p-client-dl");
  const fillClientDatalist=(type)=>{
    const rows=type==="company"?(PROJ_COMPANIES||[]):type==="contact"?(PROJ_CONTACTS||[]):[];
    const label=r=>type==="company"?(r.name||"?"):(r.person_name||r.name||"@"+(r.username||r.id));
    clientDl.innerHTML=rows.map(r=>`<option value="#${r.id} — ${esc(label(r))}">`).join("");
  };
  clientTypeEl.onchange=async()=>{
    const t=clientTypeEl.value;clientQEl.value="";
    if(!t){clientQEl.style.display="none";return;}
    clientQEl.style.display="";clientQEl.placeholder=t==="company"?"начни вводить название компании":"начни вводить имя";
    await _ensureClientLists();fillClientDatalist(t);
  };
  const parseClientId=v=>{const m=/^#(\d+)/.exec((v||"").trim());return m?+m[1]:null;};
  const openNew=()=>{form.dataset.edit="";$("#p-form-title").textContent="Новый проект";
    $("#p-name").value="";$("#p-entity").value="";$("#p-desc").value="";
    $("#p-goal").value="";$("#p-deadline").value="";$("#p-ideal").value="";
    clientTypeEl.value="";clientQEl.value="";clientQEl.style.display="none";
    $("#p-save").textContent="Создать";
    form.style.display="block";};
  $("#p-new-btn").onclick=()=>{form.style.display=form.style.display==="block"?"none":"block";if(form.style.display==="block"&&!form.dataset.edit)openNew();};
  $("#p-cancel").onclick=()=>{form.style.display="none";};
  $("#p-save").onclick=async()=>{
    const body={name:$("#p-name").value,entity:$("#p-entity").value,description:$("#p-desc").value,
      goal:$("#p-goal").value,ideal_result:$("#p-ideal").value,deadline:$("#p-deadline").value,
      client_company_id:null,client_contact_id:null};
    const t=clientTypeEl.value;
    if(t==="company")body.client_company_id=parseClientId(clientQEl.value);
    else if(t==="contact")body.client_contact_id=parseClientId(clientQEl.value);
    const eid=form.dataset.edit;
    const r=await api(eid?`/api/project/${eid}/update`:"/api/projects",
      {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(r.error){alert(r.error);return;}
    form.style.display="none";projects=await load();drawList();
  };
  const list=$("#p-list");
  const drawList=()=>{
    if(!projects.length){list.innerHTML=`<div class="empty">${filter==="archived"?"Архив пуст":"Проектов нет — создай первый кнопкой выше"}</div>`;return;}
    list.innerHTML=projects.map(p=>{
      const overdue=p.deadline&&p.deadline<new Date().toISOString().slice(0,10)&&p.status!=="done"&&p.status!=="archived";
      return `<div class="card" style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap">
      <div style="flex:1;min-width:240px">
        <b>${esc(p.name)}</b> ${p.entity?`<span class="sub">· ${esc(p.entity)}</span>`:""}
        ${p.status&&p.status!=="active"?`<span class="badge b-${p.status==="archived"?"stop":"nurture"}">${PROJ_STATUS_LBL[p.status]||esc(p.status)}</span>`:""}
        <div class="sub" style="margin:4px 0">${esc(p.description||"")}</div>
        ${p.client_name?`<div class="sub">${p.client_company_id?"🏢":"👤"} клиент: <b class="lnk" data-open="${p.client_company_id?'co:'+p.client_company_id:'ct:'+p.client_contact_id}" style="cursor:pointer">${esc(p.client_name)}</b></div>`:""}
        ${p.goal?`<div class="sub">🎯 цель: ${esc(p.goal)}</div>`:""}
        ${p.ideal_result?`<div class="sub">🏆 идеальный результат: ${esc(p.ideal_result)}</div>`:""}
        ${p.deadline?`<div class="sub" style="${overdue?"color:#c0392b":""}">⏰ срок: ${esc(p.deadline)}${overdue?" — просрочен":""}</div>`:""}
        <div class="sub mono">кампаний: ${p.campaigns}</div>
      </div>
      <div class="ttoolbar" style="margin:0">
        <button class="primary pr-camp" data-id="${p.id}" data-name="${esc(p.name)}">🎯 Кампании</button>
        <button class="pr-edit" data-id="${p.id}">⚙</button>
        <button class="pr-arch" data-id="${p.id}" data-archived="${p.status==="archived"?1:0}" title="${p.status==="archived"?"Вернуть из архива":"В архив — кампании останутся, список не потеряется"}">${p.status==="archived"?"↩":"🗄"}</button>
      </div></div>`;}).join("");
    list.querySelectorAll(".pr-camp").forEach(b=>b.onclick=()=>{PROJECT_SEL={id:+b.dataset.id,name:b.dataset.name};location.hash="campaigns";});
    list.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>{
      const[kind,id]=el.dataset.open.split(":");kind==="co"?openCompany(+id):openDossier(+id);});
    list.querySelectorAll(".pr-edit").forEach(b=>b.onclick=async()=>{
      const p=projects.find(x=>x.id===+b.dataset.id);if(!p)return;
      form.dataset.edit=p.id;$("#p-form-title").textContent="Проект: "+p.name;
      $("#p-name").value=p.name||"";$("#p-entity").value=p.entity||"";$("#p-desc").value=p.description||"";
      $("#p-goal").value=p.goal||"";$("#p-deadline").value=p.deadline||"";$("#p-ideal").value=p.ideal_result||"";
      if(p.client_company_id){clientTypeEl.value="company";clientQEl.style.display="";
        await _ensureClientLists();fillClientDatalist("company");clientQEl.value=`#${p.client_company_id} — ${p.client_name||""}`;}
      else if(p.client_contact_id){clientTypeEl.value="contact";clientQEl.style.display="";
        await _ensureClientLists();fillClientDatalist("contact");clientQEl.value=`#${p.client_contact_id} — ${p.client_name||""}`;}
      else{clientTypeEl.value="";clientQEl.value="";clientQEl.style.display="none";}
      $("#p-save").textContent="Сохранить";form.style.display="block";});
    list.querySelectorAll(".pr-arch").forEach(b=>b.onclick=async()=>{
      const goingToArchive=b.dataset.archived==="0";
      if(goingToArchive&&!confirm("Убрать проект в архив? Кампании останутся, вернуть можно из «🗄 Архив».")) return;
      await api(`/api/project/${b.dataset.id}/archive`,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({archived:goingToArchive})});
      projects=projects.filter(x=>x.id!==+b.dataset.id);drawList();});
  };
  drawList();
}

// ----------------------------------------------------------------- calendar
async function viewCalendar(v){
  const [m,g]=await Promise.all([api("/api/meetings"),api("/api/gcal").catch(()=>({connected:false}))]);
  const meetTable=m.length?`<div style="border:1px solid var(--border);border-radius:8px;overflow:auto"><table style="width:100%;border-collapse:collapse">
      <tr><th>Когда</th><th>Кто</th><th>Контакт</th><th>Zoom</th><th>Заметка</th></tr>
      ${m.map(x=>`<tr>
        <td class="mono">${fmt(x.meeting_at)||esc(x.meeting_at)||"—"}</td>
        <td>${esc(x.name)||("#"+x.cid)}</td>
        <td class="mono">${x.username?"@"+esc(x.username):(esc(x.phone)||"—")}</td>
        <td>${x.zoom_link?`<a class="ext" href="${esc(x.zoom_link)}" target="_blank">ссылка ↗</a>`:'<span class="no">—</span>'}</td>
        <td class="sub">${esc(x.notes)||""}</td></tr>`).join("")}
    </table></div>`:'<div class="empty" style="margin:0">Встреч AXIOM пока нет — появятся, когда агент договорится о созвоне (КЭВ).</div>';
  let gcalBlock;
  if(g&&g.connected){
    gcalBlock=(g.events&&g.events.length)?`<div style="border:1px solid var(--border);border-radius:8px;overflow:auto"><table style="width:100%;border-collapse:collapse">
        <tr><th>Когда</th><th>Событие</th><th>Место</th><th></th></tr>
        ${g.events.map(e=>`<tr>
          <td class="mono">${fmt(e.start)||esc(e.start)||"—"}</td>
          <td>${esc(e.summary)}</td>
          <td class="sub">${esc(e.location)||""}</td>
          <td>${e.link?`<a class="ext" href="${esc(e.link)}" target="_blank">↗</a>`:""}</td></tr>`).join("")}
      </table></div>`:'<div class="empty" style="margin:0">В Google-календаре нет ближайших событий (21 день).</div>';
  } else {
    gcalBlock=`<div class="card" style="background:var(--accent-soft);border-left:3px solid var(--accent);padding:14px 16px">
      <b>📅 Google-календарь не подключён</b>
      <div class="sub" style="margin-top:6px;line-height:1.5">Чтобы видеть свои личные встречи прямо здесь:
      <br>1) в Google Cloud создай OAuth-доступ (тип «Desktop app»), включи Calendar API, скачай <b>credentials.json</b>;
      <br>2) положи его в папку <code>axiom</code> под именем <b>google_credentials.json</b>;
      <br>3) обнови страницу — при первом обращении откроется окно входа Google (разово).
      <br><span style="opacity:.7">Скажи Claude «подключи Google-календарь» — проведу по шагам.</span></div></div>`;
  }
  // Объединяем оба источника в один список событий для недельного грида.
  const events=[
    ...m.map(x=>({ts:x.meeting_at,title:(x.name||("#"+x.cid)),sub:x.username?"@"+x.username:(x.phone||""),link:x.zoom_link,kind:"axiom"})),
    ...((g&&g.connected&&g.events)?g.events.map(e=>({ts:e.start,title:e.summary,sub:e.location||"",link:e.link,kind:"gcal"})):[]),
  ].map(e=>({...e,d:parseTs(e.ts)})).filter(e=>e.d);

  const startOfWeek=d=>{const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;};
  const DOW=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
  let weekBase=startOfWeek(new Date());

  const renderWeek=()=>{
    const days=[...Array(7)].map((_,i)=>{const d=new Date(weekBase);d.setDate(d.getDate()+i);return d;});
    const wkLabel=`${days[0].toLocaleDateString("ru-RU",{day:"2-digit",month:"short"})} — ${days[6].toLocaleDateString("ru-RU",{day:"2-digit",month:"short"})}`;
    const today=new Date();
    const colHtml=days.map((d,i)=>{
      const isToday=d.toDateString()===today.toDateString();
      const dayEvents=events.filter(e=>e.d.toDateString()===d.toDateString()).sort((a,b)=>a.d-b.d);
      const evHtml=dayEvents.length?dayEvents.map(e=>`<div class="wk-ev ${e.kind}" ${e.link?`onclick="window.open('${esc(e.link)}','_blank')"`:''} title="${esc(e.sub||'')}">
          <b>${e.d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}</b> ${esc(e.title)}</div>`).join(""):
        '<div class="wk-empty">—</div>';
      return `<div class="wk-col${isToday?' today':''}">
        <div class="wk-hd">${DOW[i]}<span>${d.getDate()}</span></div>
        <div class="wk-body">${evHtml}</div></div>`;
    }).join("");
    $("#wk-label").textContent=wkLabel;
    $("#wk-grid").innerHTML=colHtml;
    $("#wk-grid").querySelectorAll(".wk-ev").forEach(el=>{if(el.onclick)el.style.cursor="pointer";});
  };

  v.innerHTML=`<p class="sub" style="margin-top:0">Встречи AXIOM (КЭВ) + твой личный Google-календарь в одном месте.</p>
    <section class="dash-glass dash-card" id="dash-today" style="display:none;margin-bottom:14px"></section>
    <div class="ttoolbar" style="margin-bottom:10px">

let NAV_COLLAPSE={};try{NAV_COLLAPSE=JSON.parse(localStorage.getItem("axiom_nav_collapse")||"{}");}catch(e){}
let NAV_ORDER=null;try{NAV_ORDER=JSON.parse(localStorage.getItem("axiom_nav_order")||"null");}catch(e){}
let NAV_GORDER=null;try{NAV_GORDER=JSON.parse(localStorage.getItem("axiom_nav_gorder")||"null");}catch(e){}
function navApplyOrder(){
  // порядок разделов (групп) целиком — тянем заголовок вверх/вниз
  if(NAV_GORDER)NAV_GROUPS.sort((a,b)=>{const ia=NAV_GORDER.indexOf(a.title||"_"),ib=NAV_GORDER.indexOf(b.title||"_");
    return (ia<0?99:ia)-(ib<0?99:ib);});
  // порядок подпунктов внутри раздела
  if(NAV_ORDER)NAV_GROUPS.forEach(g=>{const ord=NAV_ORDER[g.title||"_"];if(!ord)return;
    g.items.sort((a,b)=>{const ia=ord.indexOf(a.id),ib=ord.indexOf(b.id);return (ia<0?99:ia)-(ib<0?99:ib);});});
}
function renderNav(active){
  navApplyOrder();
  $("#nav").innerHTML=NAV_GROUPS.map(g=>{
    const col=g.collapsible&&NAV_COLLAPSE[g.title];
    const hdr=g.title?`<div class="navhdr${g.collapsible?' clk':''}${col?' col':''}" draggable="true" title="потяни ⠿, чтобы поменять порядок разделов" data-g="${g.title}" style="padding:10px 13px 6px;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center;cursor:pointer"><span style="display:flex;align-items:center;gap:6px;min-width:0"><span class="ghandle">⠿</span>${g.title}</span>${g.collapsible?`<span class="chev">▾</span>`:""}</div>`:"";
    const items=col?"":g.items.map(n=>`<a draggable="true" data-id="${n.id}" data-g="${g.title||'_'}" class="${n.id===active?"active":""}"><span class="ic">${n.ic}</span>${n.label}${n.cnt!=null?`<span class="cnt">${n.cnt}</span>`:""}</a>`).join("");
    return hdr+items;
  }).join("");
  $("#nav").querySelectorAll("a").forEach(a=>a.onclick=()=>{location.hash=a.dataset.id;});
  let dragG=null;
  $("#nav").querySelectorAll(".navhdr[data-g]").forEach(h=>{
    h.onclick=()=>{if(!NAV_GROUPS.find(g=>g.title===h.dataset.g&&g.collapsible))return;
      NAV_COLLAPSE[h.dataset.g]=!NAV_COLLAPSE[h.dataset.g];localStorage.setItem("axiom_nav_collapse",JSON.stringify(NAV_COLLAPSE));renderNav(active);};
    h.ondragstart=e=>{dragG=h.dataset.g;h.style.opacity=".4";e.stopPropagation();};
    h.ondragend=()=>{h.style.opacity="1";dragG=null;$("#nav").querySelectorAll(".navhdr").forEach(x=>x.classList.remove("drop-hi"));};
    h.ondragover=e=>{if(dragG&&dragG!==h.dataset.g){e.preventDefault();h.classList.add("drop-hi");}};
    h.ondragleave=()=>h.classList.remove("drop-hi");
    h.ondrop=e=>{h.classList.remove("drop-hi");if(!dragG||dragG===h.dataset.g)return;e.preventDefault();
      const order=NAV_GROUPS.map(g=>g.title||"_");
      const from=order.indexOf(dragG),to=order.indexOf(h.dataset.g);
      const [m]=order.splice(from,1);order.splice(to,0,m);
      NAV_GORDER=order;localStorage.setItem("axiom_nav_gorder",JSON.stringify(order));renderNav(active);};
  });
  let drag=null, dragGroup=null;
  $("#nav").querySelectorAll("a[draggable]").forEach(a=>{
    a.ondragstart=()=>{drag=a;dragGroup=a.dataset.g;a.style.opacity=".4";};
    a.ondragend=()=>{a.style.opacity="1";drag=null;dragGroup=null;};
    a.ondragover=e=>e.preventDefault();
    a.ondrop=e=>{e.preventDefault();if(!drag||drag===a)return;
      const targetGroup=a.dataset.g,srcGroup=drag.dataset.g;
      if(srcGroup===targetGroup){
        // перестановка внутри группы
        const g=NAV_GROUPS.find(x=>(x.title||"_")===srcGroup);if(!g)return;
        const from=g.items.findIndex(i=>i.id===drag.dataset.id),to=g.items.findIndex(i=>i.id===a.dataset.id);
        const [m]=g.items.splice(from,1);g.items.splice(to,0,m);
      }else{
        // перемещение между группами
        const srcG=NAV_GROUPS.find(x=>(x.title||"_")===srcGroup);if(!srcG)return;
        const tgtG=NAV_GROUPS.find(x=>(x.title||"_")===targetGroup);if(!tgtG)return;
        const from=srcG.items.findIndex(i=>i.id===drag.dataset.id);if(from<0)return;
        const [m]=srcG.items.splice(from,1);
        const to=tgtG.items.findIndex(i=>i.id===a.dataset.id);
        tgtG.items.splice(to<0?tgtG.items.length:to,0,m);
      }
      // сохраняем порядок для обеих групп
      NAV_ORDER=NAV_ORDER||{};
      [srcGroup,targetGroup].forEach(gTitle=>{
        const g=NAV_GROUPS.find(x=>(x.title||"_")===gTitle);
        if(g)NAV_ORDER[gTitle]=g.items.map(i=>i.id);
      });
      localStorage.setItem("axiom_nav_order",JSON.stringify(NAV_ORDER));renderNav(active);};
  });
}

      +`<div class="hint" style="margin:6px 0">Данные о компаниях/ЦА (сайт, ИНН, досье) собираются на шаге «Обогатить пачку» в разделе Компании — агент учтёт их в диалоге.</div>`+wzCopilotBlock("prompt");
  }else if(step.k==="launch"){
    const edit=!!WZ.editId;
    body=`<div class="card" style="background:var(--panel2);padding:14px">
      <b>${edit?"Проверка кампании":"Сводка кампании"}</b>
      <div class="sub" style="margin-top:8px;white-space:pre-wrap">${esc(wzCtx())}\nПромпт: ${esc((d.prompt||"").slice(0,160))}${d.prompt&&d.prompt.length>160?"…":""}</div></div>
      ${edit?"":`<div class="field" style="margin:10px 0"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="wz-autoproxy"> 📡 Включить бесплатный авто-пул MTProto-прокси (если нет платных)</label>
        <div class="hint">Соберёт прокси из каналов и раздаст аккаунтам автоматически. Только Telegram, времянка — на боевую лучше платные.</div></div>`}
      <div class="hint" style="margin:10px 0">${edit?"Сохраню изменения в существующую кампанию (название, оффер→первое сообщение, промпт, аудитория, канал). Аккаунты/КП-набор — в «⚙ Настроить».":"При запуске создам: проект, воронку, кампанию (оффер → первое сообщение, промпт → агент), и нишу из ключей. Дальше назначишь аккаунты-отправители и жмёшь ▶."}</div>
      <button class="primary" id="wz-launch" style="font-size:15px;padding:12px 20px">${edit?"Сохранить изменения":"💰 Запустить (клиенты на автомате)"}</button>
      <div id="wz-launch-msg" style="margin-top:10px"></div>`;
  }
  v.innerHTML=`<div class="card" id="wz-card" style="max-width:760px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div>${dots}</div><button id="wz-exit">✕ выйти</button></div>
    <div style="font-weight:700;font-size:16px;margin-bottom:12px">${esc(step.t)}</div>
    ${body}
    <div class="ttoolbar" style="margin-top:16px">
      ${WZ.i>0?'<button id="wz-prev">← Назад</button>':''}
      <span class="grow"></span>
      ${WZ.i<WZ_STEPS.length-1?'<button class="primary" id="wz-next">Далее →</button>':''}
    </div></div>`;
  const save=()=>{const g=id=>{const el=document.getElementById(id);return el?el.value:undefined;};
    const map={"wz-name":"name","wz-client":"client","wz-channel":"channel","wz-goal":"goal","wz-audience_tag":"audience_tag","wz-keywords":"keywords","wz-funnel":"funnel","wz-kev":"kev","wz-offer":"offer","wz-prompt":"prompt"};
    for(const[id,k]of Object.entries(map)){const val=g(id);if(val!==undefined)d[k]=val;}wzPersist();};
  // автосохранение при любом вводе (на случай если выбьет/перезагрузит страницу)
  const wzCard=$("#wz-card");if(wzCard){wzCard.addEventListener("input",()=>save());wzCard.addEventListener("change",()=>save());}
  $("#wz-exit").onclick=()=>{save();WZ=null;route();};
  const pv=$("#wz-prev");if(pv)pv.onclick=()=>{save();WZ.i--;renderWizard();};
  const nx=$("#wz-next");if(nx)nx.onclick=()=>{save();WZ.i++;renderWizard();};
  const cop=$("#wz-cop");if(cop)cop.onclick=async()=>{save();const b=cop,m=$("#wz-cop-msg");b.disabled=true;b.textContent="думаю…";m.textContent="";
    const r=await api("/api/copilot",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({step:b.dataset.step,context:wzCtx()})});
    b.disabled=false;b.textContent="💡 Подсказка от Claude";
    if(r.error){m.innerHTML='<span style="color:#c0392b">'+esc(r.error)+'</span>';return;}
    $("#wz-cop-out").innerHTML=`<div class="card" style="background:var(--accent-soft);padding:10px;white-space:pre-wrap">${esc(r.text)}<div style="margin-top:8px"><button id="wz-cop-ins">↳ вставить в поле</button></div></div>`;
    const ins=$("#wz-cop-ins");if(ins)ins.onclick=()=>{const map={goal:"wz-goal",audience:"wz-keywords",funnel:"wz-funnel",offer:"wz-offer",prompt:"wz-prompt"};const t=document.getElementById(map[b.dataset.step]);if(t){t.value=(t.value?t.value+"\n":"")+r.text;save();}};
  };
  const gp=$("#wz-go-parser");if(gp)gp.onclick=()=>{save();WZ=null;location.hash="parser";};
  const g2=$("#wz-go-2gis");if(g2)g2.onclick=()=>{save();WZ=null;location.hash="companies";};
  const pc=$("#wz-pick-crm");if(pc)pc.onclick=()=>{save();showAudiencePicker(d);};
  const pg=$("#wz-phones-go");if(pg)pg.onclick=async()=>{const t=$("#wz-phones").value;if(!t.trim())return;pg.disabled=true;pg.textContent="…";
    const srcEl=$("#wz-phones-source");const source=(srcEl&&srcEl.value.trim())||"";
    const r=await api("/api/import/phones",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t,tag:d.audience_tag,source})});
    pg.disabled=false;pg.textContent="Загрузить телефоны";
    $("#wz-phones-msg").textContent=r.error?("ошибка: "+r.error):`✅ загружено ${r.imported}, всего в базе ${r.total}`;};
  const lb=$("#wz-launch");if(lb)lb.onclick=()=>wzLaunch();
}
async function wzLaunch(){
  const d=WZ.data;const msg=$("#wz-launch-msg");const lb=$("#wz-launch");
  if(!d.name.trim()){msg.innerHTML='<span style="color:#c0392b">укажи название (шаг 1)</span>';return;}
  lb.disabled=true;lb.textContent="сохраняю…";
  // Режим проверки/редактирования: обновляем существующую кампанию, без создания новой.
  if(WZ.editId){
    try{
      const r=await api(`/api/campaign/${WZ.editId}/update`,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({name:d.name,product:d.client,audience_tag:d.audience_tag,channel:d.channel,
          message_template:d.offer,agent_prompt:d.prompt,kp_text:d.kp_text||""})});
      if(r.error){msg.innerHTML='<span style="color:#c0392b">'+esc(r.error)+'</span>';lb.disabled=false;lb.textContent="Сохранить изменения";return;}
      if(d.keywords.trim())await api("/api/niches",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:d.name,keywords:d.keywords})});
      wzClearDraft();
      msg.innerHTML=`<div class="card" style="background:var(--green-soft);padding:12px">✅ Кампания обновлена.<div style="margin-top:8px"><button class="primary" id="wz-done">К кампаниям →</button></div></div>`;
      const done=$("#wz-done");if(done)done.onclick=()=>{WZ=null;location.hash="campaigns";route();};
    }catch(e){msg.innerHTML='<span style="color:#c0392b">ошибка: '+esc(e.message)+'</span>';lb.disabled=false;lb.textContent="Сохранить изменения";}
    return;
  }
  lb.textContent="запускаю…";
  try{
    let project_id=null;
    const pr=await api("/api/projects",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:d.name,entity:d.client,description:d.goal})});
    project_id=pr.id||null;
    const pl=await api("/api/pipelines",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:d.client||d.name,product:d.client||d.name,project_id})});
    const camp=await api("/api/campaigns",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      name:d.name,product:d.client,audience_tag:d.audience_tag,channel:d.channel,
      message_template:d.offer,agent_prompt:d.prompt,project_id})});
    if(camp.error){msg.innerHTML='<span style="color:#c0392b">'+esc(camp.error)+'</span>';lb.disabled=false;lb.textContent="💰 Запустить (клиенты на автомате)";return;}
    if(d.keywords.trim())await api("/api/niches",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:d.name,keywords:d.keywords})});
    let proxyNote="";
    const ap=document.getElementById("wz-autoproxy");
    if(ap&&ap.checked){await api("/api/proxies/auto",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({auto:true,interval_h:6})});proxyNote="<br>📡 Бесплатный авто-пул MTProto включён — прокси соберутся и раздадутся в фоне (минуту).";}
    msg.innerHTML=`<div class="card" style="background:var(--green-soft);padding:12px">✅ Создано: проект, воронка, кампания${d.keywords.trim()?", ниша для прослушки":""}.${proxyNote}<br>
      Дальше: открой кампанию → назначь аккаунты-отправители (команда) → жми ▶ «Запустить». Агенты начнут писать и вести к КЭВ.
      <div style="margin-top:8px"><button class="primary" id="wz-done">К кампаниям →</button></div></div>`;
    wzClearDraft();
    const done=$("#wz-done");if(done)done.onclick=()=>{WZ=null;location.hash="campaigns";route();};
  }catch(e){msg.innerHTML='<span style="color:#c0392b">ошибка: '+esc(e.message)+'</span>';lb.disabled=false;lb.textContent="💰 Запустить (клиенты на автомате)";}
}

// ----------------------------------------------------------------- notifications
let NOTIF=[];
function notifSeenTs(){return localStorage.getItem("axiom_notif_seen")||"";}
async function refreshNotif(){
  try{const r=await api("/api/notifications");NOTIF=r.items||[];}catch(e){NOTIF=[];}
  const seen=notifSeenTs();
  const unseen=NOTIF.filter(n=>(n.type==="msg"||n.type==="event")&&(n.ts||"")>seen).length;
  const b=$("#bell-badge");
  if(unseen>0){b.textContent=unseen>99?"99+":unseen;b.style.display="";}else b.style.display="none";
}
const EVENT_IC={campaign_start:"▶",campaign_done:"✅",lead:"🔥",meeting:"📅",ban:"⛔",account_banned:"⛔",warm_ready:"🌡",warm_check:"⚠️",info:"ℹ️",
  chat_join:"➕",outreach:"📨",hit:"🎯",reply:"💬",warm_run:"🔥",agent_error:"🔴",campaign_test:"🧪",campaign_stop:"⏸"};
function renderNotif(){
  const box=$("#notif");
  if(!NOTIF.length){box.innerHTML='<div class="empty" style="padding:24px">Пока пусто</div>';return;}
  box.innerHTML=NOTIF.map(n=>{
    if(n.type==="event"){
      const ic=EVENT_IC[n.event_type]||"•";
      const col=n.level==="warn"?"#c0392b":(n.level==="good"?"var(--green)":"var(--muted)");
      const nav=n.contact_id?`data-cid="${n.contact_id}"`:(n.campaign_id?`data-camp="${n.campaign_id}"`:"");
      // глазок открывает подробности, не уводя со страницы: в строке текст обрезан,
      // а понять «кто именно и что написал» без полной карточки нельзя
      const eye=n.id?`<button class="ni-eye" data-eid="${n.id}" title="Подробности">👁</button>`:"";
      return `<div class="ni" ${nav}>
        <span class="ic">${ic}</span>
        <div class="tx"><div class="who" style="color:${col}">${esc(n.title||"")}</div>
          ${n.text?`<div class="msg">${esc(n.text)}</div>`:""}
          ${n.account?`<div class="msg" style="opacity:.75">с аккаунта: ${esc(n.account)}</div>`:""}</div>
        ${eye}<span class="tm">${fmt(n.ts)}</span></div>`;
    }
    return `<div class="ni" data-cid="${n.contact_id}">
      <span class="ic">${n.type==="meeting"?"📅":"💬"}</span>
      <div class="tx"><div class="who">${esc(n.who||"—")}</div>
        <div class="msg">${n.type==="meeting"?"назначена встреча":esc(n.text)}</div></div>
      <span class="tm">${fmt(n.ts)}</span></div>`;}).join("");
  box.querySelectorAll(".ni-eye").forEach(b=>b.onclick=e=>{
    e.stopPropagation();          // иначе клик по строке уведёт в досье и окно не увидят
    showEvent(+b.dataset.eid);});
  box.querySelectorAll(".ni").forEach(el=>el.onclick=()=>{$("#notif").style.display="none";
    if(el.dataset.cid)openDossier(+el.dataset.cid);
    else if(el.dataset.camp){location.hash="campaigns";}});
}

// Полная карточка события: кто сделал, кому, что именно ушло + что аккаунт делал рядом.
async function showEvent(eid){
  const wrap=document.createElement("div");wrap.className="org-mform-wrap";
  wrap.innerHTML='<div class="org-mform-inner" style="max-width:620px">загружаю…</div>';
  document.body.appendChild(wrap);
  const close=()=>wrap.remove();
  wrap.onclick=e=>{if(e.target===wrap)close();};
  document.addEventListener("keydown",function esc2(e){
    if(e.key==="Escape"){close();document.removeEventListener("keydown",esc2);}});
  let d;
  try{d=await api(`/api/event/${eid}`);}catch(e){d=null;}
  const inner=wrap.querySelector(".org-mform-inner");
  if(!d||d.error){inner.innerHTML=`<div style="color:#c0392b">не удалось загрузить: ${esc((d&&d.error)||"нет ответа")}</div>
    <div style="margin-top:12px"><button class="modal-close">закрыть</button></div>`;
    inner.querySelector(".modal-close").onclick=close;return;}
  const row=(k,v)=>v?`<div style="display:flex;gap:10px;margin-bottom:4px"><span class="hint" style="min-width:96px">${k}</span><span>${v}</span></div>`:"";
  const a=d.account,c=d.contact,cm=d.campaign;
  const msgs=(d.messages||[]).map(m=>`<div style="margin-bottom:6px;padding:7px 9px;border-radius:8px;background:var(--panel2);
      border-left:3px solid ${m.direction==="out"?"var(--accent)":"var(--green)"}">
      <div class="hint">${m.direction==="out"?"мы →":"← он"}${m.account?" · "+esc(m.account):""} · ${fmt(m.ts)}</div>
      <div style="white-space:pre-wrap;word-break:break-word">${esc(m.text||"")}</div></div>`).join("");
  const joined=(d.joined||[]).map(j=>`<div class="hint">➕ ${esc(j.title||"чат")}${j.username?" (@"+esc(j.username)+")":""} — ${fmt(j.joined_at)}</div>`).join("");
  const sent=(d.sent||[]).map(s=>`<div class="hint">📨 ${esc(s.who||"—")}${s.account?" · "+esc(s.account):""} — ${esc(s.status||"")}${s.detail?": "+esc(s.detail):""} · ${fmt(s.ts)}</div>`).join("");
  inner.innerHTML=`
    <div style="font-weight:700;font-size:15px;margin-bottom:2px">${esc(d.title||"Событие")}</div>
    <div class="hint" style="margin-bottom:12px">${fmt(d.ts)} · тип: ${esc(d.type||"")}</div>
    ${d.text?`<div style="white-space:pre-wrap;word-break:break-word;padding:10px 12px;border-radius:10px;
        background:var(--panel2);margin-bottom:14px">${esc(d.text)}</div>`:""}
    ${a?`<div style="font-weight:600;margin:12px 0 6px">Кто сделал</div>
      ${row("аккаунт",esc(a.label||("#"+a.id)))}${row("телефон",esc(a.phone||""))}
      ${row("в Telegram",a.username?"@"+esc(a.username):esc(a.tg_name||""))}
      ${row("статус",esc(a.status||""))}${row("страна",esc(a.country||""))}`:""}
    ${c?`<div style="font-weight:600;margin:12px 0 6px">Кому</div>
      ${row("контакт",esc(c.person_name||c.name||""))}${row("@",c.username?"@"+esc(c.username):"")}
      ${row("телефон",esc(c.phone||""))}${row("город",esc(c.city||""))}
      ${row("ниша",esc(c.niche||""))}${row("продаёт",esc(c.offer||""))}${row("статус",esc(c.status||""))}
      <div style="margin-top:8px"><button class="primary" id="ev-open">открыть карточку →</button></div>`:""}
    ${cm?`<div style="font-weight:600;margin:12px 0 6px">Кампания</div>${row("название",esc(cm.name||""))}${row("статус",esc(cm.status||""))}`:""}
    ${msgs?`<div style="font-weight:600;margin:14px 0 6px">Переписка</div>${msgs}`:""}
    ${joined?`<div style="font-weight:600;margin:14px 0 6px">Куда этот аккаунт вступал</div>${joined}`:""}
    ${sent?`<div style="font-weight:600;margin:14px 0 6px">Что отправлял</div>${sent}`:""}
    <div style="margin-top:16px"><button class="modal-close">закрыть</button></div>`;
  inner.querySelector(".modal-close").onclick=close;
  const ob=inner.querySelector("#ev-open");
  if(ob)ob.onclick=()=>{close();$("#notif").style.display="none";openDossier(c.id);};
}
$("#bell").onclick=()=>{const box=$("#notif");const open=box.style.display==="none";
  if(open){renderNotif();box.style.display="block";
    if(NOTIF.length)localStorage.setItem("axiom_notif_seen",NOTIF.reduce((a,n)=>n.ts>a?n.ts:a,""));
    $("#bell-badge").style.display="none";
  }else box.style.display="none";};
document.addEventListener("click",e=>{if(!e.target.closest(".bellwrap"))$("#notif").style.display="none";});

const SKELS={
  dashboard:'<div class="skel-wrap"><div class="skel skel-hdr"></div><div class="skel skel-row" style="width:50%"></div><div class="skel-grid"><div class="skel skel-card"></div><div class="skel skel-card"></div><div class="skel skel-card"></div></div><div class="skel skel-row"></div><div class="skel skel-row" style="width:70%"></div></div>',
  agents:'<div class="skel-wrap"><div class="skel skel-hdr"></div><div class="skel skel-row" style="width:40%"></div><div class="skel skel-table"><div class="skel skel-row"></div><div class="skel skel-row"></div><div class="skel skel-row"></div><div class="skel skel-row"></div></div></div>',
  deals:'<div class="skel-wrap"><div class="skel skel-hdr"></div><div class="skel-grid" style="grid-template-columns:repeat(5,1fr)"><div class="skel skel-card" style="height:300px"></div><div class="skel skel-card" style="height:300px"></div><div class="skel skel-card" style="height:300px"></div><div class="skel skel-card" style="height:300px"></div><div class="skel skel-card" style="height:300px"></div></div></div>',
  orgchart:'<div class="skel-wrap"><div class="skel skel-hdr"></div><div class="skel skel-row" style="width:60%"></div><div class="skel-grid"><div class="skel skel-card" style="height:120px"></div><div class="skel skel-card" style="height:120px;width:70%"></div></div></div>',
  default:'<div class="skel-wrap"><div class="skel skel-hdr"></div><div class="skel-grid"><div class="skel skel-card"></div><div class="skel skel-card"></div></div><div class="skel skel-row"></div><div class="skel skel-row" style="width:60%"></div></div>',
};
// Прямые ссылки на сущности (как в Битрикс): #dossier/295, #deals/12, #contacts/7, #chats/295
function openEntityDeep(section,id){
  id=+id; if(!id)return;
  setTimeout(()=>{
    try{
      if(section==="dossier"||section==="contacts"||section==="leads")openDossier(id);
      else if(section==="deals")openDeal(id);
      else if(section==="companies")openCompany(id);
      // #chats/{id} — сразу открыть переписку с контактом, а не карточку CRM. Нужен
      // отдельный раздел от dossier: ссылка «договорились о встрече» (channels/notify.py)
      // ведёт СЮДА — оператору важно увидеть, о чём именно был разговор, а не полезть
      // сначала в досье и оттуда ещё кликать «переписка».
      else if(section==="chats")openThread(id);
    }catch(e){}
  },400);
}
// Высота топбара разная на разных страницах (кнопки справа переносятся на узких экранах) —
// шапка smartTable должна прилипать РОВНО под ним, а не под жёстко зашитым числом.
function _syncTopbarH(){
  const tb=document.querySelector(".topbar");
  if(tb)document.documentElement.style.setProperty("--topbar-h",tb.offsetHeight+"px");
}
window.addEventListener("resize",_syncTopbarH);
async function route(){
  const raw=(location.hash||"#dashboard").slice(1);
  const slash=raw.indexOf("/");
  const section=slash>=0?raw.slice(0,slash):raw;
  const entityId=slash>=0?raw.slice(slash+1):null;
  const nav=NAV.find(n=>n.id===section)||NAV[0];
  renderNav(nav.id);$("#title").textContent=nav.label;
  const v=$("#view");v.innerHTML=SKELS[nav.id]||SKELS.default;
  try{await (VIEWS[nav.id]||viewDashboard)(v);}catch(e){v.innerHTML=`<div class="empty">Ошибка: ${esc(e.message)}</div>`;}
  if(entityId)openEntityDeep(section,entityId);
  $("#upd").textContent="обновлено "+new Date().toLocaleTimeString("ru-RU");
  refreshNotif();
  _syncTopbarH();
}
window.addEventListener("hashchange",route);
$("#refresh").onclick=route;
$("#logout-btn").onclick=()=>{document.cookie="axiom_auth=;path=/;max-age=0";location.href="/login";};
route();
setInterval(refreshNotif,60000);
</script>
