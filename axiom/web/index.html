// Кто в рассылке: поимённый список аудитории кампании. Отвечает на вопрос, который
// раньше требовал похода в базу — «выбрал 288, а в очереди 180, куда делись?».
// Галочка = участвует; снятая кладёт контакт в campaign_paused_contacts (пауза
// именно в этой кампании, глобальный статус не трогаем — он же в других кампаниях).
const MSG_MARK={yes:'<span class="badge b-active" title="проверено — есть">✓</span>',
  no:'<span class="badge b-stop" title="проверено — нет">✕</span>',
  unknown:'<span class="badge b-nurture" title="ещё не проверяли">?</span>'};
async function openAudience(cid){
  const wrap=document.createElement("div");wrap.className="org-mform-wrap";
  wrap.innerHTML='<div class="org-mform-inner" style="max-width:900px">гружу список…</div>';
  document.body.appendChild(wrap);
  const close=()=>wrap.remove();
  wrap.onclick=e=>{if(e.target===wrap)close();};
  document.addEventListener("keydown",function esc4(e){
    if(e.key==="Escape"){close();document.removeEventListener("keydown",esc4);}});
  let AUD_ONLY="";    // "" | queue | blocked
  const draw=async()=>{
    const inner=wrap.querySelector(".org-mform-inner");
    let d;try{d=await api(`/api/campaign/${cid}/audience`);}catch(e){d=null;}
    if(!d||d.error){inner.innerHTML=`<div style="color:#c0392b">${esc((d&&d.error)||"не загрузилось")}</div>
      <div style="margin-top:12px"><button class="modal-close">закрыть</button></div>`;
      inner.querySelector(".modal-close").onclick=close;return;}
    const rows=d.items.filter(r=>AUD_ONLY==="queue"?r.in_queue:AUD_ONLY==="blocked"?!r.in_queue:true);
    const reasons=Object.entries(d.reasons||{}).map(([k,v])=>`${esc(k)}: <b>${v}</b>`).join(" · ");
    inner.innerHTML=`
      <div style="font-weight:700;font-size:15px">👥 Кто в рассылке — ${esc(d.campaign||"")}</div>
      <div class="hint" style="margin-bottom:10px">тег аудитории: ${d.tag?esc(d.tag):"<i>не задан (вся база)</i>"} · канал: ${esc(d.channel||"")}</div>
      <div class="card" style="background:var(--panel2);padding:9px 11px;margin-bottom:10px">
        <b>${d.in_queue}</b> из <b>${d.total}</b> пойдут в рассылку.
        ${reasons?`<div class="hint" style="margin-top:4px">Остальные не пойдут — ${reasons}</div>`:""}
        ${(d.unchecked_tg||d.unchecked_wa)?`<div class="hint" style="margin-top:4px;color:#c0392b">⚠️ не проверено: Telegram у ${d.unchecked_tg}, WhatsApp у ${d.unchecked_wa}. Непробитый номер резолвится прямо во время рассылки — это прямой путь к бану аккаунта.</div>
        <div class="ttoolbar" style="margin:6px 0 0">
          <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer" title="фоном, по 25 номеров на аккаунт в сутки — безопасный темп"><input type="checkbox" id="aud-tgauto"> пробивать Telegram фоном</label>
          <button id="aud-tgrun" title="пробить порцию прямо сейчас (25 на аккаунт)">Пробить сейчас</button>
          <span class="hint" id="aud-tgmsg"></span></div>`:""}
      </div>
      <div class="ttoolbar" style="margin:0 0 8px">
        ${[["","все"],["queue","только кто пойдёт"],["blocked","только выпавшие"]].map(([k,l])=>
          `<button class="aud-f ${AUD_ONLY===k?"primary":""}" data-f="${k}">${l}</button>`).join("")}
        <span class="grow"></span>
        <button id="aud-selall" title="поставить галочки на все строки текущего фильтра, кому это ещё разрешено (не выпавшие по другой причине)">☑ выделить все</button>
        <button id="aud-selnone" title="снять со всех строк текущего фильтра — контакт пропускается ИМЕННО в этой кампании">☐ снять все</button>
        <span class="hint">${rows.length} строк</span>
      </div>
      <div id="aud-tbl"></div>
      <div class="ttoolbar" style="margin:10px 0 0"><span class="hint" id="aud-msg">Снятая галочка = контакт пропускается ИМЕННО в этой кампании. В других он остаётся.</span>
        <span class="grow"></span><button class="modal-close">закрыть</button></div>`;
    inner.querySelector(".modal-close").onclick=close;
    // smartTable даёт то же самое, что и в остальных таблицах пульта, бесплатно:
    // перетаскивание колонок за ⠿, сужение за край заголовка, показ/скрытие,
    // сортировку кликом по шапке. Раньше это окно было отдельной вручную собранной
    // <table> без единой из этих возможностей.
    const audTbl=inner.querySelector("#aud-tbl");
    smartTable(audTbl,{
      tableKey:"campaign_audience",
      rows,searchKeys:["who","username","phone","status","blocked_by"],
      columns:[
        {key:"in_queue",label:"Шлём",render:r=>`<input type="checkbox" class="aud-chk" data-id="${r.id}" ${r.paused?"":"checked"} ${(!r.in_queue&&!r.paused)?"disabled title='не пойдёт по другой причине'":""}>`},
        {key:"who",label:"Кто",cls:"name",render:r=>`<b>${esc(r.who||("#"+r.id))}</b>${r.username?` <span class="tg">@${esc(r.username)}</span>`:""}${r.phone?` <span class="hint">${esc(r.phone)}</span>`:""}`},
        {key:"has_tg",label:"TG",render:r=>MSG_MARK[r.has_tg||"unknown"]||MSG_MARK.unknown},
        {key:"has_wa",label:"WA",render:r=>MSG_MARK[r.has_wa||"unknown"]||MSG_MARK.unknown},
        {key:"status",label:"Статус",cls:"sub",render:r=>esc(r.status||"")},
        {key:"blocked_by",label:"Почему не пойдёт",cls:"sub",render:r=>r.blocked_by?esc(r.blocked_by):""},
      ],
      emptyText:"Пусто по текущему фильтру.",
    });
    // Делегированный обработчик на КОНТЕЙНЕРЕ, не на строках: smartTable перерисовывает
    // тело таблицы при сортировке/поиске/странице, и обработчики на самих чекбоксах
    // потерялись бы при первом же клике по заголовку.
    audTbl.addEventListener("change",async(e)=>{
      const ch=e.target.closest(".aud-chk");if(!ch)return;
      const id=+ch.dataset.id,m=inner.querySelector("#aud-msg");
      const url=ch.checked?"unpause_contacts":"pause_contacts";
      const r=await api(`/api/campaign/${cid}/${url}`,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contact_ids:[id]})});
      m.textContent=r.error?("ошибка: "+r.error):(ch.checked?"вернули в рассылку":"снят из этой кампании");
      if(!r.error)route();});
    inner.querySelectorAll(".aud-f").forEach(b=>b.onclick=()=>{AUD_ONLY=b.dataset.f;draw();});
    // Пробив TG — прямо здесь, где проблема и видна: иначе оператор читает
    // предупреждение и не знает, куда идти его лечить.
    const tgAuto=inner.querySelector("#aud-tgauto"),tgRun=inner.querySelector("#aud-tgrun");
    if(tgAuto){
      api("/api/tgcheck").then(s=>{if(s&&!s.error){tgAuto.checked=!!s.auto;
        const m=inner.querySelector("#aud-tgmsg");
        if(m)m.textContent=`не пробито всего: ${s.left} · найдено в TG: ${s.found} · нет в TG: ${s.absent}`+(s.last_run?` · последний проход ${s.last_run}`:"");}});
      tgAuto.onchange=async()=>{await api("/api/tgcheck",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({auto:tgAuto.checked})});
        inner.querySelector("#aud-tgmsg").textContent=tgAuto.checked?"включено — пойдёт фоном, по 25 на аккаунт в сутки":"выключено";};
      tgRun.onclick=async()=>{const m=inner.querySelector("#aud-tgmsg");
        tgRun.disabled=true;tgRun.textContent="пробиваю…";
        let sec=0;const t=setInterval(()=>{sec++;m.textContent=`аккаунты пробивают номера… ${sec} с`;},1000);
        const r=await api("/api/tgcheck",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({run:true,tag:d.tag||null})});
        clearInterval(t);tgRun.disabled=false;tgRun.textContent="Пробить сейчас";
        m.textContent=r&&r.error?("ошибка: "+r.error):`готово: ${JSON.stringify(r).slice(0,160)}`;
        draw();};
    }
    // «выделить/снять все» — в пределах ТЕКУЩЕГО фильтра (все/только пойдут/только
    // выпавшие) и только там, где галочка вообще что-то решает: у выпавших по другой
    // причине (нет username/телефона и т.п.) чекбокс задизейблен не просто так, их
    // не трогаем. Один запрос на всю пачку, а не по запросу на галочку — на 290
    // строках щёлкать поштучно было единственным способом снять источник целиком.
    const bulkSet=async(want)=>{
      const m=inner.querySelector("#aud-msg");
      const targets=rows.filter(r=>(r.in_queue||r.paused)&&(want?r.paused:!r.paused));
      if(!targets.length){m.textContent=want?"уже все выбраны":"уже все сняты";return;}
      // «Снять все» гасит СРАЗУ ВСЮ текущую очередь этой кампании — 07-08.08.2026 так
      // отключили всю боевую аудиторию (44 из 44), и рассылка молчала несколько дней,
      // пока не нашли причину в базе. Подтверждение с числом — последний шанс заметить.
      if(!want&&!confirm(`Снять из рассылки ${targets.length} контакт(ов)?\n\nИменно в этой кампании — в других они останутся. Рассылка перестанет их видеть, пока не вернёшь галочкой обратно.`))return;
      const url=want?"unpause_contacts":"pause_contacts";
      const r=await api(`/api/campaign/${cid}/${url}`,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contact_ids:targets.map(x=>x.id)})});
      m.textContent=r.error?("ошибка: "+r.error)
        :(want?`вернули в рассылку: ${targets.length}`:`сняли из этой кампании: ${targets.length}`);
      if(!r.error)draw();
    };
    const selAllBtn=inner.querySelector("#aud-selall"),selNoneBtn=inner.querySelector("#aud-selnone");
    if(selAllBtn)selAllBtn.onclick=()=>bulkSet(true);
    if(selNoneBtn)selNoneBtn.onclick=()=>bulkSet(false);
  };
  await draw();
}

    if(res&&res.error){alert(res.error);return false;}
    return true;
  };
  smartTable($("#acc-tbl"),{
    tableKey:"agents",
    rows:aShown,searchKeys:["label","phone","username","role"],
    onDraw:rows=>{accFiltered=rows;},
    // Зелёная подсветка «рабочих» — с кем можно работать прямо сейчас: подключён,
    // сессия жива, прокси жив, не забанен. Видно на глаз, кого пускать в бой.
    rowClass:r=>(r.tg_connected&&r.session_state==='alive'&&r.proxy_alive===1&&r.status!=='banned')?"row-ready":"",
    groupOptions:[{key:"protected",label:"родной/боевой"},{key:"role",label:"роль"},{key:"status",label:"статус"},{key:"session_state",label:"живость"}],
    groupFmt:(k,val)=>k==="protected"?(val==="1"?"🏠 Родные (личные номера)":"🪖 Боевая бригада"):k==="role"?(ROLE_RU[val]||val):k==="session_state"?(ACC_LIVE[val]||"⚪ не проверялись"):(ACC_ST[val]||val),
    onRowClick:openAgent,
    columns:[
      {key:"sel",label:"",render:r=>`<input type="checkbox" class="acc-sel" data-id="${r.id}" ${selAcc.has(r.id)?"checked":""}>`},
      {key:"label",label:"Ярлык",cls:"name",render:r=>`<span style="display:inline-flex;align-items:center;gap:8px">${r.avatar?`<img src="/api/account/${r.id}/avatar?t=${Date.now()}" style="width:26px;height:26px;border-radius:50%;object-fit:cover">`:`<span style="width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:#7A530A;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">${esc((r.label||r.phone||"?").slice(0,1).toUpperCase())}</span>`}${esc(r.label)||'<span class="no">—</span>'}${r.protected?` <span class="badge b-active" title="Родной номер — автоматика (прогрев/рассылка) его не трогает">🏠 родной</span>`:''}${r.tg_connected?` <button class="acc-eye" data-id="${r.id}" data-label="${esc(r.label||r.username||('#'+r.id))}" title="Заглянуть внутрь: профиль + переписки, без входа в Telegram">👁</button>`:''}</span>`},
      {key:"phone",label:"Телефон",cls:"mono",render:r=>`${esc(r.phone)||'<span class="no">—</span>'}`},
      {key:"country_label",label:"Страна",cls:"sub",render:r=>r.country_label?esc(r.country_label):'<span class="no" title="страна не определена по коду номера">—</span>'},
      {key:"username",label:"Ник TG",render:r=>r.username?`<span class="tg">@${esc(r.username)}</span>`:'<span class="no">—</span>'},
      {key:"conn",label:"Подключение",render:r=>{
        const tg=r.tg_connected?'<span class="badge b-active">TG ✓</span>':'<span class="badge b-nurture">TG —</span>';
        const wa=r.wa_authed==='yes'?'<span class="badge b-active">WA ✓</span>':'<span class="badge b-nurture">WA —</span>';
        const spam=r.spam_status==='ok'?' <span class="badge b-active" title="@SpamBot: чисто">SB✓</span>'
          :(r.spam_status&&r.spam_status!=='unknown'?` <span class="badge b-stop" title="@SpamBot: ${esc(r.spam_status)}">SB⚠</span>`:'');
        const conn=r.tg_connected?'':` <button class="acc-login" data-id="${r.id}" data-phone="${esc(r.phone||'')}" data-label="${esc(r.label||r.username||('#'+r.id))}" style="font-size:11px;padding:2px 8px">🔌 Подключить</button>`;
        return tg+" "+wa+spam+conn;}},
      {key:"session_alive",label:"Живость",render:r=>{
        if(!r.tg_connected)return '<span class="no" title="аккаунт не подключён — сессии нет. Жми «🔌 Подключить» в колонке «Подключение»">нет сессии</span>';
        const when=r.session_checked_at?`проверено ${fmt(r.session_checked_at)}`:'';
        const why=r.session_reason?` · ${r.session_reason}`:'';
        const tip=esc(when+why);
        if(r.session_state==='alive')return `<span class="badge b-active" title="${tip}"><span class="sdot g"></span>жив</span>`;
        if(r.session_state==='banned')return `<span class="badge b-stop" title="${tip}">бан</span>`;
        if(r.session_state==='revoked')return `<span class="badge b-stop" title="${tip}"><span class="sdot r"></span>сессия слетела</span>`;
        if(r.session_state==='noconn')return `<span class="badge b-nurture" title="не достучались ни через прокси, ни напрямую — про сессию не судим. ${tip}"><span class="sdot gy"></span>нет связи</span>`;
        return '<span class="badge b-nurture" title="ещё не проверялся — нажми «Проверить живость всех»"><span class="sdot gy"></span>не проверен</span>';
      }},
      {key:"kind",label:"Тип",cls:"sub",render:r=>`${r.protected?'🏠 ':''}${ACC_KIND[r.kind]||(r.kind?esc(r.kind):'<span class="no">—</span>')}`},
      {key:"role",label:"Роль",cls:"sub",render:r=>esc(ROLE_RU[r.role]||r.role||"—")},
      {key:"status",label:"Статус",render:r=>`<span class="badge b-${r.status==='active'?'active':r.status==='banned'?'stop':'nurture'}">${ACC_ST[r.status]||r.status}</span>`},
      {key:"warm_stage",label:"Прогрев",render:r=>{if(r.status!=='warming')return r.status==='active'?'<span class="badge b-active">✅ готов</span>':'<span class="no">—</span>';
        const st=r.warm_stage||0,pct=Math.round(st/14*100);
        return `<span class="warmb" title="Прогрев ${st} из 14 дней"><span class="wb-fill" style="width:${pct}%"></span><span class="wb-txt">прогрев ${st}/14 дн</span></span>`;}},
      {key:"proxy",label:"Прокси",cls:"sub",render:r=>{
        const pc=r.proxy_checked_at;
        // Красный значок и «нет» — не приговор, а кнопка: жмёшь → AXIOM сам подбирает
        // замену (пул MTProto → свежий бесплатный SOCKS5), проверяет её коннектом к
        // Telegram и значок тут же зеленеет. Тупиков в таблице быть не должно.
        const fix=(cls,dot,txt,tip)=>`<button class="acc-proxyfix" data-id="${r.id}" title="${esc(tip)}" style="background:none;border:0;padding:0;cursor:pointer"><span class="badge b-${cls}"><span class="sdot ${dot}"></span>${txt}</span></button>`;
        if(!r.proxy)return fix("nurture","gy","нет · подобрать",
          "Нажми — подберём бесплатный прокси (пул MTProto, если пуст — свежий SOCKS5) и проверим живым коннектом к Telegram");
        if(r.proxy_alive===1)return `<span class="badge b-active" title="проверено ${fmt(pc)||''} · ${esc(r.proxy)}"><span class="sdot g"></span>живой</span>`;
        if(r.proxy_alive===0)return fix("stop","r","мёртвый · заменить",
          `проверено ${fmt(pc)||''} — не отвечает. Нажми: подберём живой бесплатный и сразу проверим`);
        return `<span class="badge b-nurture" title="ещё не проверялся — нажми «Проверить прокси»"><span class="sdot gy"></span>не проверен</span>`;
      }},
      {key:"chats_count",label:"Чатов",cls:"mono",render:r=>r.chats_count?`<span class="badge b-active" title="чатов за аккаунтом по инвентаризации">${r.chats_count}</span>`:'<span class="no">—</span>'},
      {key:"listener",label:"Слушает чаты",render:r=>`<label class="acc-listen-wrap" title="${esc(r.is_listener?"Этот аккаунт опрашивает публичные чаты каталога. Сними галочку, чтобы исключить его из обхода":"Отметь — и обход каталога («Прослушать чаты сейчас») пойдёт в том числе через этот аккаунт. Отмечать можно несколько, включая родные: чтение чужих сообщений в публичном чате им разрешено")}" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" class="acc-listen" data-id="${r.id}"${r.is_listener?" checked":""}>
        ${r.is_listener?'<span class="badge b-active">👂 слушает</span>':'<span class="sub">слушать</span>'}</label>`},
      {key:"notifier",label:"Уведомляет о встречах",render:r=>togBtn(TOG.notify,r)},
      {key:"days_alive",label:"Куплен / жив",cls:"sub",render:r=>{
        const d=r.bought_at?String(r.bought_at).slice(0,10):'';
        const badge=(r.days_alive!=null)?`<span class="badge b-${r.status==='banned'?'stop':'active'}" title="дней с даты покупки — живучесть аккаунта">🕒 ${r.days_alive} дн</span>`:'<span class="no">—</span>';
        return (d?`<span class="mono" style="font-size:11px;opacity:.75">🛒 ${d}</span><br>`:'')+badge;}},
      // Когда аккаунт заведён в AXIOM (accounts.created_at) — это НЕ дата покупки:
      // купленный на маркете может пролежать неделю до импорта, а разбор «почему пачка
      // ведёт себя иначе» всегда упирается в вопрос «когда мы её залили».
      {key:"created_at",label:"Загружен",cls:"sub",render:r=>{
        if(!r.created_at)return '<span class="no">—</span>';
        const d=parseTs(r.created_at);
        if(!d)return `<span class="mono" style="font-size:11px">${esc(String(r.created_at).slice(0,10))}</span>`;
        const days=Math.floor((Date.now()-d.getTime())/86400000);
        const ago=days<=0?'сегодня':(days===1?'вчера':`${days} дн назад`);
        return `<span class="mono" style="font-size:11px;opacity:.75" title="дата загрузки аккаунта в AXIOM: ${esc(fmt(r.created_at))}">📥 ${d.toLocaleDateString("ru-RU")}</span>`
          +`<br><span style="font-size:11px;opacity:.6">${ago}</span>`;}},
      {key:"daily_limit",label:"Лимит/день",cls:"mono"},
      // Раньше тут было удаление насовсем. Купленный аккаунт — это деньги, сессия и
      // история переписок, и стереть его одним промахом мыши нельзя. Теперь кнопка
      // прячет аккаунт в архив: из списка пропал, в БД остался.
      {key:"id",label:"",render:r=>`<button class="acc-arch" data-id="${r.id}" title="В архив: пропадёт из списка, но аккаунт, сессия и переписки сохранятся. Вернуть — фильтром «🗄 Архив»">🗄</button>`},
    ],
    emptyText:"Аккаунтов нет — добавь первый формой выше",
  });
  // делегирование (переживает ре-рендер таблицы при поиске/сортировке)
  const tbl=$("#acc-tbl");
  tbl.addEventListener("click",async(e)=>{
    const arch=e.target.closest(".acc-arch");
    if(arch){e.stopPropagation();
      const id=arch.dataset.id;
      if(!confirm("Убрать аккаунт в архив?\n\nОн пропадёт из списка, но сам аккаунт, сессия и переписки сохранятся. Вернуть — фильтром «🗄 Архив»."))return;
      arch.disabled=true;
      let res=null;
      try{res=await api("/api/accounts/bulk",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ids:[+id],action:"status",status:"archived"})});}
      catch(err){res={error:String(err)};}
      if(!res||res.error){arch.disabled=false;alert((res&&res.error)||"не удалось убрать в архив");return;}
      // прячем строку на месте: route() перерисовал бы всю таблицу и сбросил прокрутку
      const row=a.find(x=>String(x.id)===String(id));if(row)row.status="archived";
      const i=aShown.findIndex(x=>String(x.id)===String(id));if(i>=0)aShown.splice(i,1);
      arch.closest("tr")?.remove();
      return;}
    const lg=e.target.closest(".acc-login");
    if(lg){e.stopPropagation();showLoginDialog(lg.dataset.id,lg.dataset.phone,lg.dataset.label);return;}
    const eye=e.target.closest(".acc-eye");
    if(eye){e.stopPropagation();showInspectModal(eye.dataset.id,eye.dataset.label);return;}
    const pfx=e.target.closest(".acc-proxyfix");
    if(pfx){e.stopPropagation();
      const old=pfx.innerHTML;
      pfx.disabled=true;
      pfx.innerHTML='<span class="badge b-nurture"><span class="sdot gy"></span>⏳ ищу…</span>';
      // до минуты: пул может быть пуст, тогда сервер перебирает публичные SOCKS5-списки
      let res=null;
      try{res=await api(`/api/account/${pfx.dataset.id}/proxy_renew`,{method:"POST"});}
      catch(err){res={error:String(err)};}
      if(res&&res.ok){
        // тоже без route(): правим строку в данных и подменяем только эту ячейку,
        // иначе перерисовка утащит прокрутку в начало таблицы
        const row=a.find(x=>String(x.id)===String(pfx.dataset.id));
        if(row){row.proxy=res.proxy;row.proxy_alive=1;row.proxy_checked_at=new Date().toISOString();}
        pfx.outerHTML=`<span class="badge b-active" title="проверено только что · ${esc(res.proxy||'')}"><span class="sdot g"></span>живой</span>`;
      }else{
        pfx.disabled=false;pfx.innerHTML=old;
        alert((res&&res.error)||"не удалось подобрать прокси");
      }
      return;}
    // Кнопка-одиночка: красим СРАЗУ (чтобы клик отзывался мгновенно), потом сохраняем;
    // не сохранилось — возвращаем как было и говорим почему.
    const tog=e.target.closest(".acc-notify")?TOG.notify:null;
    if(tog){e.stopPropagation();
      const btn=e.target.closest("."+tog.cls), id=btn.dataset.id;
      const prev=(a.find(x=>String(x.id)===String(id))||{})[tog.field];
      const wasId=(a.find(x=>x[tog.field])||{}).id ?? null;   // кто был назначен до клика
      togApply(tog,prev?null:id);
      let res=null;
      try{res=await api(tog.url,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({account_id:prev?null:id})});}
      catch(err){res={error:String(err)};}
      if(res&&res.error){togApply(tog,wasId);alert(res.error);}
      return;}
  });
  tbl.addEventListener("change",async(e)=>{
    const cb=e.target.closest(".acc-sel");
    if(cb){const id=+cb.dataset.id;if(cb.checked)selAcc.add(id);else selAcc.delete(id);updBulkCnt();return;}
    // «Слушает чаты»: набор, а не один избранник — правим строку и сохраняем весь список
    const lc=e.target.closest(".acc-listen");
    if(lc){
      const row=a.find(x=>String(x.id)===String(lc.dataset.id));
      if(!row)return;
      const was=!!row.is_listener;
      row.is_listener=lc.checked;
      const badge=lc.parentElement&&lc.parentElement.querySelector(".badge,.sub");
      if(badge)badge.outerHTML=lc.checked?'<span class="badge b-active">👂 слушает</span>':'<span class="sub">слушать</span>';
      if(!await saveListeners()){row.is_listener=was;lc.checked=was;}
    }
  });
  const bulk=async(body,okMsg)=>{
    if(!selAcc.size){$("#ab-msg").textContent="ничего не выбрано";return;}
    const r=await api("/api/accounts/bulk",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ids:[...selAcc],...body})});
    if(r.error){$("#ab-msg").innerHTML='<span style="color:#c0392b">'+esc(r.error)+'</span>';return;}
    $("#ab-msg").innerHTML='<span style="color:var(--green)">'+esc(okMsg(r))+'</span>';
    setTimeout(route,1200);
  };
  const syncSelDom=()=>{$("#acc-tbl").querySelectorAll(".acc-sel").forEach(cb=>cb.checked=selAcc.has(+cb.dataset.id));updBulkCnt();};
  $("#ab-selall").onclick=()=>{accFiltered.forEach(r=>selAcc.add(r.id));syncSelDom();$("#ab-msg").textContent=`выделено ${accFiltered.length} (отфильтрованных)`;};
  $("#ab-selnone").onclick=()=>{selAcc.clear();syncSelDom();$("#ab-msg").textContent="выделение снято";};
  $("#ab-selbattle").onclick=()=>{selAcc.clear();const battle=accFiltered.filter(r=>!r.protected);battle.forEach(r=>selAcc.add(r.id));syncSelDom();$("#ab-msg").textContent=`🪖 выделено боевых: ${battle.length} (родные не тронуты)`;};
  $("#ab-selnative").onclick=()=>{selAcc.clear();const native=accFiltered.filter(r=>r.protected);native.forEach(r=>selAcc.add(r.id));syncSelDom();$("#ab-msg").textContent=`🏠 выделено родных: ${native.length}`;};
  $("#ab-warm").onclick=()=>bulk({action:"warmup"},r=>`на прогрев: ${r.warming}${r.skipped_no_session&&r.skipped_no_session.length?` · без сессии: ${r.skipped_no_session.length}`:""}${r.skipped_protected?` · 🏠 родных пропущено: ${r.skipped_protected}`:""}`);
  $("#ab-check").onclick=()=>bulk({action:"check"},r=>`проверяю ${r.checking} — статус обновится через ~минуту`);
  $("#ab-sess-check").onclick=()=>bulk({action:"session_check"},r=>`🫀 проверяю живость ${r.queued} сессий в фоне (~минута)${r.skipped_no_session?` · без сессии пропущено: ${r.skipped_no_session}`:""} — колонка «Живость» обновится, обнови страницу`);
  $("#ab-invent").onclick=()=>bulk({action:"inventory"},r=>`инвентаризация ${r.queued} аккаунт(ов) — чаты появятся в каталоге через ~минуту`);
  $("#ab-identity").onclick=()=>{
    if(!selAcc.size){$("#ab-msg").textContent="ничего не выбрано";return;}
    showIdentityDialog([...selAcc],bulk);
  };
  $("#ab-native").onclick=()=>bulk({action:"protect",protected:1},r=>`помечено родными: ${r.updated} (автоматика их не трогает)`);
  $("#ab-unprotect").onclick=()=>bulk({action:"protect",protected:0},r=>`снят «родной» у ${r.updated}`);
  $("#ab-more").onclick=()=>{
    const panel=$("#ab-more-panel"),btn=$("#ab-more");
    const open=panel.style.display==="none";
    panel.style.display=open?"flex":"none";
    btn.setAttribute("aria-expanded",open?"true":"false");
    btn.textContent=open?"⋯ Свернуть":"⋯ Ещё действия";
  };
  $("#ab-archive").onclick=()=>bulk({action:"status",status:"archived"},r=>`🗄 в архив: ${r.updated}`);
  $("#ab-unarchive").onclick=()=>bulk({action:"status",status:"warming"},r=>`♻ возвращено из архива: ${r.updated}`);
  $("#ab-proxy").onclick=()=>{if(!selAcc.size){$("#ab-msg").textContent="ничего не выбрано";return;}showProxyDistDialog([...selAcc],bulk);};
  $("#ab-proxy-pool").onclick=()=>bulk({action:"proxy_pool_assign"},r=>`🆓 обновляю пул и раздаю бесплатный прокси ${r.queued} акк. в фоне (30-90с)${r.skipped_protected?` · 🏠 родных пропущено: ${r.skipped_protected}`:""} — колонка «Прокси» обновится, обнови страницу`);
  $("#ab-proxy-check").onclick=()=>bulk({action:"proxy_check"},r=>`🔎 проверяю прокси у ${r.queued} акк. в фоне (30-60с)${r.skipped_no_proxy?` · без прокси пропущено: ${r.skipped_no_proxy}`:""} — цвет в колонке «Прокси» обновится, обнови страницу`);
  $("#ab-proxy6").onclick=()=>{if(!selAcc.size){$("#ab-msg").textContent="ничего не выбрано";return;}showProxy6BuyDialog([...selAcc],bulk);};
  $("#ab-proxy6-check").onclick=async()=>{
    const b=$("#ab-proxy6-check");b.disabled=true;b.textContent="проверяю…";
    const r=await api("/api/proxy6/whoami");
    b.disabled=false;b.textContent="🔑 Проверить ключ Proxy6";
    $("#ab-msg").innerHTML=r.error
      ?'<span style="color:#c0392b">⚠ '+esc(r.error)+'</span>'
      :`<span style="color:var(--green)">✅ ключ рабочий — баланс ${esc(r.balance)} ${esc(r.currency)} (user_id ${esc(r.user_id)})</span>`;
  };
  // Регистрация нового номера НЕ требует выделенных строк — создаёт новые аккаунты.
  $("#ab-sms-reg").onclick=()=>showSmsRegisterDialog();
  $("#ab-protect").onclick=()=>{if(!selAcc.size){$("#ab-msg").textContent="ничего не выбрано";return;}showProtectDialog([...selAcc],bulk);};
  $("#ab-limit-go").onclick=()=>{const l=+$("#ab-limit").value;if(!l){$("#ab-msg").textContent="введи лимит";return;}bulk({action:"limit",daily_limit:l},r=>`✏️ лимит ${r.daily_limit} у ${r.updated}`);};
  $("#ab-status-go").onclick=()=>{const s=$("#ab-status").value;if(!s){$("#ab-msg").textContent="выбери статус";return;}bulk({action:"status",status:s},r=>`статус «${ACC_ST[r.status]||r.status}» у ${r.updated}`);};
}

function showLoginDialog(accId,phone,label){
  const modal=document.createElement("div");
  modal.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999";
  modal.innerHTML=`<div style="background:var(--bg);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.3);max-width:440px;width:92%;padding:20px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <b style="font-size:16px">🔌 Подключить аккаунт</b><button class="lg-close">✕</button></div>

// Список отделов для «подчиняется отделу». Исключаем сам отдел и всю его ветку —
// иначе можно выбрать собственный подотдел и оторвать кусок дерева от корня.
function orgParentOpts(depts,selId,excludeId){
  let banned=new Set();
  if(excludeId){
    banned.add(+excludeId);
    const kids={};depts.forEach(d=>{(kids[d.parent_id||0]=kids[d.parent_id||0]||[]).push(d.id);});
    const stack=[...(kids[+excludeId]||[])];
    while(stack.length){const x=stack.pop();if(banned.has(x))continue;banned.add(x);stack.push(...(kids[x]||[]));}
  }
  return `<option value="">— без родителя (верхний уровень) —</option>`+
    depts.filter(d=>!banned.has(d.id)).map(d=>`<option value="${d.id}" ${String(selId)===String(d.id)?"selected":""}>${esc(d.name)}</option>`).join("");
}

// ═══ Схема оргструктуры: дерево, зум, поиск, перетаскивание ═══════════════
// Дерево строится рекурсивно, линии рисует CSS (.obranch::before/::after), поэтому
// связь «родитель → дети» всегда геометрически верна независимо от числа веток.

function orgAvaColor(s){                       // стабильный цвет аватара по имени
  let h=0;for(let i=0;i<String(s).length;i++)h=(h*31+String(s).charCodeAt(i))>>>0;
  return ORG_COLORS[h%ORG_COLORS.length];
}
function orgInitials(n){
  const p=String(n||"?").trim().split(/\s+/);
  return ((p[0]||"?")[0]+(p[1]?p[1][0]:"")).toUpperCase();
}
function orgDeptColor(d){return d.color||ORG_COLORS[(d.id*3)%ORG_COLORS.length];}
function orgAccDot(m){                          // состояние аккаунта-исполнителя
  if(!m.account_id)return null;
  return m.account_alive===1?"g":(m.account_alive===0?"r":"y");
}
function orgMemberLabel(m){return m.name||m.role||"без имени";}
function orgMemberSub(m){
  return [m.role,m.kind==="agent"?(AI_TASKS[m.task||m.agent_task]||m.task):null]
    .filter(Boolean).join(" · ")||(m.kind==="agent"?"ИИ-роль":"сотрудник");
}
function orgAccName(m){
  return m.account_id?(m.account_label||m.account_username||("#"+m.account_id)):"аккаунт не назначен";
}
// Строка поиска по сотруднику/отделу — всё, по чему можно найти
function orgMemberSearchStr(m){
  return [m.name,m.role,m.task,AI_TASKS[m.task||m.agent_task],m.account_label,m.account_username,m.phone,m.email]
    .filter(Boolean).join(" ").toLowerCase();
}

// Раскладываем плоский список отделов в дерево и считаем агрегаты по веткам.
// Сироты (parent_id указывает на несуществующий/зациклённый отдел) поднимаются
// в корень — иначе они бы просто исчезли со схемы.
function orgBuildTree(depts){
  const byId={};depts.forEach(d=>{byId[d.id]=d;d._kids=[];});
  const roots=[];
  depts.forEach(d=>{
    const p=d.parent_id&&byId[d.parent_id]&&d.parent_id!==d.id?byId[d.parent_id]:null;
    (p?p._kids:roots).push(d);
  });
  const seen=new Set();
  const calc=d=>{
    if(seen.has(d.id)){d._kids=[];return {h:0,a:0,sub:0};}   // страховка от цикла
    seen.add(d.id);
    const ms=d.members||[];
    d._ownH=ms.filter(m=>m.kind!=="agent").length;
    d._ownA=ms.filter(m=>m.kind==="agent").length;
    let h=d._ownH,a=d._ownA,sub=0;
    d._kids.forEach(k=>{const r=calc(k);h+=r.h;a+=r.a;sub+=1+r.sub;});
    d._h=h;d._a=a;d._sub=sub;
    return {h,a,sub};
  };
  roots.forEach(calc);
  // Отделы, до которых не дошли (замкнутый цикл) — вытаскиваем в корень
  depts.forEach(d=>{if(!seen.has(d.id)){d._kids=[];calc(d);roots.push(d);}});
  return {byId,roots};
}
function orgDescendants(d){
  const out=new Set(),stack=[...(d._kids||[])];
  while(stack.length){const x=stack.pop();if(out.has(x.id))continue;out.add(x.id);stack.push(...(x._kids||[]));}
  return out;
}

// ── карточка сотрудника внутри отдела ──
function orgMemberHtml(m,isHead){
  const ai=m.kind==="agent";
  const nm=orgMemberLabel(m), dot=orgAccDot(m);
  const ava=ai
    ? `<div class="oava ai" style="background:linear-gradient(135deg,var(--accent),var(--purple))">🤖${dot?`<i class="olive ${dot}"></i>`:""}</div>`
    : `<div class="oava" style="background:${orgAvaColor(nm)}">${esc(orgInitials(nm))}${dot?`<i class="olive ${dot}"></i>`:""}</div>`;
  const tip=`${nm}${m.role?" · "+m.role:""}\n🔑 ${orgAccName(m)}${m.phone?"\n📞 "+m.phone:""}`;
  return `<div class="omember ${isHead?"head":""}" draggable="true" data-mid="${m.id}"
      data-s="${esc(orgMemberSearchStr(m))}" title="${esc(tip)}">
    ${ava}
    <div class="ominfo">
      <div class="omname">${esc(nm)}${isHead?'<span class="omcrown" title="руководитель отдела">👑</span>':""}${m.needs_access?'<span class="omkey" title="нужен доступ в пульт">🔑</span>':""}</div>
      <div class="omrole">${esc(orgMemberSub(m))}</div>
    </div>
  </div>`;
}

// ── ветка дерева: карточка отдела + рекурсивно дети ──
function orgBranchHtml(d){
  const kids=d._kids||[];
  const collapsed=kids.length&&ORG_COLLAPSED.has(d.id);
  const color=orgDeptColor(d);
  // Руководитель всегда первым — как в структуре компании Битрикс24
  const ms=(d.members||[]).slice().sort((a,b)=>
    (b.id===d.head_member_id)-(a.id===d.head_member_id));
  const counts=[
    d._ownH?`<span class="hum" title="живых людей в отделе">👤 ${d._ownH}</span>`:"",
    d._ownA?`<span class="ai" title="ИИ-ролей в отделе">🤖 ${d._ownA}</span>`:"",
    d._sub?`<span class="br" title="подотделов в ветке · всего людей и ИИ ниже">🌿 ${d._sub} · ${d._h+d._a}</span>`:"",
  ].filter(Boolean).join("");
  return `<div class="obranch ${collapsed?"collapsed":""}" data-branch="${d.id}">
    <div class="ocardwrap">
      <div class="odept ${kids.length?"haskids":""}" style="--dc:${esc(color)}" data-dept="${d.id}"
           data-s="${esc(((d.name||"")+" "+(d.description||"")).toLowerCase())}">
        <div class="odept-hd" draggable="true" data-dept="${d.id}" title="перетащи, чтобы переподчинить отдел">
          <div class="dname"><span class="dico">🏛</span><span>${esc(d.name)}</span></div>
          ${d.description?`<div class="dsub">${esc(d.description)}</div>`:""}
          ${counts?`<div class="ocount">${counts}</div>`:""}
          <button class="dmenu" data-dept="${d.id}" title="действия с отделом">⋯</button>
        </div>
        <div class="omembers" data-dept="${d.id}">
          ${ms.map(m=>orgMemberHtml(m,m.id===d.head_member_id)).join("")}
          ${ms.length?"":'<div class="omempty">пусто — перетащи сюда сотрудника</div>'}
          <button class="oadd" data-dept="${d.id}">＋ должность</button>
        </div>
      </div>
      ${kids.length?`<button class="ocollapse" data-dept="${d.id}"><span class="chev">▼</span>${kids.length}</button>`:""}
    </div>
    ${kids.length?`<div class="okids">${kids.map(orgBranchHtml).join("")}</div>`:""}
  </div>`;
}

// ── компактный режим «Иерархия»: список с отступами ──
function orgListHtml(nodes,depth){
  return nodes.map(d=>{
    const col=ORG_COLLAPSED.has(d.id);
    const ms=(d.members||[]).slice().sort((a,b)=>(b.id===d.head_member_id)-(a.id===d.head_member_id));
    const kids=d._kids||[];
    const rows=col?"":ms.map(m=>`<div class="olrow mem" data-mid="${m.id}" data-s="${esc(orgMemberSearchStr(m))}"
        style="padding-left:${18+depth*20+22}px">
        <span>${m.kind==="agent"?"🤖":"👤"}</span>
        <span class="olname">${esc(orgMemberLabel(m))}${m.id===d.head_member_id?" 👑":""}
          <span class="olsub">${esc(orgMemberSub(m))} · ${esc(orgAccName(m))}</span></span>
        <span class="olacts"><button class="ol-medit" data-mid="${m.id}">✏️</button><button class="ol-mdel" data-mid="${m.id}">🗑</button></span>
      </div>`).join("");
    return `<div class="olrow dept ${col?"col":""}" data-dept="${d.id}"
        data-s="${esc(((d.name||"")+" "+(d.description||"")).toLowerCase())}" style="padding-left:${12+depth*20}px">
        <span class="olchev">${kids.length||ms.length?"▼":"·"}</span>
        <i class="obar" style="background:${esc(orgDeptColor(d))}"></i>
        <span class="olname">${esc(d.name)} <span class="olsub">${d.description?esc(d.description)+" · ":""}👤${d._ownH} 🤖${d._ownA}</span></span>
        <span class="olacts">
          <button class="ol-add" data-dept="${d.id}" title="добавить должность">＋</button>
          <button class="ol-sub" data-dept="${d.id}" title="добавить подотдел">📂</button>
          <button class="ol-edit" data-dept="${d.id}" title="настроить">✏️</button>
          <button class="ol-del" data-dept="${d.id}" title="удалить">🗑</button>
        </span>
      </div>${rows}${col?"":orgListHtml(kids,depth+1)}`;
  }).join("");
}

// ── всплывающее меню отдела ──
function orgCloseMenu(){const m=document.querySelector(".omenu");if(m)m.remove();}
function orgDeptMenu(x,y,d,depts,onDone){
  orgCloseMenu();
  const el=document.createElement("div");el.className="omenu";
  el.innerHTML=`
    <button data-a="edit">⚙️ Настроить отдел</button>
    <button data-a="member">➕ Добавить должность</button>
    <button data-a="sub">📂 Добавить подотдел</button>
    <hr>
    <div class="swatches">${ORG_COLORS.map(c=>`<i data-c="${c}" style="background:${c}" class="${orgDeptColor(d)===c?"on":""}"></i>`).join("")}</div>
    <hr>
    ${d.parent_id?'<button data-a="unparent">⬆️ Поднять на верхний уровень</button>':""}
    <button data-a="del" class="dang">🗑 Удалить отдел</button>`;
  document.body.appendChild(el);
  const r=el.getBoundingClientRect();
  el.style.left=Math.min(x,innerWidth-r.width-10)+"px";
  el.style.top=Math.min(y,innerHeight-r.height-10)+"px";
  const close=()=>{orgCloseMenu();document.removeEventListener("mousedown",out);};
  const out=e=>{if(!el.contains(e.target))close();};
  setTimeout(()=>document.addEventListener("mousedown",out),0);
  el.querySelectorAll("[data-c]").forEach(i=>i.onclick=async()=>{
    close();
    await api("/api/org/department",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id:d.id,name:d.name,description:d.description,parent_id:d.parent_id,
        head_member_id:d.head_member_id,color:i.dataset.c})});
    onDone();
  });
  el.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{
    const a=b.dataset.a;close();
    if(a==="edit")orgDeptModal(d,depts,null,onDone);
    else if(a==="member")orgMemberModal(d.id,null,onDone);
    else if(a==="sub")orgDeptModal(null,depts,d.id,onDone);
    else if(a==="unparent"){
      const r2=await api(`/api/org/department/${d.id}/move`,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({parent_id:null})});
      if(r2.error)alert(r2.error);onDone();
    }
    else if(a==="del")orgDeleteDept(d,depts,onDone);
  });
}

    <div class="field"><label>Название</label><input id="od-name" value="${esc(cur.name||"")}" placeholder="Продажи Сочи"></div>
    <div class="field"><label>Зона ответственности</label><input id="od-desc" value="${esc(cur.description||"")}" placeholder="Прогрев и рассылка по агентствам"></div>
    <div class="field"><label>Подчиняется отделу</label><select id="od-parent">${orgParentOpts(depts,parentPreset||cur.parent_id,cur.id)}</select></div>

        <option value="">— не назначен —</option>
        ${members.map(m=>`<option value="${m.id}" ${String(cur.head_member_id)===String(m.id)?"selected":""}>${esc(orgMemberLabel(m))}${m.role?" · "+esc(m.role):""}</option>`).join("")}
      </select></div>`:""}
    <div class="field"><label>Цвет ветки</label><div class="swatches" id="od-colors" style="display:flex;gap:7px;flex-wrap:wrap">
      ${ORG_COLORS.map(c=>`<i data-c="${c}" style="width:26px;height:26px;border-radius:8px;cursor:pointer;background:${c};border:2px solid ${color===c?"var(--text)":"transparent"}"></i>`).join("")}
    </div></div>
    <div class="ttoolbar" style="margin-top:14px"><button class="primary" id="od-save">💾 ${isNew?"Создать":"Сохранить"}</button>
      <button id="od-cancel">отмена</button><span class="hint" id="od-msg"></span></div>`;
  wrap.appendChild(inner);document.body.appendChild(wrap);
  const closeM=()=>wrap.remove();
  wrap.onclick=e=>{if(e.target===wrap)closeM();};
  inner.querySelector("#od-cancel").onclick=closeM;
  inner.querySelectorAll("#od-colors i").forEach(i=>i.onclick=()=>{
    color=i.dataset.c;
    inner.querySelectorAll("#od-colors i").forEach(j=>j.style.borderColor=j.dataset.c===color?"var(--text)":"transparent");
  });
  inner.querySelector("#od-save").onclick=async()=>{
    const name=inner.querySelector("#od-name").value.trim();
    const msg=inner.querySelector("#od-msg");
    if(!name){msg.textContent="нужно название";return;}
    const headSel=inner.querySelector("#od-head");
    const r=await api("/api/org/department",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id:cur.id||null,name,description:inner.querySelector("#od-desc").value,
        parent_id:inner.querySelector("#od-parent").value||null,color:color||null,
        head_member_id:headSel?(headSel.value||null):(cur.head_member_id||null)})});

function orgMemberModal(deptId,member,onDone){

    +orgMemberFormHtml(deptId,member);

// ── удаление отдела: если он не пуст — спрашиваем, куда переселить людей ──
async function orgDeleteDept(d,depts,onDone){
  const post=body=>api(`/api/org/department/${d.id}/delete`,{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});
  let r=await post();
  if(r.ok){onDone();return;}
  if(!r.need_move){alert(r.error||"не удалось удалить отдел");return;}
  const others=depts.filter(x=>x.id!==d.id);
  if(!others.length){alert("Некуда переносить сотрудников — сначала создай другой отдел.");return;}
  const wrap=document.createElement("div");wrap.className="org-mform-wrap";
  const inner=document.createElement("div");inner.className="org-mform-inner";
  inner.innerHTML=`<div style="font-weight:800;font-size:15px;margin-bottom:10px">🗑 Удалить «${esc(d.name)}»</div>
    <div class="hint" style="margin-bottom:12px">В отделе ${r.members||0} сотрудник(ов) и ${r.children||0} подотдел(ов).
      Сотрудники переедут в выбранный отдел, подотделы поднимутся на уровень выше — никто не потеряется.</div>
    <div class="field"><label>Перенести сотрудников в</label><select id="odm-to">
      ${others.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div>
    <div class="ttoolbar" style="margin-top:12px"><button class="primary" id="odm-go">Перенести и удалить</button>
      <button id="odm-cancel">отмена</button><span class="hint" id="odm-msg"></span></div>`;
  wrap.appendChild(inner);document.body.appendChild(wrap);
  wrap.onclick=e=>{if(e.target===wrap)wrap.remove();};
  inner.querySelector("#odm-cancel").onclick=()=>wrap.remove();
  inner.querySelector("#odm-go").onclick=async()=>{
    const r2=await post({move_to:+inner.querySelector("#odm-to").value});
    if(r2.error){inner.querySelector("#odm-msg").textContent=r2.error;return;}
    wrap.remove();onDone();
  };
}

// ── зум ──
function orgSetZoom(z,byUser){
  ORG_ZOOM=Math.max(.4,Math.min(1.6,Math.round(z*100)/100));
  const st=$("#org-stage");if(st)st.style.setProperty("--oz",ORG_ZOOM);
  const l=$("#oz-level");if(l)l.textContent=Math.round(ORG_ZOOM*100)+"%";
  if(byUser){ORG_ZOOM_SET=true;orgSaveState();}
}
// Прокрутить канвас так, чтобы дерево оказалось по центру — иначе широкая схема
// открывается прижатой к левому краю и корень «уезжает» из поля зрения.
function orgCenter(){
  const c=$("#org-canvas");if(!c)return;
  c.scrollLeft=Math.max(0,(c.scrollWidth-c.clientWidth)/2);
}
// «По размеру»: подобрать масштаб так, чтобы дерево целиком влезло по ширине
function orgFit(byUser){
  const c=$("#org-canvas"), tree=c&&c.querySelector(".otree");
  if(!tree)return;
  const w=tree.offsetWidth+72;                     // +поля канваса
  orgSetZoom(w>0?Math.min(1,c.clientWidth/w):1,byUser);
  requestAnimationFrame(orgCenter);
}
// Склонение по числу: 1 отдел / 2 отдела / 5 отделов
function plural(n,one,few,many){
  const m=Math.abs(n)%100, k=m%10;
  return (m>=11&&m<=14)?many:(k===1?one:(k>=2&&k<=4?few:many));
}

// ═══ основной рендер ═══
async function renderOrgChart(body,compact){
  const [data,unlinked]=await Promise.all([api("/api/org/tree"),api("/api/org/unlinked-accounts")]);
  const depts=data.departments||[];
  const {roots}=orgBuildTree(depts);
  const redraw=()=>renderOrgBody();

  const totH=depts.reduce((s,d)=>s+(d._ownH||0),0);
  const totA=depts.reduce((s,d)=>s+(d._ownA||0),0);
  const noAcc=depts.reduce((s,d)=>s+(d.members||[]).filter(m=>!m.account_id).length,0);
  const parentIds=depts.filter(d=>(d._kids||[]).length).map(d=>d.id);
  const allCollapsed=parentIds.length>0&&parentIds.every(id=>ORG_COLLAPSED.has(id));

  body.innerHTML=`
    <div class="orgbar">
      <button class="primary" id="org-add-dept">➕ Отдел</button>
      ${compact?"":`<div class="ozoom">
        <button id="oz-out" title="отдалить (или Ctrl+колесо)">−</button>
        <span class="olevel" id="oz-level" title="сбросить масштаб к 100%">${Math.round(ORG_ZOOM*100)}%</span>
        <button id="oz-in" title="приблизить (или Ctrl+колесо)">+</button>
        <button id="oz-fit" title="вместить схему целиком">⤢</button>
      </div>`}
      <button id="org-toggle-all" title="свернуть/развернуть все ветки">${allCollapsed?"⌄ Развернуть":"⌃ Свернуть"} ветки</button>
      <div class="osearch"><input id="org-q" placeholder="Найти человека или отдел…" value="${esc(ORG_Q)}"></div>
      <span class="grow"></span>
      <span class="orgstat">
        <span>🏛 <b>${depts.length}</b> ${plural(depts.length,"отдел","отдела","отделов")}</span>
        <span>👤 <b>${totH}</b> ${plural(totH,"живой","живых","живых")}</span>
        <span>🤖 <b>${totA}</b> ИИ</span>
        ${noAcc?`<span title="должности без аккаунта-исполнителя">🔑 <b>${noAcc}</b> без аккаунта</span>`:""}
      </span>
    </div>
    <div id="org-mount"></div>
    <div id="org-pool-mount"></div>`;

  const mount=$("#org-mount");
  if(!depts.length){
    mount.innerHTML=`<div class="empty" style="padding:38px 20px;text-align:center">
      <div style="font-size:34px;margin-bottom:8px">🏛</div>
      <div style="font-weight:700;margin-bottom:4px">Структуры пока нет</div>
      <div class="hint" style="margin-bottom:14px">Создай первый отдел — дальше можно добавлять должности,
        назначать аккаунты и перетаскивать людей между отделами мышкой.</div>
      <button class="primary" id="org-first">➕ Создать первый отдел</button></div>`;
    $("#org-first").onclick=()=>orgDeptModal(null,depts,null,redraw);
  }else if(compact){
    mount.innerHTML=`<div class="olist">${orgListHtml(roots,0)}</div>`;
    wireOrgList(mount,depts,redraw);
  }else{
    mount.innerHTML=`<div class="orgcanvas" id="org-canvas"><div class="orgstage" id="org-stage" style="--oz:${ORG_ZOOM}">
      <div class="otree"><div class="obranch">
        <div class="ocardwrap"><div class="oroot" id="org-root" title="нажми, чтобы переименовать">
          <div class="rname">🏢 ${esc(ORG_ROOT_NAME)}</div>
          <div class="rsub">${roots.length} ${plural(roots.length,"направление","направления","направлений")} · ${totH+totA} в команде</div>
        </div></div>
        <div class="okids">${roots.map(orgBranchHtml).join("")}</div>
      </div></div>
    </div></div>`;
    wireOrgChartTree(mount,depts,redraw);
  }

  $("#org-add-dept").onclick=()=>orgDeptModal(null,depts,null,redraw);
  const tog=$("#org-toggle-all");
  if(tog)tog.onclick=()=>{
    if(allCollapsed)parentIds.forEach(id=>ORG_COLLAPSED.delete(id));
    else parentIds.forEach(id=>ORG_COLLAPSED.add(id));
    orgSaveState();redraw();
  };
  const q=$("#org-q");
  if(q){
    q.oninput=()=>{ORG_Q=q.value;orgApplySearch(mount);};
    if(ORG_Q)orgApplySearch(mount);
  }
  if(!compact&&depts.length){
    $("#oz-in").onclick=()=>orgSetZoom(ORG_ZOOM+.1,true);

    requestAnimationFrame(()=>{ORG_ZOOM_SET?orgCenter():orgFit(false);});

// Поиск: совпавшие подсвечиваем, остальные отделы гасим. Пока идёт поиск —
// все ветки временно раскрыты, иначе найденное могло бы остаться в свёрнутом.
function orgApplySearch(mount){
  const q=ORG_Q.trim().toLowerCase();
  mount.querySelectorAll(".odept,.omember,.olrow").forEach(el=>el.classList.remove("hitmatch","dim"));
  mount.querySelectorAll(".obranch").forEach(b=>b.classList.toggle("collapsed",
    !q&&ORG_COLLAPSED.has(+b.dataset.branch)));
  if(!q)return;
  mount.querySelectorAll(".omember,.olrow.mem").forEach(el=>{
    if((el.dataset.s||"").includes(q))el.classList.add("hitmatch");
  });
  mount.querySelectorAll(".odept").forEach(c=>{
    const self=(c.dataset.s||"").includes(q);
    if(self)c.classList.add("hitmatch");
    if(!self&&!c.querySelector(".omember.hitmatch"))c.classList.add("dim");
  });
  mount.querySelectorAll(".olrow.dept").forEach(c=>{
    if((c.dataset.s||"").includes(q))c.classList.add("hitmatch");
  });
}

// ── обвязка схемы: клики, меню, сворачивание, зум колесом, pan, drag&drop ──
let ORG_DRAG=null;   // {type:'dept'|'member'|'acc', id}
function wireOrgChartTree(mount,depts,redraw){
  const byId={};depts.forEach(d=>byId[d.id]=d);
  const canvas=$("#org-canvas");

  $("#org-root").onclick=()=>{
    const n=prompt("Название компании на схеме:",ORG_ROOT_NAME);
    if(n===null)return;
    ORG_ROOT_NAME=n.trim()||"Компания";orgSaveState();redraw();
  };
  mount.querySelectorAll(".ocollapse").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const id=+b.dataset.dept;
    ORG_COLLAPSED.has(id)?ORG_COLLAPSED.delete(id):ORG_COLLAPSED.add(id);
    orgSaveState();
    const br=mount.querySelector(`.obranch[data-branch="${id}"]`);
    if(br)br.classList.toggle("collapsed",ORG_COLLAPSED.has(id));
  });
  mount.querySelectorAll(".dmenu").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const r=b.getBoundingClientRect();
    orgDeptMenu(r.left,r.bottom+4,byId[+b.dataset.dept],depts,redraw);
  });
  mount.querySelectorAll(".oadd").forEach(b=>b.onclick=e=>{
    e.stopPropagation();orgMemberModal(+b.dataset.dept,null,redraw);
  });
  mount.querySelectorAll(".omember").forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const mid=+el.dataset.mid;
    let mem=null,dept=null;
    depts.forEach(d=>(d.members||[]).forEach(m=>{if(m.id===mid){mem=m;dept=d;}}));
    if(mem)orgMemberModal(dept.id,mem,redraw);
  });
  // двойной клик по шапке отдела — быстрая настройка
  mount.querySelectorAll(".odept-hd").forEach(el=>el.ondblclick=e=>{
    e.stopPropagation();orgDeptModal(byId[+el.dataset.dept],depts,null,redraw);
  });

  // зум колесом с Ctrl (как в редакторах схем)
  canvas.addEventListener("wheel",e=>{
    if(!e.ctrlKey)return;
    e.preventDefault();orgSetZoom(ORG_ZOOM+(e.deltaY<0?.1:-.1),true);
  },{passive:false});

  // pan: тянем пустое место канваса
  let pan=null;
  canvas.addEventListener("mousedown",e=>{
    if(e.button!==0)return;
    if(e.target.closest(".odept,.oroot,.ocollapse"))return;
    pan={x:e.clientX,y:e.clientY,l:canvas.scrollLeft,t:canvas.scrollTop};
    canvas.classList.add("panning");
  });
  addEventListener("mousemove",e=>{
    if(!pan)return;
    canvas.scrollLeft=pan.l-(e.clientX-pan.x);
    canvas.scrollTop=pan.t-(e.clientY-pan.y);
  });
  addEventListener("mouseup",()=>{if(pan){pan=null;canvas.classList.remove("panning");}});

  // ── перетаскивание ──
  mount.querySelectorAll(".odept-hd[draggable]").forEach(hd=>{
    hd.ondragstart=e=>{
      ORG_DRAG={type:"dept",id:+hd.dataset.dept};
      e.dataTransfer.effectAllowed="move";
      try{e.dataTransfer.setData("text/plain","dept:"+hd.dataset.dept);}catch(_){}
      hd.closest(".odept").classList.add("dragging");
      e.stopPropagation();
    };
    hd.ondragend=()=>{
      ORG_DRAG=null;
      mount.querySelectorAll(".dragging").forEach(x=>x.classList.remove("dragging"));
      mount.querySelectorAll(".dropinto").forEach(x=>x.classList.remove("dropinto"));
      mount.querySelectorAll(".dropzone").forEach(x=>x.classList.remove("dropzone"));
    };
  });
  mount.querySelectorAll(".omember[draggable]").forEach(el=>{
    el.ondragstart=e=>{
      ORG_DRAG={type:"member",id:+el.dataset.mid};
      e.dataTransfer.effectAllowed="move";
      try{e.dataTransfer.setData("text/plain","member:"+el.dataset.mid);}catch(_){}
      el.classList.add("dragging");e.stopPropagation();
    };
    el.ondragend=()=>{
      ORG_DRAG=null;
      mount.querySelectorAll(".dragging").forEach(x=>x.classList.remove("dragging"));
      mount.querySelectorAll(".dropzone").forEach(x=>x.classList.remove("dropzone"));
      mount.querySelectorAll(".dropinto").forEach(x=>x.classList.remove("dropinto"));
    };
  });

  // Куда можно бросить отдел: в шапку другого отдела (стать подотделом) или в корень.
  // drag передаём явно — на ondrop мы уже обнулили ORG_DRAG, и проверка по глобальной
  // переменной всегда возвращала бы false (перенос молча отменялся).
  const canDropDept=(targetId,drag)=>{
    drag=drag||ORG_DRAG;
    if(!drag||drag.type!=="dept")return false;
    if(targetId===drag.id)return false;
    const src=byId[drag.id];
    return !(src&&orgDescendants(src).has(targetId));
  };
  mount.querySelectorAll(".odept-hd").forEach(hd=>{
    const did=+hd.dataset.dept, card=hd.closest(".odept");
    hd.ondragover=e=>{
      if(canDropDept(did)||(ORG_DRAG&&ORG_DRAG.type!=="dept")){e.preventDefault();card.classList.add("dropinto");}
    };
    hd.ondragleave=()=>card.classList.remove("dropinto");
    hd.ondrop=async e=>{
      e.preventDefault();e.stopPropagation();card.classList.remove("dropinto");
      if(!ORG_DRAG)return;
      const drag=ORG_DRAG;ORG_DRAG=null;
      if(drag.type==="dept"){
        if(!canDropDept(did,drag))return;
        const r=await api(`/api/org/department/${drag.id}/move`,{method:"POST",
          headers:{"Content-Type":"application/json"},body:JSON.stringify({parent_id:did})});
        if(r.error)alert(r.error);
      }else if(drag.type==="member"){
        const r=await api(`/api/org/member/${drag.id}/move`,{method:"POST",
          headers:{"Content-Type":"application/json"},body:JSON.stringify({department_id:did})});
        if(r.error)alert(r.error);
      }else if(drag.type==="acc"){
        orgMemberModal(did,{account_id:drag.id,kind:"agent"},redraw);return;
      }
      redraw();
    };
  });
  const rootCard=$("#org-root");
  rootCard.ondragover=e=>{if(ORG_DRAG&&ORG_DRAG.type==="dept"&&byId[ORG_DRAG.id].parent_id){e.preventDefault();rootCard.classList.add("dropinto");}};
  rootCard.ondragleave=()=>rootCard.classList.remove("dropinto");
  rootCard.ondrop=async e=>{
    e.preventDefault();rootCard.classList.remove("dropinto");
    if(!ORG_DRAG||ORG_DRAG.type!=="dept")return;
    const id=ORG_DRAG.id;ORG_DRAG=null;
    const r=await api(`/api/org/department/${id}/move`,{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({parent_id:null})});
    if(r.error)alert(r.error);
    redraw();
  };

  // зона сотрудников: приём людей (с позицией) и аккаунтов из пула
  mount.querySelectorAll(".omembers").forEach(zone=>{
    const did=+zone.dataset.dept;
    zone.ondragover=e=>{
      if(!ORG_DRAG||ORG_DRAG.type==="dept")return;
      e.preventDefault();zone.classList.add("dropzone");
    };
    zone.ondragleave=()=>zone.classList.remove("dropzone");
    zone.ondrop=async e=>{
      e.preventDefault();e.stopPropagation();zone.classList.remove("dropzone");
      if(!ORG_DRAG||ORG_DRAG.type==="dept")return;
      const drag=ORG_DRAG;ORG_DRAG=null;
      if(drag.type==="acc"){orgMemberModal(did,{account_id:drag.id,kind:"agent"},redraw);return;}
      // позиция внутри отдела — по месту курсора
      const rows=[...zone.querySelectorAll(".omember")].filter(r=>+r.dataset.mid!==drag.id);
      let idx=rows.length;
      for(let i=0;i<rows.length;i++){
        const b=rows[i].getBoundingClientRect();
        if(e.clientY<b.top+b.height/2){idx=i;break;}
      }
      const r=await api(`/api/org/member/${drag.id}/move`,{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify({department_id:did,index:idx})});
      if(r.error)alert(r.error);
      redraw();
    };
  });
}

function wireOrgList(mount,depts,redraw){

  mount.querySelectorAll(".olrow.dept").forEach(row=>{
    row.onclick=e=>{
      if(e.target.closest(".olacts"))return;
      const id=+row.dataset.dept;
      ORG_COLLAPSED.has(id)?ORG_COLLAPSED.delete(id):ORG_COLLAPSED.add(id);
      orgSaveState();redraw();
    };
  });
  mount.querySelectorAll(".ol-add").forEach(b=>b.onclick=e=>{e.stopPropagation();orgMemberModal(+b.dataset.dept,null,redraw);});
  mount.querySelectorAll(".ol-sub").forEach(b=>b.onclick=e=>{e.stopPropagation();orgDeptModal(null,depts,+b.dataset.dept,redraw);});
  mount.querySelectorAll(".ol-edit").forEach(b=>b.onclick=e=>{e.stopPropagation();orgDeptModal(byId[+b.dataset.dept],depts,null,redraw);});
  mount.querySelectorAll(".ol-del").forEach(b=>b.onclick=e=>{e.stopPropagation();orgDeleteDept(byId[+b.dataset.dept],depts,redraw);});
  mount.querySelectorAll(".ol-medit").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const mid=+b.dataset.mid;let mem=null,dept=null;

  mount.querySelectorAll(".ol-mdel").forEach(b=>b.onclick=async e=>{

  });

// ── пул непривязанных аккаунтов: чипсы можно тащить прямо в отдел ──
function renderOrgPool(poolMount,unlinked,depts,redraw){
  if(!poolMount)return;
  if(!unlinked||!unlinked.length){poolMount.innerHTML="";return;}
  const dot=a=>`<span class="odot ${a.session_alive===1?"green":(a.session_alive===0?"red":"yellow")}"></span>`;
  const label=a=>esc(a.label||a.username||a.phone||("#"+a.id));
  poolMount.innerHTML=`<div class="org-pool">
    <div class="org-pool-title">📦 Свободные аккаунты <span class="hint" style="font-weight:400">— ${unlinked.length} шт.</span></div>
    <div class="hint">Аккаунты из «Ресурсов», не назначенные ни на одну должность.
      Перетащи чипс в отдел на схеме (или просто кликни) — создастся должность с этим исполнителем.</div>
    <div class="org-pool-grid">${unlinked.map(a=>`<span class="org-pool-chip" draggable="true" data-accid="${a.id}">${dot(a)} ${label(a)}${a.phone?" · "+esc(a.phone):""}</span>`).join("")}</div>
  </div>`;
  poolMount.querySelectorAll(".org-pool-chip").forEach(chip=>{
    const accId=+chip.dataset.accid;
    chip.ondragstart=e=>{
      ORG_DRAG={type:"acc",id:accId};
      e.dataTransfer.effectAllowed="copy";
      try{e.dataTransfer.setData("text/plain","acc:"+accId);}catch(_){}
      chip.classList.add("dragging");
    };
    chip.ondragend=()=>{ORG_DRAG=null;chip.classList.remove("dragging");};
    chip.onclick=()=>{
      if(!depts.length){alert("Сначала создай отдел — должности живут внутри отделов.");return;}
      orgMemberModal(depts[0].id,{account_id:accId,kind:"agent"},redraw);
    };
  });
}

// Редактор этапов воронки, как в Битрикс24: список стадий, перетаскивание за ⠿,
// добавление и удаление. Раньше этапы задавались только при создании воронки —
// переименовать или добавить шаг было нельзя, приходилось заводить заново.
function openPipelineEditor(p){
  const wrap=document.createElement("div");wrap.className="org-mform-wrap";
  wrap.innerHTML='<div class="org-mform-inner" style="max-width:520px">…</div>';
  document.body.appendChild(wrap);
  const close=()=>wrap.remove();
  wrap.onclick=e=>{if(e.target===wrap)close();};
  document.addEventListener("keydown",function esc5(e){
    if(e.key==="Escape"){close();document.removeEventListener("keydown",esc5);}});
  let stages=(p.stages||[]).map(s=>({...s}));   // копия — правим локально, шлём разом
  const inner=wrap.querySelector(".org-mform-inner");
  const draw=()=>{
    inner.innerHTML=`
      <div style="font-weight:700;font-size:15px;margin-bottom:10px">⚙ Этапы воронки</div>
      <input id="pe-name" value="${esc(p.name||"")}" style="width:100%;margin-bottom:12px;font-weight:600" placeholder="Название воронки">
      <div class="hint" style="margin-bottom:8px">Перетаскивай ⠿ для порядка. Ключ — служебное имя стадии, латиницей, менять не обязательно.</div>
      <div id="pe-list"></div>
      <button type="button" id="pe-add" style="margin-top:8px">+ добавить этап</button>
      <div class="ttoolbar" style="margin-top:16px">
        <button class="primary" id="pe-save">Сохранить</button>
        <button type="button" id="pe-cancel">Отмена</button>
        ${p.is_default?"":'<span class="hint" style="margin-left:auto">основная воронка не удаляется</span>'}
      </div>`;
    const list=inner.querySelector("#pe-list");
    list.innerHTML=stages.map((s,i)=>`<div class="pe-row" draggable="true" data-i="${i}"
        style="display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;margin-bottom:4px;background:var(--panel);cursor:grab">
      <span style="color:var(--muted)">⠿</span>
      <input class="pe-label" data-i="${i}" value="${esc(s.label||"")}" style="flex:1" placeholder="Название этапа">
      <input class="pe-key" data-i="${i}" value="${esc(s.key||"")}" style="width:110px;font-family:monospace;font-size:12px" placeholder="ключ" title="служебное имя, латиницей">
      <button type="button" class="pe-del" data-i="${i}" title="убрать этап">✕</button>
    </div>`).join("");
    list.querySelectorAll(".pe-label").forEach(el=>el.oninput=()=>{stages[+el.dataset.i].label=el.value;});
    list.querySelectorAll(".pe-key").forEach(el=>el.oninput=()=>{stages[+el.dataset.i].key=el.value.trim();});
    list.querySelectorAll(".pe-del").forEach(b=>b.onclick=()=>{
      if(stages.length<=1){alert("нужен хотя бы один этап");return;}
      stages.splice(+b.dataset.i,1);draw();});
    let dragI=null;
    list.querySelectorAll(".pe-row").forEach(row=>{
      row.ondragstart=()=>{dragI=+row.dataset.i;row.style.opacity=".4";};
      row.ondragend=()=>row.style.opacity="1";
      row.ondragover=e=>e.preventDefault();
      row.ondrop=e=>{e.preventDefault();const to=+row.dataset.i;if(dragI===null||dragI===to)return;
        const [moved]=stages.splice(dragI,1);stages.splice(to,0,moved);draw();};
    });
    inner.querySelector("#pe-add").onclick=()=>{
      const n=stages.length+1;
      stages.push({key:`stage_${Date.now()%100000}`,label:`Этап ${n}`});draw();
      inner.querySelector(".pe-row:last-child .pe-label").focus();};
    inner.querySelector("#pe-cancel").onclick=close;
    inner.querySelector("#pe-save").onclick=async()=>{
      const name=inner.querySelector("#pe-name").value.trim();
      if(!name){alert("нужно название воронки");return;}
      const clean=stages.map(s=>({key:(s.key||"").trim(),label:(s.label||"").trim()}));
      if(clean.some(s=>!s.key||!s.label)){alert("у каждого этапа должны быть и ключ, и название");return;}
      const send=force=>api(`/api/pipeline/${p.id}/update`,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({name,stages:clean,force})});
      let r=await send(false);
      if(r&&r.needs_confirm){
        if(!confirm("⚠️ "+r.warn))return;
        r=await send(true);
      }
      if(r&&r.error){alert(r.error);return;}
      close();route();};
  };
  draw();
}
function dealTitle(d){return esc(d.title||d.company_name||"сделка");}
function dealSub(d){return esc([d.person_name||d.contact_name,d.amount?(Number(d.amount).toLocaleString("ru-RU")+" ₽"):""].filter(Boolean).join(" · "));}
function money(v){return v?Number(v).toLocaleString("ru-RU")+" ₽":"";}
// Компактная сумма для шапки колонки: 1 250 000 ₽ → 1,25 млн ₽
function moneyShort(v){
  const n=Number(v||0);
  if(!n)return "—";
  if(n>=1e6)return (n/1e6).toLocaleString("ru-RU",{maximumFractionDigits:2})+" млн ₽";
  if(n>=1e4)return Math.round(n/1e3).toLocaleString("ru-RU")+" тыс ₽";
  return n.toLocaleString("ru-RU")+" ₽";
}
// Цвет стадии: успех — зелёный, отвал — красный/серый, остальные — по градиенту воронки
const DEAL_LOST=new Set(["lost","blocked","stop"]);
function stageColor(key,i,total){
  if(key==="won")return "var(--green)";
  if(key==="lost"||key==="blocked")return "var(--red)";
  if(key==="stop")return "var(--faint)";
  if(key==="nurture")return "var(--purple)";
  const palette=["#4AA3FF","#00B4D8","#2DD4BF","#7CC800","#F4B740"];
  return palette[Math.min(i,palette.length-1)];
}
function daysSince(ts){
  if(!ts)return null;
  const t=Date.parse(String(ts).replace(" ","T"));
  if(isNaN(t))return null;
  return Math.floor((Date.now()-t)/86400000);
}
function dealAvaColor(s){
  let h=0;for(let i=0;i<String(s).length;i++)h=(h*31+String(s).charCodeAt(i))>>>0;
  return ORG_COLORS[h%ORG_COLORS.length];
}
function dealCardHtml(d,stale){
  const nm=d.title||d.company_name||"сделка";
  const who=d.person_name||d.contact_name||d.company_name||"";
  const age=daysSince(d.updated_at||d.created_at);
  const chips=[];
  if(d.product)chips.push(`<span class="kchip">${esc(d.product)}</span>`);
  if(d.meeting_at)chips.push(`<span class="kchip">📅 ${esc(fmt(d.meeting_at)||d.meeting_at)}</span>`);
  // «Завис» — давно не двигали. Порог зависит от стадии: финальные не считаем.
  if(age!==null&&stale&&age>=stale)
    chips.push(`<span class="kchip ${age>=stale*2?"hot":"warn"}">⏳ ${age} дн. без движения</span>`);
  return `<div class="kcard" draggable="true" data-id="${d.id}">
    <div class="ktop">
      <div class="kava" style="background:${dealAvaColor(who||nm)}">${esc(orgInitials(who||nm))}</div>
      <div class="nm">${esc(nm)}</div>
    </div>
    ${d.amount?`<div class="kamt">${money(d.amount)}</div>`:""}
    ${who&&who!==nm?`<div class="mt">${esc(who)}</div>`:""}
    ${d.company_name&&d.company_name!==nm?`<div class="mt">🏢 ${esc(d.company_name)}</div>`:""}
    ${chips.length?`<div class="kfoot">${chips.join("")}</div>`:""}
  </div>`;
}
let DEAL_STAGE_FILTER=null;    // клик по сегменту воронки — подсветить одну стадию
function renderDealsKanban(mount){
  const stages=dealStagesFor(PIPELINE_SEL);
  const by={};stages.forEach(s=>by[s.key]=[]);
  DEALS.forEach(d=>{const k=by[d.stage]?d.stage:(stages[0]&&stages[0].key);if(by[k])by[k].push(d);});
  const sum=k=>(by[k]||[]).reduce((s,d)=>s+(Number(d.amount)||0),0);
  const colColor={};stages.forEach((s,i)=>colColor[s.key]=stageColor(s.key,i,stages.length));

  // ── полоса-воронка: сколько сделок и денег на каждой стадии ──
  const total=DEALS.length||1;
  const bar=document.createElement("div");bar.className="funnelbar";
  bar.innerHTML=stages.map(s=>{
    const n=(by[s.key]||[]).length;
    return `<div class="fseg ${DEAL_STAGE_FILTER===s.key?"on":""}" data-s="${s.key}" style="--sc:${colColor[s.key]}"
        title="${esc(s.label)}: ${n} сдел., ${money(sum(s.key))||"0 ₽"} · ${Math.round(n/total*100)}% воронки">
      <div class="fl">${esc(s.label)}</div>
      <div class="fv">${n}</div>
      <div class="fs">${moneyShort(sum(s.key))}</div>
    </div>`;
  }).join("");
  mount.appendChild(bar);

  const kan=document.createElement("div");kan.className="kanban";
  kan.innerHTML=stages.map(s=>{
    const list=by[s.key]||[];
    // «зависание» считаем только для рабочих стадий — в won/lost сделка и должна лежать
    const stale=(s.key==="won"||DEAL_LOST.has(s.key))?null:7;
    return `<div class="kcol ${DEAL_STAGE_FILTER&&DEAL_STAGE_FILTER!==s.key?"dimmed":""}" style="--sc:${colColor[s.key]}">
      <h3>
        <div class="hr1"><span class="nm">${esc(s.label)}</span><span class="n">${list.length}</span></div>
        <div class="sum">${moneyShort(sum(s.key))}</div>
      </h3>
      <div class="kbody" data-s="${s.key}">
        ${list.map(d=>dealCardHtml(d,stale)).join("")}
        <button class="kadd" data-s="${s.key}">＋ сделка</button>
      </div>
    </div>`;
  }).join("")
  // Колонка-приёмник в конце доски: перетащил карточку сюда — сделка ушла в архив,
  // а не потерялась безвозвратно, как было бы с удалением. Своя колонка, а не
  // стадия воронки — архив не должен зависеть от того, как оператор настроил стадии.
  +`<div class="kcol karchive" style="--sc:var(--muted)">
      <h3><div class="hr1"><span class="nm">🗄 Архив</span></div></h3>
      <div class="kbody" data-archive="1">
        <div class="sub" style="padding:8px 4px">перетащи сюда, чтобы убрать сделку из воронки</div>
      </div>
    </div>`;
  mount.appendChild(kan);

  bar.querySelectorAll(".fseg").forEach(seg=>seg.onclick=()=>{
    DEAL_STAGE_FILTER=DEAL_STAGE_FILTER===seg.dataset.s?null:seg.dataset.s;
    mount.innerHTML="";renderDealsKanban(mount);
  });
  kan.querySelectorAll(".kcard").forEach(card=>card.onclick=()=>openDeal(+card.dataset.id));
  kan.querySelectorAll(".kadd").forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const title=prompt("Название сделки:");if(!title)return;
    const r=await api("/api/deals",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({title,pipeline_id:PIPELINE_SEL,stage:b.dataset.s})});
    if(r.error){alert(r.error);return;}
    route();
  });
  let drag=null;
  kan.querySelectorAll(".kcard").forEach(card=>{
    card.ondragstart=e=>{drag=+card.dataset.id;card.classList.add("dragging");
      try{e.dataTransfer.setData("text/plain","deal:"+card.dataset.id);}catch(_){}};
    card.ondragend=()=>{card.classList.remove("dragging");};
  });
  kan.querySelectorAll(".kbody").forEach(col=>{
    col.ondragover=e=>{if(drag==null)return;e.preventDefault();col.classList.add("over");};
    col.ondragleave=()=>col.classList.remove("over");
    col.ondrop=async e=>{e.preventDefault();col.classList.remove("over");
      if(drag==null)return;
      if(col.dataset.archive){
        await api(`/api/deal/${drag}/archive`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({archived:true})});
        const i=DEALS.findIndex(x=>x.id===drag);if(i>=0)DEALS.splice(i,1);
        drag=null;mount.innerHTML="";renderDealsKanban(mount);return;
      }
      const s=col.dataset.s;
      await api(`/api/deal/${drag}/move`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({stage:s})});
      const d=DEALS.find(x=>x.id===drag);if(d)d.stage=s;drag=null;route();};
  });
}

// ===== Карточка СДЕЛКИ (drawer) =====
async function openDeal(id){
  const d=await api(`/api/deal/${id}`);
  if(d.error){alert("Сделка не найдена");return;}
  if(!PIPELINES.length){try{await loadPipelines();}catch(e){}}
  $("#dr-title").textContent=d.title||("Сделка #"+id);
  const stages=dealStagesFor(d.pipeline_id);
  const pOpts=PIPELINES.map(p=>`<option value="${p.id}" ${p.id===d.pipeline_id?"selected":""}>${esc(p.name)}</option>`).join("");
  // Шкала стадий, как в карточке сделки Битрикс24: пройденные закрашены, текущая
  // подсвечена, клик по любой — сразу двигает сделку (без «Сохранить»).
  const curIdx=stages.findIndex(s=>s.key===d.stage);
  const stageBar=`<div class="stagebar" style="--sc2:${stageColor(d.stage,Math.max(curIdx,0),stages.length)}">
    ${stages.map((s,i)=>`<button data-stage="${s.key}" title="${esc(s.label)}"
      class="${s.key===d.stage?"cur":(curIdx>=0&&i<curIdx?"done":"")}">${esc(s.label)}</button>`).join("")}</div>`;
  const age=daysSince(d.updated_at||d.created_at);
  const head=`<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px">
    <div style="font-size:24px;font-weight:800;font-variant-numeric:tabular-nums">${d.amount?money(d.amount):'<span class="no">сумма не указана</span>'}</div>
    ${age!==null?`<span class="hint">последнее движение ${age===0?"сегодня":age+" дн. назад"}</span>`:""}
  </div>`;
  $("#dr-body").innerHTML=`
    ${head}
    ${stageBar}
    <div class="field"><label>Название</label><input data-k="title" value="${esc(d.title||"")}"></div>
    <div class="row2"><div class="field"><label>Сумма ₽</label><input data-k="amount" class="mono" value="${esc(d.amount||"")}"></div>
      <div class="field"><label>Продукт</label><input data-k="product" value="${esc(d.product||"")}"></div></div>
    <div class="row2"><div class="field"><label>Воронка</label><select data-k="pipeline_id">${pOpts}</select></div>
      <div class="field"><label>Стадия</label><select data-k="stage">${stages.map(s=>`<option value="${s.key}" ${s.key===d.stage?"selected":""}>${esc(s.label)}</option>`).join("")}</select></div></div>
    <div class="field"><label>Компания</label><div class="v">${d.company_name?`<span class="lnk" data-cid="${d.company_id}" style="cursor:pointer">🏢 ${esc(d.company_name)}</span>`:'<span class="no">—</span>'}</div></div>
    <div class="field"><label>Контакт</label><div class="v">${(d.person_name||d.contact_name)?`<span class="lnk" data-pid="${d.contact_id}" style="cursor:pointer">👤 ${esc(d.person_name||d.contact_name)}</span>${d.phone?` <span class="hint mono">${esc(d.phone)}</span>`:""}`:'<span class="no">—</span>'}</div></div>
    ${d.meeting_at?`<div class="field"><label>Встреча</label><div class="v">📅 ${esc(fmt(d.meeting_at)||d.meeting_at)}${d.zoom_link?` · <a href="${esc(d.zoom_link)}" target="_blank">ссылка</a>`:""}</div></div>`:""}
    <div class="field"><label>Заметки</label><textarea data-k="notes" rows="3">${esc(d.notes||"")}</textarea></div>
    <div class="ttoolbar" style="margin:6px 0"><button class="primary" id="dl-save">Сохранить</button><button id="dl-del">Удалить</button><span class="hint" id="dl-msg"></span></div>`;
  // Если стадий много, шкала прокручивается — подгоняем её к текущей стадии
  const curBtn=$("#dr-body").querySelector(".stagebar button.cur");
  if(curBtn)curBtn.scrollIntoView({block:"nearest",inline:"center"});
  // Клик по сегменту шкалы — мгновенный перевод стадии
  $("#dr-body").querySelectorAll(".stagebar button").forEach(b=>b.onclick=async()=>{
    const s=b.dataset.stage;if(s===d.stage)return;
    const r=await api(`/api/deal/${id}/move`,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({stage:s})});
    if(r&&r.error){alert(r.error);return;}
    await openDeal(id);                       // перерисовать карточку под новую стадию
    if(location.hash==="#deals")route();
  });
  $("#dl-save").onclick=async()=>{const body={};$("#dr-body").querySelectorAll("[data-k]").forEach(el=>body[el.dataset.k]=el.dataset.k==="pipeline_id"?(+el.value||null):el.value);
    await api(`/api/deal/${id}/update`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    $("#dl-save").textContent="✓ сохранено";setTimeout(route,500);};
  $("#dl-del").onclick=async()=>{if(!confirm("Удалить сделку?"))return;
    await api(`/api/deal/${id}/delete`,{method:"POST"});$("#drawer").classList.remove("open");route();};
  $("#dr-body").querySelectorAll(".lnk[data-cid]").forEach(el=>el.onclick=()=>openCompany(+el.dataset.cid));
  $("#dr-body").querySelectorAll(".lnk[data-pid]").forEach(el=>el.onclick=()=>openDossier(+el.dataset.pid));
  $("#drawer").classList.add("open");
}

    <div style="font-weight:600;color:${warmedToday?'var(--green)':'var(--muted)'}">${warmedToday?'🟢 Сегодня прогревался':'⚪ Сегодня не прогревался'}${a.last_warm_at?` · последний раз ${rel(a.last_warm_at)}`:' · ещё ни разу'} · стадия ${a.warm_stage||0}/14</div>
    ${warmRuns.length?warmRuns.map(w=>`<div class="hint" style="margin-top:3px">• ${esc(w.text)} <span style="opacity:.65">(${rel(w.ts)})</span></div>`).join(''):'<div class="hint" style="margin-top:3px">отчётов пока нет — запусти «Прогреть сейчас», и здесь появится, что аккаунт делал</div>'}</div>`;
  $("#dr-body").innerHTML=`
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:14px">

      <div><button id="ag-ava-btn">📷 Загрузить фото</button><input type="file" id="ag-ava-file" accept="image/*" style="display:none">
        <div class="hint" style="margin-top:6px">до 5 МБ, png/jpg</div></div>
    </div>
    <div class="row2"><div class="field"><label>Ярлык</label><input data-k="label" value="${esc(a.label||"")}"></div>
      <div class="field"><label>Телефон</label><input data-k="phone" class="mono" value="${esc(a.phone||"")}"></div></div>
    <div class="row2"><div class="field"><label>Ник TG</label><input data-k="username" value="${esc(a.username||"")}"></div>
      <div class="field"><label>Лимит/день</label><input data-k="daily_limit" type="number" class="mono" value="${a.daily_limit||15}"></div></div>
    <div class="row2"><div class="field"><label>Роль</label><select data-k="role">${roleOpts}</select></div>
      <div class="field"><label>Статус</label><select data-k="status">${stOpts}</select></div></div>
    <div class="field"><label>🔖 Тип номера (откуда)</label><select data-k="kind">${kindOpts}</select>
      <div class="hint" style="margin-top:4px">Родной — личный (помечай 🏠 выше, чтобы не трогала автоматика). Своя симка — живая купленная SIM. Купленный — расходный аккаунт с маркета.</div></div>
    <label style="display:flex;align-items:center;gap:8px;margin:2px 0 12px;font-weight:600;padding:8px 10px;background:var(--panel2);border-radius:8px"><input type="checkbox" data-k="protected" ${a.protected?"checked":""}> 🏠 Родной (личный) номер — автоматика (прогрев/рассылка) его НЕ трогает</label>
    <div class="field"><label>📝 Описание профиля (для команды)</label>
      <textarea data-k="description" rows="4" placeholder="Кто этот агент, легенда, специализация, особенности общения…">${esc(a.description||"")}</textarea>
      <div class="ttoolbar" style="margin:6px 0 0"><button id="ag-gen-bio">Сгенерировать bio (ИИ)</button><button id="ag-profile-setup">Оформить профиль в Telegram (фото + bio + спрятать номер)</button></div>
      <div class="hint" style="margin-top:4px">Поставит аватар и био (первые 70 симв. описания) прямо в аккаунт. Нужна авторизованная сессия. Сохрани изменения перед оформлением.</div>
      <pre id="ag-profile-log" style="display:none;white-space:pre-wrap;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:8px;max-height:160px;overflow:auto;font-size:12px"></pre></div>
    <div class="field"><label>🛡️ Прокси аккаунта</label>
      <input data-k="proxy" id="ag-proxy-inp" class="mono" value="${esc(a.proxy||"")}" placeholder="socks5://user:pass@host:port  (для купленных — SOCKS5, не MTProto)">
      ${tgGeoHint(a.phone,a.proxy)}
